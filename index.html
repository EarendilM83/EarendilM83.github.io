re-publish.", "adapt": "Course tree with inline session rows and snapshot-binding rail.", "states": ["unattached (publish allowed, warned)", "attached (drawn)", "multi-module", "re-publish v2 upgrade prompt"], "story": "The activity finishes its journey: draft done, grade-check 5/5, peer review by someone who is not the author, then publish — which writes an immutable snapshot and attaches it to a module session. The question bank feeds both directions: items imported into the draft, validated items exported for reuse across programs, with the private → course → global visibility ladder. Mechanic config (lives / wager / timer) is tuned per shell and frozen with the snapshot.", "why": "Publishes must be boring. Reviewed by a second pair of eyes (law: reviewer ≠ author), frozen so later bank edits never corrupt live activities, attached so students actually find it — and reusable so the next program does not start from zero.", "what": "RK-08: four-step gate with checklist and reviewer request, publish locked until every step is green. RK-09: bank list with visibility ladder, import/export, per-item snapshot status. RK-10: per-shell lives/wager/timer/no-help config with defaults compare. RK-11: module/session picker with per-attachment snapshot binding.", "how": "Gate state machine draft → review → published with role check reviewer ≠ author; publish writes the snapshot atomically and links attachments to it; bank import copies items into the draft (source stays clean); re-publish creates v2 with explicit per-attachment upgrade. Metric: 0 published activities mutated after publish.", "kata": "Kata: absent — and why: governance surface; the only characters here are ❤ and 🪙 from the mechanic config.", "edge": "Edge cases: Author requests review from themselves → blocked by role check; reviewer rejects → back to draft with comments, grade-check resets on edited items only; publish while window already open → allowed, students see it immediately; import of a globally-edited item → copy, not reference; deleting an attached module → attachment dangles with “orphan” warning, activity stays published.", "metric": "0 published activities mutated after publish.", "chain": "grade-check hits 5/5 on RK-07 → RK-08 gate · steps ①② green → author taps “Request review” → picks M. Ferreira → ③ review · role check passes (reviewer ≠ author) → reviewer approves (1 comment resolved) → author taps “Publish” → snapshot v1 written atomically · status → published → opens RK-11 → attaches v1 to session 3.2 → live: students see “👹 Flexbox boss · 💻 · closes Fri 18:00” on the module card"}, "RL-01": {"name": "Program roadmap", "flow": "JA-L01 · Open the map student · mobile-first · returning session", "status": "new", "purpose": "Vertical node map of the enrolled program: unit banners, starred done nodes, pulsing current node, chests + green checkpoints, locked/sealed ahead, device badges on nodes, legend link pinned.", "adapt": "two-unit-wide serpentine with rail / side nav (roadmap item centered &amp; active); current node auto-centered, legend pinned top-right as a card.", "states": ["mid-unit current node", "unit complete → next banner pins", "all done → capstone pending (seal date shown)", "empty program (→ RL-06)", "stale cache (skeleton &lt;800ms)"], "story": "“As a student opening the app, I want to land on my program's roadmap and read my exact position — what's done, where I am, what's next — in under five seconds, so the day's session starts without thinking.”", "why": "The map is the daily entry point and the home itself (D-23); if “what do I do now?” isn't answered instantly, the streak dies before the first tap.", "what": "The enrolled program's path rendered as a dark vertical map: unit banners, starred done nodes, one pulsing current node, chests and green JUMP HERE? checkpoints interleaved, locked (🔒) and date-sealed (🗓) nodes ahead — every node carrying its device badge (📱/💻) set by the builder (R-K), so a desktop-only floor never surprises a phone.", "how": "Path is fetched per program while account-level meta (🔥⚡⬡, D-01) stays in the header; on load the map scroll-pins the current node above the fold; the single CTA affordance is tapping the pulsing node; bottom nav holds ≤6 items with the roadmap centered (D-23). Metric: time-to-first-node-tap &lt; 5s for ≥70% of sessions.", "kata": "Kata: Nova the guide-fox: “One tap on the glowing floor and you're learning — I'll keep the path warm. And the little 📱💻 tags mean I already checked your pockets.”", "edge": "Edge cases: mid-unit resume → auto-scroll so the current node sits above the fold; program with zero published modules → RL-06 empty state, never a blank map; all floors done but capstone sealed → banner shows the seal date, no fake CTA; two enrollments → RL-08 switcher decides which path renders; stale cache → skeleton nodes for &lt;800ms then real path, never gray boxes; device-restricted node (💻 set in R-K) renders its badge on the node itself, before any tap.", "metric": "time-to-first-node-tap &lt; 5s for ≥70% of sessions.", "chain": "student opens app · warm session → RA-10 warm start · rollups applied → RL-01 program roadmap · current node scroll-pinned, pulsing → taps pulsing Floor 7 node → RL-02 node CTA card → taps START → RC-02 floor intro (R-C loop shell, D-22)"}, "RL-02": {"name": "Node CTA card", "flow": "JA-L02 · Tap a node → CTA card student · decision moment", "status": "new", "purpose": "Anchored card under the tapped node: title, mechanic + est. time, reward, streak impact, big white START on pink, device badge. Tap-elsewhere dismisses; one card at a time.", "adapt": "card docks to the right of the node column; same content, wider reward row, dismiss on outside click or Esc.", "states": ["current node (START)", "done node (REPLAY, best stars, no XP double-dip)", "locked node (unlock rule, no START)", "sealed node (date + Remind me)", "💻-only node on phone (“Open on desktop”)"], "story": "“As a student, when I tap any node I want one card that tells me what I'll do, how long it takes, what it pays and what it does to my streak — then one big START, or the honest reason there isn't one.”", "why": "The tap-to-card moment is the conversion point from browsing to doing; every question the card leaves open bleeds sessions.", "what": "A CTA card pops directly under the tapped node: title, mechanic + estimated time, reward, streak impact, big white START on pink, device badge top-right (rule set in R-K, surfaced here). Done nodes show REPLAY with best stars; locked nodes show the unlock rule instead of START; sealed nodes show the open date + Remind-me.", "how": "The card anchors to its node and the map nudges so the card never clips; tapping anywhere else dismisses; exactly one card exists at a time — a second tap swaps, never stacks. Metric: node-tap → START rate ≥ 55%.", "kata": "Kata: Bram the badger-coach: “Six minutes, forty XP, streak saved. Hit START before doubt does.”", "edge": "Edge cases: tapping a locked node opens the card with the unlock rule (JA-L04), never a dead toast; done node → REPLAY with best stars shown, no XP double-dip; device-restricted node (💻 only, set in R-K) on a phone → badge explains, START becomes “Open on desktop”; card near screen bottom → map auto-nudges, card never clips; rapid double-tap → single card, no stacked STARTs; XP daily cap 300 reached → reward line reads “cap reached — still counts for streak ★” instead of hiding the card.", "metric": "node-tap → START rate ≥ 55%.", "chain": "student taps pulsing Floor 7 node on RL-01 → RL-02 CTA card pops under node · map nudges, card fully visible → taps big white START → RC-02 floor intro (stakes declared) → floor run"}, "RL-03": {"name": "Checkpoint test-out", "flow": "JA-L03 · Checkpoint jump — “JUMP HERE?” student · experienced / re-sitter", "status": "new", "purpose": "Bottom sheet over the dimmed map: 6-question quiz drawn from the unit's floors, progress bar, pass threshold (“4+ to jump”) and attempt counter pinned, single “Check” action per question.", "adapt": "sheet centers wider over a scrim / becomes a dialog; question counter, pass threshold and attempt status pinned in the header.", "states": ["in-progress Q1–Q6", "answer selected", "last-attempt-this-week warning", "offline pause (server-held)", "quit early (counts as no attempt)"], "story": "“As a student who already knows this material, I want a fair 6-question test-out so I can skip to the boss without grinding floors I've mastered — and a soft, exact landing if I'm bluffing.”", "why": "Experienced learners churn when forced through basics; a fair test-out keeps them, while the pass bar keeps bluffers from skipping a gate that protects the credential.", "what": "Green checkpoint node → “JUMP HERE?” sheet: 6 questions drawn from the unit's floors. Pass ≥4/6 → jump straight to the boss floor with skipped-floor XP paid at 60% and mastery flagged “unverified” until the boss is beaten; fail → routed to the exact weak floor the misses came from.", "how": "One attempt per checkpoint per 7 days; no hints; no streak loss on fail; quitting early counts as no attempt; the result sheet always states what happens to XP and where you land. Metric: test-out attempts that convert to boss-pass within 48h ≥ 60%.", "kata": "Kata: Pip the magpie-examiner: “Six questions, no hints, no shame — jump if you know it, land soft if you don't.”", "edge": "Edge cases: connection drops mid-sheet → attempt pauses server-side, resumes on the same question, never auto-fails; quitting early counts as no attempt (cooldown unconsumed); exactly 4/6 is a pass and says so loudly; accessibility mode → no per-question timer; re-sitters who pass → boss floor still enforces full integrity rules (RL-05); second tap inside 7 days → checkpoint node shows “retry in 4d”, sheet never opens.", "metric": "test-out attempts that convert to boss-pass within 48h ≥ 60%.", "chain": "student taps green ? checkpoint node on RL-01 → RL-03 “JUMP HERE?” sheet · Q1…Q6 from Unit 2 floors · 1 attempt/7d → answers + taps Check on each → score ≥4/6: RL-07 pass — jump to boss, XP at 60%, mastery unverified → taps Jump to the Boss 🏆 → RL-05 boss preview"}, "RL-07": {"name": "Checkpoint result", "flow": "JA-L03 · Checkpoint jump — “JUMP HERE?” student · experienced / re-sitter", "status": "new", "purpose": "Verdict sheet: pass ≥4/6 → jump to boss floor with reduced XP (60%) + “mastery unverified” note + full-path alternative; fail &lt;4/6 → routed to the exact weak floor with the why, no streak lost, retry in 7 days.", "adapt": "adds per-question breakdown so the student sees which floor the fail routes to and why.", "states": ["pass ≥4/6", "exactly 4/6 (pass, said loudly)", "fail &lt;4/6 routed", "reduced-XP disclosure", "retry in 7 days"], "story": "“As a student who already knows this material, I want a fair 6-question test-out so I can skip to the boss without grinding floors I've mastered — and a soft, exact landing if I'm bluffing.”", "why": "Experienced learners churn when forced through basics; a fair test-out keeps them, while the pass bar keeps bluffers from skipping a gate that protects the credential.", "what": "Green checkpoint node → “JUMP HERE?” sheet: 6 questions drawn from the unit's floors. Pass ≥4/6 → jump straight to the boss floor with skipped-floor XP paid at 60% and mastery flagged “unverified” until the boss is beaten; fail → routed to the exact weak floor the misses came from.", "how": "One attempt per checkpoint per 7 days; no hints; no streak loss on fail; quitting early counts as no attempt; the result sheet always states what happens to XP and where you land. Metric: test-out attempts that convert to boss-pass within 48h ≥ 60%.", "kata": "Kata: Pip the magpie-examiner: “Six questions, no hints, no shame — jump if you know it, land soft if you don't.”", "edge": "Edge cases: connection drops mid-sheet → attempt pauses server-side, resumes on the same question, never auto-fails; quitting early counts as no attempt (cooldown unconsumed); exactly 4/6 is a pass and says so loudly; accessibility mode → no per-question timer; re-sitters who pass → boss floor still enforces full integrity rules (RL-05); second tap inside 7 days → checkpoint node shows “retry in 4d”, sheet never opens.", "metric": "test-out attempts that convert to boss-pass within 48h ≥ 60%.", "chain": "student taps green ? checkpoint node on RL-01 → RL-03 “JUMP HERE?” sheet · Q1…Q6 from Unit 2 floors · 1 attempt/7d → answers + taps Check on each → score ≥4/6: RL-07 pass — jump to boss, XP at 60%, mastery unverified → taps Jump to the Boss 🏆 → RL-05 boss preview"}, "RL-04": {"name": "Lock vs seal", "flow": "JA-L04 · Locked vs schedule-sealed student · blocked moment", "status": "new", "purpose": "Tap a 🔒 node → actionable card with route to the blocking capstone; tap a 🗓 node → waiting card with exact open date + Remind me. Icon, copy and CTA are deliberately different so the semantics are learned once.", "adapt": "both cards can show side-by-side as a comparison row (“Why can't I go yet?”); same copy rules, Esc/outside click dismisses.", "states": ["boss-gate lock (actionable)", "date seal with starts_on (waiting)", "seal + lock combined (date wins headline, both rules shown)", "offline (cached seal date, “as of last sync”)"], "story": "“As a student hitting a node I can't enter, I want to know instantly whether there's something I can do about it (beat the capstone) or whether I'm simply waiting for a date — with the right action for each, never the wrong hope.”", "why": "Conflating “you must act” with “you must wait” causes rage-quits; each blocker needs its own icon, copy and behavior.", "what": "Two lock semantics: 🔒 boss-gate lock — actionable, card says “Beat the Unit 2 capstone to open” with a Go-to-capstone CTA; 🗓 date seal — waiting, card shows the module's starts_on date and a 🔔 Remind-me ghost button, with no action that opens it early.", "how": "Sealed nodes never show START, even when prerequisites are met; locked nodes always route to the blocking boss; when a node is both sealed and locked, the date wins the headline and the lock rule lists beneath. Metric: wrong-expectation support tickets about locked content → 0.", "kata": "Kata: Marta the owl-warden: “A lock you can pick and a door with a timer are not the same door — I label both honestly.”", "edge": "Edge cases: node both sealed and locked → date seal wins the headline, lock rule listed beneath; teacher pulls starts_on forward → seal updates in place, Remind-me subscribers notified; student beats capstone while sealed → unit shows “unlocked · opens 14 Apr”; offline → cached seal date shown with “as of last sync”; countdown never shown under 1-hour granularity to avoid camping; Remind-me push counts inside the ≤2/day push budget (the in-app card does not).", "metric": "wrong-expectation support tickets about locked content → 0.", "chain": "student taps 🔒 Unit 3 node on RL-01 → RL-04 actionable card: “Beat the Unit 2 capstone to open” → taps Go to capstone 🏆 → RL-05 boss preview → boss passed (server event) → Unit 3 unlocks in place on RL-01 · lock removed"}, "RL-05": {"name": "Boss preview", "flow": "JA-L05 · Boss node preview student · high-stakes moment", "status": "new", "purpose": "Integrity card for the capstone: stakes (10 items · ≥8 · no hints · no wagers · connection required) + mercy (routed review + 24h lock, streak safe) + device badge, all beside START.", "adapt": "two-column card — stakes left, mercy + START right; connection status live-checked and shown.", "states": ["ready to start", "offline (START disabled, live reason)", "in 24h lock (retry timer, review-only CTA)", "passed (stars, summary, no re-entry)"], "story": "“As a student about to start a capstone, I want the full integrity rules — and exactly what failure costs — sitting next to the START button, so I commit with open eyes.”", "why": "Surprise rules on a high-stakes exam feel like a trap; informed consent raises both attempt quality and pass rates.", "what": "Tapping the 🏆 boss node opens the integrity card: stakes — 10 items, ≥8 to pass, no hints, no wagers, connection required — with mercy stated beside START: fail → routed review of your weak floors + 24h lock before retry, and your streak is never at risk.", "how": "The card must be scrolled fully before START enables on the first attempt; connection is live-checked and offline disables START with the reason; during the 24h lock the only CTA is “review floors”. Metric: first-attempt boss pass rate ≥ 55%.", "kata": "Kata: Rook the raven-invigilator: “Ten questions, no lifelines — but stumble and I hand you a map back, not a door slammed.”", "edge": "Edge cases: connection lost on the preview → START disabled with a live reason, re-checked every 10s; 24h lock active → card shows countdown + “review floors” as the only CTA; passed boss → node shows stars, tap opens a summary (no re-entry, no XP farm); screen-reader → rules announced before the START control; device-restricted capstone on phone → badge says 💻 required, START replaced with “Open on desktop”; connection lost mid-run → submit loss = 0, the attempt voids safely instead of auto-failing.", "metric": "first-attempt boss pass rate ≥ 55%.", "chain": "student taps 🏆 boss node on RL-01 (or arrives via RL-07 jump) → RL-05 integrity card · stakes + mercy beside START → scrolls card fully (first attempt) → START enables → taps START CAPSTONE · online ✓ → capstone run (R-C loop shell, D-22 · 10 items) → pass ≥8: unit unlocks, ★ awarded"}, "RL-06": {"name": "Legend &amp; empty path", "flow": "JA-L06 · Mechanic chips &amp; empty path student · orientation + edge state", "status": "new", "purpose": "Node-kind legend (⚔ 🎲 🏆 🎁 ⏱) as a dismissible sheet, pinned on first visit; empty-map state with “🔔 Notify me” + review-floors alternative — never a dead end.", "adapt": "legend renders as a card row above the empty state; review floors listed with est. times in a side column / table.", "states": ["legend sheet (first-visit pinned)", "empty program unsubscribed", "subscribed (“You're on the list”)", "review floors available", "none completed (library sample floor)"], "story": "“As a student, I can decode every node kind from a legend — and if my program has no path yet, I get a notify-me plus something useful to do right now, never a dead end.”", "why": "Icons without a legend are trivia; an unpublished program without a next step is a churn event.", "what": "Legend of node kinds (floor ⚔ / chips 🎲 / boss 🏆 / chest 🎁 / drill ⏱) reachable from the map; empty-map state with 🔔 Notify-me + a review-floors alternative. Multi-program students also get the switcher strip (RL-08): account-level streak/XP/coins (D-01), one path per program.", "how": "Legend is a dismissible sheet pinned open on first visit; Notify-me subscribes the student to the program's publish event (push + inbox card on publish; the push counts in the ≤2/day budget, the in-app card does not); review floors come only from programs with ≥1 completed floor, else a free sample floor from the school library. Metric: empty-path sessions ending in notify-me or a review-floor start ≥ 65%.", "kata": "Kata: Sol the crane-cartographer: “Many paths, one traveller — your streak rides with you whichever road you pick.”", "edge": "Edge cases: single-program student → switcher strip hidden entirely (no chrome for a choice that doesn't exist); sealed program chip → tap shows the seal date, never swaps the map into an empty shell; program archived mid-path → chip remains read-only with stars preserved; notify-me subscription survives logout and fires as a push + inbox card; review floors suggested only from programs with ≥1 completed floor, else the alternative is a free sample floor from the school library; legend re-opens anytime from the ⓘ pin on RL-01, not just on first visit.", "metric": "empty-path sessions ending in notify-me or a review-floor start ≥ 65%.", "chain": "first-ever visit to RL-01 → RL-06 legend sheet pinned open (⚔ 🎲 🏆 🎁 ⏱) → dismisses sheet → RL-01 map · legend reachable via ⓘ pin"}, "RL-08": {"name": "Program switcher", "flow": "JA-L06 · Mechanic chips &amp; empty path student · orientation + edge state", "status": "new", "purpose": "Horizontal strip of enrolled programs above the map; switching swaps the path, never the account HUD (🔥⚡⬡ stay put, D-01).", "adapt": "strip becomes cards with per-program progress bars; account HUD fixed in top bar / side nav.", "states": ["2+ programs", "active program marker", "sealed program chip (🗓, tap shows date)", "single program (strip hidden)", "archived program (read-only, stars kept)"], "story": "“As a student, I can decode every node kind from a legend — and if my program has no path yet, I get a notify-me plus something useful to do right now, never a dead end.”", "why": "Icons without a legend are trivia; an unpublished program without a next step is a churn event.", "what": "Legend of node kinds (floor ⚔ / chips 🎲 / boss 🏆 / chest 🎁 / drill ⏱) reachable from the map; empty-map state with 🔔 Notify-me + a review-floors alternative. Multi-program students also get the switcher strip (RL-08): account-level streak/XP/coins (D-01), one path per program.", "how": "Legend is a dismissible sheet pinned open on first visit; Notify-me subscribes the student to the program's publish event (push + inbox card on publish; the push counts in the ≤2/day budget, the in-app card does not); review floors come only from programs with ≥1 completed floor, else a free sample floor from the school library. Metric: empty-path sessions ending in notify-me or a review-floor start ≥ 65%.", "kata": "Kata: Sol the crane-cartographer: “Many paths, one traveller — your streak rides with you whichever road you pick.”", "edge": "Edge cases: single-program student → switcher strip hidden entirely (no chrome for a choice that doesn't exist); sealed program chip → tap shows the seal date, never swaps the map into an empty shell; program archived mid-path → chip remains read-only with stars preserved; notify-me subscription survives logout and fires as a push + inbox card; review floors suggested only from programs with ≥1 completed floor, else the alternative is a free sample floor from the school library; legend re-opens anytime from the ⓘ pin on RL-01, not just on first visit.", "metric": "empty-path sessions ending in notify-me or a review-floor start ≥ 65%.", "chain": "first-ever visit to RL-01 → RL-06 legend sheet pinned open (⚔ 🎲 🏆 🎁 ⏱) → dismisses sheet → RL-01 map · legend reachable via ⓘ pin"}, "RM-01": {"name": "Calendar", "flow": "JA-M01 · Calendar month + week · sessions &amp; deadlines on one grid", "status": "built", "purpose": "Month grid, color-coded sessions + deadlines; tap a day → day sheet with Zoom join (live in a 5-min window) and your attendance mark; week view for planning.", "adapt": "week strip and day detail side-by-side; desktop adds a \"next 7 days\" table and join buttons inline.", "states": ["month / week", "upcoming", "join live (5-min window)", "attended ✓ / absent ✗", "deadline due / overdue", "cancelled session", "empty day", "loading / offline stale"], "story": "Monday 08:10. Aya opens the calendar before class: Wednesday's algebra lecture already carries a Zoom join that will light up at 09:55, the physics problem-set deadline sits on the same grid in red, and yesterday's lab shows the lecturer's attendance mark ✓ — visible to her, not just to the school office.", "why": "One shared grid kills \"I didn't know\": sessions and deadlines live in the same timeline, and attendance is shown to the person it describes — the day it happens.", "what": "Month/week view of sessions (lectures, labs, Zoom) with deadlines on the same grid; the student's own attendance marks per session; a join button that activates exactly 5 minutes before start.", "how": "Extends the LMS schedule machinery (R-L): same event source, student-facing renderer. Zoom join activates 5 min before start and deep-links into the room; the attendance chip mirrors the lecturer's mark within a minute; deadlines stream from the assignment service; lecturer edits/cancels push a cell update + at most one inbox item (inside the ≤2/day push budget). Metric: ≥80% of Zoom joins arrive via the calendar deep-link; \"didn't know about it\" support reports → 0.", "kata": "Kata: 🦉 Ollie the owl: “Sessions and deadlines share one grid — nobody fails on 'I didn't know'.”", "edge": "Edge cases: Zoom join outside the 5-min window → countdown, no dead button · lecturer cancels/edits a session → cell updates + one notification (inside the ≤2/day budget) · deadline crossing midnight shown in the student's local timezone · attendance dispute deep-links to Report center (JA-M05) · device offline → last-synced grid with a stale banner and Join honestly disabled.", "metric": "≥80% of Zoom joins arrive via the calendar deep-link; \"didn't know about it\" support reports → 0.", "chain": "user taps Calendar tab → RM-01 month grid (sessions + deadlines dot-coded) → taps Wed 12 → RM-01 day sheet: Algebra 10:00, PS6 due 23:59 → 09:55 server opens join window → user taps Join → Zoom room deep-link · RM-01 cell marks ✓ attended when lecturer submits"}, "RM-02": {"name": "Profile home", "flow": "JA-M02 · Profile home identity card · programs · achievements shelf · settings · device accounts", "status": "new", "purpose": "Identity card + key numbers (streak, level, ⬡); horizontal achievements shelf; settings entry; device accounts list with \"this device\" marker and revoke.", "adapt": "two-column: identity + shelf left, settings/devices right; desktop shows full session history per device.", "states": ["loaded", "shelf empty (\"earn your first badge\")", "1 vs many programs", "device online / offline", "unknown-device alert", "revoked session", "loading"], "story": "Aya taps her avatar. One card says who she is — name, Grade 10, both her programs — next to a shelf of what she's earned, the settings entry, and the honest answer to \"where is my account logged in?\": three devices, last-seen times, and a revoke button on each one that isn't hers right now.", "why": "Students need a stable identity anchor: \"this is me, this is what I'm in, this is what I've earned\" — plus a truthful, actionable answer to \"where is my account signed in?\"", "what": "Identity card (photo, name, grade, program chips), key numbers, achievements shelf preview (links to RM-10), settings entry, and device accounts with per-device session state, \"this device\" marker, and revoke.", "how": "NEW screen: profile service for identity/programs, R-I achievements for the shelf, auth service for device sessions (last seen, location, revoke). Identity fields are read-only — corrections route to the school office, not to a text field. Unknown devices trigger a red alert row with a revoke-first flow; revoking the current device is blocked (sign out instead). Metric: ≥60% of weekly actives open profile monthly; account-recovery tickets naming a known device resolve 2× faster.", "kata": "Kata: 🦊 Fenn the fox: “Identity is read-only truth here — corrections go to the office, not to a text field.”", "edge": "Edge cases: name/program change pending at the office → \"update requested\" note instead of stale data · achievements shelf empty → honest \"earn your first badge\" link to quests, not filler · unknown device appears → red alert row + revoke-first flow · revoking the current device is blocked (sign out instead) · avatar missing → initials tile.", "metric": "≥60% of weekly actives open profile monthly; account-recovery tickets naming a known device resolve 2× faster.", "chain": "user taps avatar in app header → RM-02 profile home (identity + shelf + devices) → taps \"open all →\" on the shelf → RM-10 achievements"}, "RM-03": {"name": "Notification center", "flow": "JA-M03 · Notification center real inbox · categories · read/unread · the ≤2/day law printed", "status": "new", "purpose": "Category tabs (All / Streak / Buddy / Quests / School); unread highlighted, tap marks read and deep-links; law row pinned at the bottom.", "adapt": "category list left, message pane right; desktop adds mark-all-read and per-category mute.", "states": ["unread / read", "all categories", "empty category (\"nothing here — good\")", "muted category", "quiet-hours active indicator", "loading"], "story": "Aya opens the bell: a real inbox, not a badge dump. Unread first — a streak-at-risk warning, a buddy nudge from Omar, a quest unlock — then read items below, sorted into four fixed categories. At the bottom, the law is printed where it is enforced: at most 2 pushes a day, quiet hours 21:00–08:00, everything else waits here.", "why": "Notifications must be a trustworthy place, not a spam channel. Print the law inside the inbox and every push becomes checkable against it — students can hold us to it, quote it back if we break it.", "what": "Inbox with four fixed categories (streak / buddy / quests / school), read/unread state, per-item deep links, and the notification law rendered as a permanent bottom row from the live policy config.", "how": "NEW front-end over the existing notification service (R-J machinery): the server tags every item with one of the four categories; unread sorts first; tap marks read and deep-links to the target. The ≤2/day + quiet-hours row is rendered from the same policy object that enforces pushes, so the printed law can never drift from the enforced one. Metric: push opt-out &lt;5%; inbox open rate ≥40% of DAU.", "kata": "Kata: 🕊️ Noor the dove: “The law is printed at the bottom of the inbox — if we break it, the student can quote it back to us.”", "edge": "Edge cases: empty category → honest \"nothing here — good\" state · quiet hours active → 🌙 indicator on the header, pushes held but inbox still updates · category muted → still listed, never pushes · item whose target was deleted (quest closed) → read-only copy with \"no longer available\" · 500+ items → server-side paging, unread count stays exact.", "metric": "push opt-out &lt;5%; inbox open rate ≥40% of DAU.", "chain": "20:00 server: streak unprotected → push 1 of 2 today: \"Streak at risk\" (+ RM-03 item, unread) → user taps push or 🔔 → RM-03 inbox, item highlighted → taps item → marks read · deep-links to today's quest"}, "RM-04": {"name": "Assignment detail", "flow": "JA-M04 · Assignment detail + hand-in submit pipeline + device badge + due-state", "status": "built", "purpose": "Brief, rubric, due-state chip, device badge; submit options filtered by badge (photo only on 📱/both; repo/file/text on 💻/both); wrong-device submit blocked with an honest explanation.", "adapt": "brief left, submit panel right; desktop adds rubric table and repo-link preview.", "states": ["open", "due today", "overdue (late allowed / closed)", "badge 📱 / 💻 / both", "wrong-device blocked", "draft saved", "submitting", "submit failed (retry)"], "story": "The physics assignment carries a 💻 badge — desktop-only, set by the teacher in the builder (R-K). On her phone Aya reads the full brief, but the submit sheet says honestly \"open on a computer — repo/file/text only\". On the laptop the pipeline offers GitHub repo, file, or text — photo capture is never offered for a 💻 badge. She pastes her repo link, the server verifies it's reachable, and the hand-in status screen tracks submitted → checked → graded, ending in Ms. Haddad's per-criterion feedback.", "why": "Device honesty at the point of work: if an assignment needs a computer, the app says so instead of accepting a worse submission — and one pipeline carries the student from brief to feedback with zero ambiguity about where their work stands.", "what": "Existing submit pipeline (GitHub repo / photo / file / text) + NEW device badge (📱/💻/both) and due-state chip; wrong-device submit blocked with an honest explanation; hand-in status screen with grading timeline, grade, and per-criterion feedback view.", "how": "The badge is authored in the builder (R-K), rendered on the assignment, and enforced twice: client-side (submit options filtered, blocked with explanation) and server-side (rejected with code DEVICE_MISMATCH, so no client trick slips through). Due-state comes from the deadline service; a submission is timestamped at upload start; a failed submit keeps the draft — submit loss = 0. Status/feedback extend the graded-submissions machinery. Metric: device-mismatch submit attempts drop to &lt;2% after first block; median feedback opened within 24 h of grading ≥70%.", "kata": "Kata: 🦉 Ollie the owl: “A 💻 badge on a phone means 'read here, submit there' — we block with a reason, never with silence.”", "edge": "Edge cases: student on the wrong device → read-only brief + blocked submit with explanation (server rejects DEVICE_MISMATCH) · deadline passes mid-upload → submission timestamped at start, late flag computed honestly · repo link private/deleted at grading time → \"unreachable\" state shown to both sides · resubmit after grading only if the assignment allows it · feedback edited by the lecturer → \"edited\" marker with timestamp.", "metric": "device-mismatch submit attempts drop to &lt;2% after first block; median feedback opened within 24 h of grading ≥70%.", "chain": "user taps \"PS6 due 23:59\" on RM-01 calendar → RM-04 assignment detail (💻 badge, due-state) → on desktop: pastes GitHub repo link → RM-04 \"repo found ✓\" preview → taps Submit → RM-09 timeline: submitted 22:41 ✓ → server events: checked 08:15 → graded 11:02 → RM-09 grade 9/10 + feedback · 1 inbox item (≤2/day budget)"}, "RM-09": {"name": "Hand-in status", "flow": "JA-M04 · Assignment detail + hand-in submit pipeline + device badge + due-state", "status": "built", "purpose": "Timeline submitted → checked → graded; grade + per-criterion feedback; lecturer comment; resubmit if the assignment allows.", "adapt": "timeline across the top, feedback panel beside the submitted artifact (repo link / file / text).", "states": ["submitted", "checked", "graded", "returned for fixes", "late-marked", "resubmit open / closed", "feedback pending"], "story": "The physics assignment carries a 💻 badge — desktop-only, set by the teacher in the builder (R-K). On her phone Aya reads the full brief, but the submit sheet says honestly \"open on a computer — repo/file/text only\". On the laptop the pipeline offers GitHub repo, file, or text — photo capture is never offered for a 💻 badge. She pastes her repo link, the server verifies it's reachable, and the hand-in status screen tracks submitted → checked → graded, ending in Ms. Haddad's per-criterion feedback.", "why": "Device honesty at the point of work: if an assignment needs a computer, the app says so instead of accepting a worse submission — and one pipeline carries the student from brief to feedback with zero ambiguity about where their work stands.", "what": "Existing submit pipeline (GitHub repo / photo / file / text) + NEW device badge (📱/💻/both) and due-state chip; wrong-device submit blocked with an honest explanation; hand-in status screen with grading timeline, grade, and per-criterion feedback view.", "how": "The badge is authored in the builder (R-K), rendered on the assignment, and enforced twice: client-side (submit options filtered, blocked with explanation) and server-side (rejected with code DEVICE_MISMATCH, so no client trick slips through). Due-state comes from the deadline service; a submission is timestamped at upload start; a failed submit keeps the draft — submit loss = 0. Status/feedback extend the graded-submissions machinery. Metric: device-mismatch submit attempts drop to &lt;2% after first block; median feedback opened within 24 h of grading ≥70%.", "kata": "Kata: 🦉 Ollie the owl: “A 💻 badge on a phone means 'read here, submit there' — we block with a reason, never with silence.”", "edge": "Edge cases: student on the wrong device → read-only brief + blocked submit with explanation (server rejects DEVICE_MISMATCH) · deadline passes mid-upload → submission timestamped at start, late flag computed honestly · repo link private/deleted at grading time → \"unreachable\" state shown to both sides · resubmit after grading only if the assignment allows it · feedback edited by the lecturer → \"edited\" marker with timestamp.", "metric": "device-mismatch submit attempts drop to &lt;2% after first block; median feedback opened within 24 h of grading ≥70%.", "chain": "user taps \"PS6 due 23:59\" on RM-01 calendar → RM-04 assignment detail (💻 badge, due-state) → on desktop: pastes GitHub repo link → RM-04 \"repo found ✓\" preview → taps Submit → RM-09 timeline: submitted 22:41 ✓ → server events: checked 08:15 → graded 11:02 → RM-09 grade 9/10 + feedback · 1 inbox item (≤2/day budget)"}, "RM-05": {"name": "Report center", "flow": "JA-M05 · Report center report a bug · propose an improvement · my reports · anonymous option", "status": "built", "purpose": "Two entry cards (bug / improvement); form with category, description, attachment, anonymous toggle; My reports with status chips and the 30-day retention note.", "adapt": "form left, My reports right; desktop shows the status pipeline per report.", "states": ["form empty / filled", "anonymous on / off", "attachment added", "submitting / failed", "my reports: received / in progress / resolved", "empty (\"no reports yet\")"], "story": "The Zoom join button froze at 09:58. Aya opens Report center, files a bug with a screenshot, keeps her name attached this time — the anonymous toggle is there if she wants it, with the honest trade-off printed: anonymous means we can't ask follow-ups. Her earlier suggestion (\"dark mode for the league table\") sits in My reports with a real, moving status: received Mar 3 → in progress Mar 6.", "why": "Students see every rough edge first; a visible, statused channel turns complaints into fixes — and anonymity lowers the cost of honesty on sensitive reports.", "what": "Report a bug / propose an improvement with attachments; My reports list with live statuses (received → in progress → resolved); anonymous option with server-side identity stripping; retention note printed in the form: attachments are kept 30 days, then deleted.", "how": "Extends the LMS reports machinery: category, text, attachments. Anonymous strips identity server-side, not just in the UI — we cannot trace it back. Statuses stream from the triage board into the student's list (no refresh); the 30-day retention is stated in the form and enforced by a deletion job; a failed send keeps the draft — submit loss = 0. Metric: median time-to-first-status-change &lt;2 school days; ≥30% of reports include actionable attachments.", "kata": "Kata: 🐢 Tam the tortoise: “Every report gets a status the student can watch — 'received' is a promise, not a void.”", "edge": "Edge cases: anonymous report cannot be followed up for details → form warns before sending · attachment &gt;10 MB rejected with the limit stated · duplicate of an open report → linked, not double-filed · abusive content even anonymous → safety review path stated in policy · report resolved but the bug persists → \"reopen\" button on the resolved row.", "metric": "median time-to-first-status-change &lt;2 school days; ≥30% of reports include actionable attachments.", "chain": "Zoom Join freezes 09:58 (or user taps Report center) → RM-05 report form · 🐞 bug → types description + attaches screenshot → taps Send report → RM-05 My reports: new row \"received · just now\" → triage board moves it → RM-05 row flips in progress → resolved \"fixed in 1.9.2\" · 1 inbox item"}, "RM-06": {"name": "Statements", "flow": "JA-M06 · Statements military-service / student-status · preview with real data · serial + print", "status": "built", "purpose": "Pick type (military service / student status); preview with real data before generating; serial number + QR verification; print / save PDF.", "adapt": "type list left, live preview right; desktop shows issued-statement history with serials.", "states": ["choose type", "previewing", "data correct / correction needed", "generating", "issued (serial shown)", "previously issued", "print / saved"], "story": "Aya's brother needs a student-status statement for the embassy; her cousin needs the military-service enrollment proof. She picks the type, and before anything is issued she sees the exact document rendered with her real data — name, national ID, program, enrollment dates. Correct? One tap generates serial ST-2025-03817 with a verify code and a print-ready A4 PDF. Wrong? The flow routes to a data-correction request — never to a hand-typed field.", "why": "Official statements must be correct by construction: the preview shows the student's real data before generating, so errors are caught by the person who knows the data best — and a verifiable serial makes the paper unfakeable.", "what": "Request military-service / student-status statements; preview rendered with the student's real data before generating; serial number + verification code/QR; print / save PDF.", "how": "Extends the LMS statements machinery: template + profile/enrollment data only (no editable fields anywhere in the flow); serial minted from the registry at generate time, verifiable by the receiving institution at 10x.school/v/…; PDF print-ready (A4, school letterhead, QR). If profile data is wrong, issuing pauses and the flow routes to a data-correction request instead. Metric: statements issued without office involvement ≥90%; correction requests caught at preview ≥5%.", "kata": "Kata: 🦩 Safa the flamingo: “Preview first, serial always — an official paper you can verify, not a text box you can fake.”", "edge": "Edge cases: profile data wrong at preview → correction request instead of issuing · military-service statement for a student under the age threshold → type hidden with a one-line reason · duplicate request same day → returns the existing serial, no double issue · verification link for a revoked serial → explicit \"revoked\" page, never 404 · print stylesheet locks A4 + letterhead.", "metric": "statements issued without office involvement ≥90%; correction requests caught at preview ≥5%.", "chain": "user taps Statements (profile menu) → RM-06 choose type → taps 🎓 Student status → RM-06 preview rendered with real profile data → confirms \"data correct\" → taps Generate → server mints serial ST-2025-03817 · RM-06 issued + verify code/QR → taps Save PDF / Print → A4 letterhead PDF · embassy verifies at 10x.school/v/03817"}, "RM-07": {"name": "Careers feed", "flow": "JA-M07 · Careers feed events · grants · jobs · projects — all with deadlines", "status": "built", "purpose": "Type filter pills (events / grants / jobs / projects); cards with deadline countdown, eligibility, save/apply; saved items pin to the calendar.", "adapt": "two/three-column card grid; desktop adds a \"closing this week\" rail.", "states": ["feed loaded", "per-type filtered", "closing soon (≤7 days) highlighted", "saved / applied", "expired (greyed, shown honestly)", "empty category", "loading"], "story": "Between classes Aya scrolls the careers feed: a NASA Space Apps hackathon (apply by Apr 2 — 21 days left, saved), a robotics grant for under-18 teams, a paid summer internship at a local dev shop, and an open-source project that closed Mar 1 — still visible, greyed, honestly marked expired. Every card says exactly when the door closes; saving one pins it to her calendar a week before it does.", "why": "Opportunities die quietly when deadlines are buried. A feed where every card carries its deadline turns \"someday\" into \"by Apr 2\" — and expired cards stay visible rather than vanishing, so the feed never lies about what existed.", "what": "Careers feed of events / grants / jobs / projects, each with a deadline countdown chip, eligibility line, and save/apply actions; saved items pin to the student calendar 7 days before closing.", "how": "Extends the LMS career-posts machinery: the editorial queue publishes typed posts; deadline chips are computed from the post's close date (closing ≤7 days highlighted); saved items surface on the calendar (JA-M01) and earn one reminder notification inside the ≤2/day budget; apply is a tracked deep link. Metric: ≥25% of actives save ≥1 item/month; applications started from the feed tracked via deep link.", "kata": "Kata: 🦅 Rima the falcon: “Every card says when the door closes — opportunity with a countdown, not a poster wall.”", "edge": "Edge cases: expired posts stay visible but greyed with the close date — never silently deleted · student under eligibility age → card shown with the requirement line, apply disabled with reason · deadline moved by the organizer → countdown updates + one notification to savers · saved item closing in 7 days → appears on the calendar (JA-M01) · external apply link broken → report deep-link to JA-M05.", "metric": "≥25% of actives save ≥1 item/month; applications started from the feed tracked via deep link.", "chain": "user taps Careers tab → RM-07 feed (All) → taps 💰 Grants filter → RM-07 filtered: grant cards with deadline chips → taps 🔖 Save on Space Apps → saved chip ✓ · pin lands on RM-01 calendar Mar 26 (7 days before close) → taps Apply → tracked deep link → external form · card flips \"applied ✓\""}, "RM-08": {"name": "Self-analysis", "flow": "JA-M08 · Self-analysis progress lens · mastery decay · streak history · wallet · next-review route", "status": "new", "purpose": "Skill radar; mastery map with decay chips (days since practice); mistake stats; streak heat calendar; wallet ledger; always ends in the \"review next\" action.", "adapt": "radar left, mastery + mistakes right; desktop adds the full streak year and wallet ledger table.", "states": ["loaded", "topic fresh / decaying / cold", "no mistakes this week (honest \"none recorded\")", "streak active / broken", "wallet credits/debits", "review route ready"], "story": "Sunday evening. Aya opens Self-analysis: the radar says physics is strong, algebra slipped; the mastery map shows recursion fading — 64%, was 88%, 12 days idle. Mistake stats name her top error (unit slips, 5× in 3 weeks). The streak calendar shows Friday's gap honestly. And the screen ends where it always ends: one button, \"▶ Review recursion first · 15 min\" — because a dashboard that doesn't end in an action is decoration.", "why": "Progress data that ends in a dead dashboard is decoration. The student's own lens must end in an action — what to review next, computed from decay and mistakes, one tap away. Mastery grows only via reviews; decay is shown, never hidden.", "what": "Skill radar; mastery map with visible decay (days since practice); mistake stats; streak history calendar; wallet ledger; a \"what to review next\" route that is always present. Plus the achievements home: badges (earned and locked, with the path to each), personal records with dates, credentials with serials + verification.", "how": "NEW screens over the analytics service: mastery per topic decays with time-since-practice (shown, not hidden); mistake stats come from graded submissions, and cleared mistakes pay ⬡ coins; the next-review route is the argmax of decay × mistakes, rendered as a single primary action. RM-10 aggregates R-I achievements with credential serials from the registry. Metric: ≥50% of self-analysis sessions end in the suggested review started; decayed-topic recovery ≤3 days median.", "kata": "Kata: 🦉 Ollie the owl: “Decay is shown, mistakes are named, and every visit ends in one button: what to review next.”", "edge": "Edge cases: no mistakes recorded this week → says so honestly, no fabricated stats · brand-new student → radar collapsed with \"take the placement quest\" as the single action · streak broken → calendar shows the gap, no cosmetic fill (wounded → break → repair, never zeroed) · wallet dispute → ledger entry links to Report center · achievements revoked (credential error) → shelf updates with a dated note, never silent removal.", "metric": " ements switch in place)", "no courses enrolled (honest empty)", "no sessions today", "deadline &lt;24h (amber)", "offline (cached stats, sync note)"], "story": "“As a student, I want one screen that shows my grades, attendance, what’s due and what’s today — the school side of my day, not just the game.”", "why": "The roadmap (D-23) is the practice home; this dashboard is the academic home — one tap apart, never competing. It must answer “how am I doing in school” in one glance and turn every stat into a same-day action, not a report card.", "what": "Sub-switch row pinned under the header (D-23): Today · Calendar · Grades · Exams · Quests · Attendance · Statements — the classroom surfaces switch INSIDE the dashboard; they are not menu tabs. The /learn dashboard rebuilt around action: header stat chips (due soon · forms open · exams ahead), four stat cards (grade vs group, attendance with graded/pending, streak, 30-day activity sparkline), today’s sessions with Zoom join, programs grid with course-color borders, pinned announcements, and a focus stack: forms with course dots, due-soon, sessions ahead with day badges, my exams, GitHub connect.", "how": "Server renders stats per enrolled course; sessions from the schedule with meeting links attached; deadlines from assignments.due_at; forms filtered to open-and-unfilled. Every chip is a tap-through into its flow. Metric: dashboard → same-day action rate ≥70%.", "kata": "Kata: warm-teacher: “School first, games second. Today’s lecture is at twelve — then Floor 13 if you’re feeling strong.”", "edge": "Edge cases: Student in 2 programs → stats aggregate, courses section lists both · no announcements → section hides, never a dead card · deadline passed overnight → shows overdue, honest · multi-enrollment stats never mix per-course numbers in the stat cards (weighted by enrollment).", "metric": "dashboard → same-day action rate ≥70%.", "chain": "student opens app (session valid) / taps 🏠 Home → RM-11 loads: stats + chips render per enrolled courses → taps “1 due soon” chip → flexbox-lab row → RM-20 session detail: homework card + submit (JA-M16) → 12:00 nears → “Join on Zoom” goes live → RM-11 today-row: join button → session, attendance marked by teacher (feeds RM-18)"}, "RM-12": {"name": "Course page", "flow": "JA-M10 · Course page (per-program home) all programs", "status": "built", "purpose": "The per-program home: header (icon, title, cohort, progress), modules with done/current/locked states, materials per module, announcements, lecturer line.", "adapt": "desktop 2-pane (modules left, announcements right); tablet stacked.", "states": ["loaded", "module without syllabus", "no announcements", "archived course (read-only, honest)", "multi-enrollment (switcher chip)"], "story": "“As a student, I want my course’s real structure — modules, materials, syllabus, announcements — in one place per program I’m enrolled in.”", "why": "Programs differ (dev / culinary / hospitality / management) but every course has modules, materials, sessions and announcements. One template renders all of them; course config decides which submission kinds and session kinds appear.", "what": "Course view: dark program header (icon, color, cohort, progress), module list with done/current/locked states and material counts, announcements panel, lecturer line.", "how": "Reads modules + materials + announcements for the course; module states derived from progress and dates — locked means actionable-later, never sealed. Metric: course page → module open rate ≥60% weekly.", "kata": "Kata: warm-teacher: “Your mountain, mapped. Unit three is where we are — the syllabus is pinned if you’re the reading type.”", "edge": "Edge cases: Empty module (no materials yet) → “content being prepared” honest state · archived course → read-only with banner · draft module → invisible to students by design · locked module tap → date toast, never a dead end (locked ≠ sealed).", "metric": "course page → module open rate ≥60% weekly.", "chain": "taps “Python foundations” card on RM-11 → RM-12 header + modules render (states from progress) → taps current module “3 · CSS Flexbox” → module opens: syllabus 📎 + 11 materials listed → taps a session inside the module → RM-20 session detail (JA-M16)"}, "RM-13": {"name": "Grades", "flow": "JA-M11 · Grades (weighted, per program) all programs", "status": "built", "purpose": "Weighted total with the math shown: component table (weight · score · state), per-assignment scores with lecturer feedback, pending items honest.", "adapt": "desktop: table + latest-feedback column; tablet stacked.", "states": ["loaded", "item pending (⏳)", "nothing graded yet (honest empty)", "scheme differs per program type"], "story": "“As a student, I want to see exactly where my grade comes from — which components, which weights, which items are still pending.”", "why": "Weighted grading differs per program type (short / modular / semester). Students trust totals only when the math is visible: component, weight, score, and what’s still ungraded.", "what": "The grades view: weighted total with the math shown, component table (weight · score · state) per the course’s scheme, per-assignment rows with lecturer feedback, pending items marked honestly with ⏳ — never averaged in as zero, never hidden.", "how": "Component weights from the course grading config; totals computed per component (grades.ts); feedback from submissions.graded_by. Metric: grade-dispute reports → 0.", "kata": "Kata: honest-accountant: “Eighty-seven, and here is every point of it. The one pending is a question for your lecturer, not for me.”", "edge": "Edge cases: Course uses different scheme (semester) → component table adapts, stated · grade updated while viewing → totals re-render with a subtle flash · pending older than 2 weeks → shows age, no blame · pending never counts as zero in the total.", "metric": "grade-dispute reports → 0.", "chain": "taps “87” grade card on RM-11 / grades in profile → RM-13 renders component table from course grading config → taps “flexbox-gallery.zip · 9/10” row → submission opens: Nino B.’s feedback + line comment → server event: lecturer publishes the pending grade → RM-13 totals re-render with a subtle flash; pending count drops 1 → 0"}, "RM-14": {"name": "Exams surface", "flow": "JA-M12 · Exams surface + detail all programs", "status": "built", "purpose": "The list: upcoming exams with stage summary + register CTA, team slots, past results with stage breakdown, absences with retake window.", "adapt": "desktop table for history + hero card for the next exam; tablet stacked.", "states": ["upcoming (register open)", "registered (slot confirmed)", "past passed", "past failed", "absent (excused)", "result published"], "story": "“As a student, I want my exams listed with stages, teams and results — and each exam’s card to tell me exactly what happens, where, and with whom.”", "why": "The LMS exam system is richer than a quiz: multi-stage (written, panel), evaluator panels, team registrations with slots, absences, published results. Students need the whole surface, not just the strict runner.", "what": "Two screens: the exams list (upcoming with register CTA, team slots with names, past results with stage breakdown, absences with retake window) and the exam detail (stages with points and format, evaluators count, instructions/attachments, confirm slot).", "how": "Reads exams + stages + teams + scores for the student’s courses; registration writes team membership idempotently — double-tap can never double-book a slot. Metric: registration confusion reports = 0.", "kata": "Kata: registrar: “Sixty written, forty panel, room 204, Monday at ten. Your slot is second — confirm it and sleep well.”", "edge": "Edge cases: Student joins after team full → waitlist honest state with position · panel runs online for remote cohort → format chip switches to “online”, room becomes the meeting link · absence excused → retake window shown, never a dead end · double-tap on confirm → idempotent, one slot, one membership.", "metric": "registration confusion reports = 0.", "chain": "taps “1 exam ahead” chip on RM-11 → RM-14 list: Unit 3 final hero + history → taps Register → RM-15 detail: stages, evaluators, slots → picks slot 2, taps “Confirm my slot” → RM-15 confirmed: “slot 2 · with Dato K.” + calendar add → server event: results published → RM-14 row flips to passed 82 · written 48/60 · panel 34/40"}, "RM-15": {"name": "Exam detail", "flow": "JA-M12 · Exams surface + detail all programs", "status": "built", "purpose": "Per-exam card: date/room, stages with points and format, evaluators count, team slots with names, instructions/attachments, confirm-slot CTA.", "adapt": "stage cards 3-up on desktop; tablet stacked; panel format always visible.", "states": ["open to register", "slot confirmed", "team full", "registration closed", "past (read-only)"], "story": "“As a student, I want my exams listed with stages, teams and results — and each exam’s card to tell me exactly what happens, where, and with whom.”", "why": "The LMS exam system is richer than a quiz: multi-stage (written, panel), evaluator panels, team registrations with slots, absences, published results. Students need the whole surface, not just the strict runner.", "what": "Two screens: the exams list (upcoming with register CTA, team slots with names, past results with stage breakdown, absences with retake window) and the exam detail (stages with points and format, evaluators count, instructions/attachments, confirm slot).", "how": "Reads exams + stages + teams + scores for the student’s courses; registration writes team membership idempotently — double-tap can never double-book a slot. Metric: registration confusion reports = 0.", "kata": "Kata: registrar: “Sixty written, forty panel, room 204, Monday at ten. Your slot is second — confirm it and sleep well.”", "edge": "Edge cases: Student joins after team full → waitlist honest state with position · panel runs online f aiting, no wondering.”", "edge": "Edge cases: Quiz auto-grade vs manual review distinction shown on the card · multiple attempts allowed → accept_multiple badge + best-score rule stated · anonymous review → identity stripped server-side, stated · close-during-fill → draft saved, answers kept read-only, never lost.", "metric": "open-form completion ≥80% before close.", "chain": "taps “2 forms open” chip on RM-11 → RM-16: session review pinned first, open list below → taps Fill on “Flexbox check” quiz → quiz runner: 10 questions → submits → auto-graded instantly → completed list “17/20 ✓”, feed to RM-13 quizzes component"}, "RM-17": {"name": "Games hub", "flow": "JA-M14 · Games hub (Kahoot-style) all programs", "status": "built", "purpose": "Three honest doors: live PIN join (code boxes), homework games with deadline chips, practice replays marked “never graded”, plus my-results.", "adapt": "desktop: PIN panel left, on-your-time list right; tablet stacked. Note: game points stay in the game — they never enter XP/coins (economy law).", "states": ["no live game (quiet)", "PIN entry", "lobby waiting", "homework due &lt;24h", "practice replay", "results"], "story": "“As a student, I want one door into every game my teachers run — live PIN games in class, homework games with deadlines, and practice replays on my own time.”", "why": "The games platform exists: live sessions with PIN + lobby + podium, homework mode with windows, practice replays. Students need the three entry points separated honestly — and one law stated on the surface: game points stay in the game, they never enter XP/coins.", "what": "A hub: live PIN join with code boxes, homework games with deadline chips, practice replays marked “never graded”, plus a my-results line.", "how": "Sessions listed by mode for the student’s courses; PIN joins the lobby; homework games honor opens_at/closes_at; results from game_players. Metric: homework-game completion ≥70% of assigned.", "kata": "Kata: showman-honest: “PIN’s on the projector when your lecturer runs one. Homework arena closes Friday — and practice? Practice is yours, always.”", "edge": "Edge cases: PIN wrong/expired → neutral “no game with that code” · joins mid-game → lands on current question, stated · homework game started, deadline passes → score stands as submitted at close · student-made challenge appears only after teacher approval (review flow from CHALLENGES-PRD) · game points never convert to XP or coins — no surface even implies it.", "metric": "homework-game completion ≥70% of assigned.", "chain": "server event: lecturer starts a live game in class → RM-17 live card lights up “PIN on the projector” → student types 4-digit PIN, taps join → lobby: “you’re in · 23 players · waiting for start” → lecturer starts → questions run → podium → my-results: “Flexbox live · #4 of 23 · 8,940 pts” — points stay in-game, XP/coins untouched"}, "RM-18": {"name": "My attendance", "flow": "JA-M15 · Attendance + academic roadmap all programs", "status": "built", "purpose": "The honest record: percentage header, per-session grid (present/late/absent/upcoming), exceptions with marker and time, monthly summary.", "adapt": "grid stretches on desktop with per-course tabs for multi-enrolled students; tablet same grid.", "states": ["loaded", "late (amber)", "absent (red)", "excused absence (kind tone)", "no sessions yet (honest empty)"], "story": "“As a student, I want to see my attendance record honestly, and my course laid out on a timeline — where we’ve been, where we are, what’s next.”", "why": "Attendance is marked by teachers per session; students should see it as a calm record, not a threat. The LMS’s module timeline (sessions inside dated modules) is the academic sibling of the game roadmap — one answers “was I there”, the other “where are we”.", "what": "Two screens: my attendance (percentage header, per-session grid with present/late/absent/upcoming, exceptions with marker and time) and the course timeline (modules with date
