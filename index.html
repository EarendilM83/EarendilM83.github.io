ds with state + resume point, current badge, the D-01 law row (account-level meta, per-program mastery), join route.", "adapt": "program cards 2-up on desktop; law row full-width; resume state printed per card.", "states": ["1 program (switcher hidden, join shown)", "2+ programs", "switching", "switched (resume point honored)", "join available (admin-open)"], "story": "“As a student in two programs, I want switching to feel like changing rooms — everything of mine exactly where I left it, in both.”", "why": "Multi-program support lives or dies on what carries. The rule is one line: streak, XP, coins and league band stay account-level (D-01); mastery, path and placement stay per program — preserved exactly, never merged, never lost. The switcher shows both truths before the tap, so switching never feels like a gamble.", "what": "A program switcher (S-02 variant): a card per program with live state and resume point, the current badge, the D-01 law row, and the join-short-term route (D-15).", "how": "Tap Switch → path/mastery/placement load per program; progress preserved exactly, resume point honored; quests may span both programs (shown once, progress pooled, stated); league unaffected. Metric: multi-program W4 retention (observe).", "kata": "Kata: neutral-clerk: “Two rooms, one wallet. Python waits at the boss gate; Management waits at floor three. Neither loses a thread while you’re gone.”", "edge": "Edge cases: Switch mid-floor → floor state saved per program, resume offered honestly · joinable program has its own onboarding trail (D-18) · account-level quests spanning both programs → shown once, progress pooled, stated.", "metric": "multi-program W4 retention (observe).", "chain": "taps “Programs” row on RI-01 → RI-06: cards per program + D-01 law row → taps Switch on Management basics → per-program path / mastery / placement load · resumes Unit 1 exactly where left → account meta untouched: 🔥 12 · ⚡ 240 · ⬡ 45 · Evening band (D-01)"}, "RI-07": {"name": "Privacy · export &amp; deletion", "flow": "JA-I07 · Data export &amp; deletion (privacy) all · student-direct", "status": "new", "purpose": "The plain-words privacy hub: export with 72h SLA, deletion with the registry-retention truth, direct-authorization note, data-holdings list.", "adapt": "cards 2-up on desktop; deletion never red-buttoned — serious, not scary.", "states": ["export requested (72h stated)", "export delivered", "deletion requested", "deletion confirmed (retention stated)", "student-direct (holder authorizes)"], "story": "“As a student, I want my data back when I ask — and deletion that’s honest about the one thing it can’t erase.”", "why": "Privacy trust is built on plain words, not reassuring adjectives: export with a stated 72h SLA, deletion that anonymises learning data while honestly retaining the certificate-registry records the law obliges, and the account holder authorizing directly (D-23) — no proxy approvals exist, stated before anyone asks.", "what": "One privacy hub: export card with the SLA on it, deletion card with the registry-retention truth on it (serious, not scary — never red-buttoned), the direct-authorization note, and the what-we-hold list.", "how": "Export requested → attempt-level export delivered within 72h; deletion requested → learning data anonymised, credential records retained as registry obligations require, confirmation stated plainly; export-during-deletion → export completes first, order stated. Metric: SLA compliance 100%.", "kata": "Kata: absent — and why: privacy is a legal surface; the mascot doesn’t joke where rights live. Plain words do the work.", "edge": "Edge cases: Deletion while certificate valid → credential stays verifiable in the registry, learning profile gone — stated before confirm · the holder requests directly → same SLA, identity verified · export during deletion → export completes first, order stated.", "metric": "SLA compliance 100%.", "chain": "taps “Privacy” row on RI-01 → RI-07: export + deletion cards, holdings list, D-23 note → taps Export everything → state: “arrives by Fri 14:00 — 72h SLA, stated” → pipeline delivers attempt-level export → export delivered · download link · SLA met"}, "RJ-01": {"name": "Submit failed · queued", "flow": "JA-J01 · Network error mid-submit (H-19) all", "status": "new", "purpose": "The zero-loss promise made visible: answer queued, streak safe, silent retry, cached-floors route. Framed as handled, never as an error.", "adapt": "mobile sheet → tablet sheet → desktop dialog over the frozen runner.", "states": ["queued (retrying)", "queued persisted across app close", "retry succeeded (transparent)", "repeated failure (cached route)", "never re-answers"], "story": "“As a student whose connection hiccups mid-floor, I want my answer to be safer than my wifi — and to never be asked it twice.”", "why": "The QA invariant: submit loss = 0. A committed answer is queued on-device the instant the network fails, with the streak declared safe immediately — the failure is presented as handled, never as an error, and the student is never re-asked a question they already answered. Cached floors keep momentum alive while the line is down.", "what": "A sheet over the runner: queued + streak-safe confirmation, the silent backoff-retry row, and the cached-floors route for longer outages. Success continues transparently — the sheet never comes back to take credit.", "how": "Commit fails (timeout/5xx) → queue persisted on-device → sheet shown; retry with backoff in the background; repeated failure → suggest cached floors (RC-14); success → transparent continue. Metric: submit loss = 0.", "kata": "Kata: calm-engineer: “It’s in the box, safe. The wifi can sulk — you keep moving, and I’ll mail it the second the line breathes.”", "edge": "Edge cases: App killed while queued → queue persists, sends on next open · retry succeeds mid-floor → no visual interruption, honest · 5xx storm → cached floors suggested without blaming the school’s servers.", "metric": "submit loss = 0.", "chain": "commits answer Q6 · network times out / 5xx → answer persisted to on-device queue instantly → RJ-01 sheet: “Answer queued — streak safe” (H-19) → backoff retry fires in background → success → sheet gone, floor continues at Q7 — transparent, no victory lap"}, "RJ-02": {"name": "Resume after crash", "flow": "JA-J02 · App crash / force-close mid-floor all", "status": "new", "purpose": "The nothing-happened card: exact position, banked answers, streak/wager intact, privacy line on crash reports, corrupt-state recovery rule.", "adapt": "centered card on all factors; banked-answers count is the trust hero.", "states": ["resuming", "answers banked (count shown)", "corrupt state (server wins, credit kept)", "wager was active (state intact)"], "story": "“As a student whose app died mid-floor, I want re-opening to feel like pausing, not like losing.”", "why": "Crash is made indistinguishable from interruption by per-item persistence (D-04): every answer is banked the moment it’s given. The resume card must prove that in numbers — position, banked count, streak and wager intact — plus the privacy line that crash reports carry floor context, never answers.", "what": "A resume card on re-open: exact position (question 6/10), banked-answers count, streak/wager integrity, the no-answers-in-payload line, and the corrupt-state rule (server wins, credit kept).", "how": "Process dies mid-floor → re-open restores resume state at the exact item; crash report logged with floor context (no answers); corrupt local state → server-synced items win, credit preserved. Metric: crash→resume ≥70%.", "kata": "Kata: calm-engineer: “Sixth question, five in the bank, wager where you left it. The crash? Already forgotten — by everyone except my log, which never saw your answers.”", "edge": "Edge cases: Crash during wager-active floor → wager state restored honestly (RC-08 rules) · repeated crashes same floor → support flag with floor context · corrupt + offline → server sync waits, credit preserved, stated.", "metric": "crash→resume ≥70%.", "chain": "app force-closed / OS kills process at Q6/10 → per-item persistence already banked 5 answers (D-04) — nothing to recover, only to show → student relaunches → RJ-02 resume card: Q6/10 · 5 banked · streak &amp; wager intact → taps Resume → floor reopens at Q6 with 3 min left — crash indistinguishable from a pause"}, "RJ-03": {"name": "Shared-device push", "flow": "JA-J04 · Push on shared device (account mismatch) shared tablets", "status": "new", "purpose": "The privacy-preserving push: neutral lock-screen copy, (device, account) binding, tap routes to the bound login, re-key on switch.", "adapt": "lock-screen state on mobile/tablet; desktop shows the same lock-surface simulation — no app chrome anywhere.", "states": ["neutral push shown", "tapped → bound account’s login", "account switched (re-keyed)", "other student active (no leak)"], "story": "“As a student on a shared tablet, I want my friend’s notifications to say nothing about them — and mine to say nothing about me.”", "why": "A lock screen is a public surface on shared devices. Push binds to (device, account) at registration; the text is account-neutral by law (R9-05); a tap routes to the bound account’s login and never leaks the other student’s state. Cross-account leaks = 0 is a metric, not a hope.", "what": "The neutral push state: generic-but-warm copy with no name, no streak count, no floor detail; the neutrality law line; and the routing rule. Shown as a lock-screen state on all factors — no app chrome anywhere.", "how": "Push arrives while another account is active → neutral text shown; tap → routes to the bound account’s login; account switch → push registration re-keyed (JA-A05). Metric: cross-account leaks = 0.", "kata": "Kata: quiet-keeper: “A floor waits. Whose? The lock screen doesn’t say, and that’s not an accident — on a shared tablet, silence is manners.”", "edge": "Edge cases: Two accounts both due → two neutral pushes, never merged with names · re-key race (switch mid-delivery) → push binds to registration at send time, routing stays correct · snooping test → nothing learnable from lock screen, by design.", "metric": "cross-account leaks = 0.", "chain": "push for account B arrives while account A is active → registration bound to (device, account B) at send time → RJ-03 lock screen: neutral text (R9-05) — “a floor waits”, no name, no count → someone taps the push → routes to B’s login — never into A’s session, never into B’s state without auth"}, "RJ-04": {"name": "Empty path", "flow": "JA-J05 · Content not published (H-18) enrolled", "status": "new", "purpose": "The locked-door-with-a-window: opening date, syllabus browse, one-announcement notify-me, meanwhile review route.", "adapt": "centered card on all factors; syllabus browse expands inline.", "states": ["not published", "notify-me set", "published (one announcement)", "mid-session publish (version pinned, invisible)"], "story": "“As a student ahead of the schedule, I want the locked door to have a window — what’s coming, when, and one tap to be told.”", "why": "Unpublished content is a scheduling reality, not an error — so the empty path behaves like a locked door with a window, never a dead end: what’s coming and the date it opens, one notify-me announcement (no countdown spam), the syllabus to browse, and review floors to keep the streak warm meanwhile. Locked ≠ sealed: this is date-waiting, and the date is printed.", "what": "The empty-path screen: opening date, syllabus browse, one-announcement notify-me, and a meanwhile review route. Version-pinning note: admin publishing mid-floor keeps the in-flight floor on its version.", "how": "Program/unit not yet published → empty path; lecturer checklist (6.4) flips → notify-me students get exactly one announcement (≤2/day budget); mid-session publish → version pinning, invisible. Metric: empty→return after publish ≥50%.", "kata": "Kata: patient-guide: “Thursday. Twelve floors and a boss, and here’s the map if you’re curious. I’ll knock exactly once when the door opens.”", "edge": "Edge cases: Date slips (lecturer delay) → date updates honestly, notify-me intact · student finishes review floors too → offline queue + quests carry the gap · publish mid-floor → in-flight floor stays on old version (pinning), new content appears next floor.", "metric": "empty→return after publish ≥50%.", "chain": "taps locked Unit 4 on the path (H-18) → RJ-04 empty path: “opens Thursday” + syllabus + notify-me + review floors → taps Notify me → Thursday · lecturer checklist (6.4) flips to published → exactly one announcement push (≤2/day budget) → Unit 4 floor 1 unlocked"}, "RJ-05": {"name": "Support console · repair", "flow": "JA-J06 · Support: streak repair &amp; lookup support role", "status": "new", "purpose": "The accountable power tool: lookup with context, read-only grades law, one-click repair grant that writes its own audit entry.", "adapt": "staff tool — desktop-first with staff side-nav; tablet condensed; mobile functional but intentionally sparse.", "states": ["lookup", "history viewed", "repair granted (audit entry)", "boundary override (same path)", "weekly report surfaces grants"], "story": "“As support, I want to fix a broken streak with full context and zero temptation — one logged grant, never an edit.”", "why": "The support console is a power tool wrapped in law: lookup with full session + streak-ledger history, grades/mastery read-only (6.6) — the console physically can’t edit them — every grant writing winback_repair_granted(source=support) plus an audit entry, and all of it surfacing in a weekly report that turns grant patterns into product fixes instead of more grants.", "what": "A staff screen (desktop-first): lookup bar, ledger/history pane, the read-only law row, and the grant-repair action that writes its own audit trail. The RI-03 boundary override walks the same grant+audit path.", "how": "Student contacts support → console lookup → full context; grant repair → ledger entry + audit log; boundary override (RI-03) same path; grants reviewed weekly. Metric: pattern → product fix, not more grants.", "kata": "Kata: absent — and why: staff surfaces get no mascot theater; the audit log is the personality here — every power leaves a signature.", "edge": "Edge cases: Support tries to edit a grade → console physically can’t (6.6), stated on screen · grant granted by mistake → reversal is another audit entry, never a silent delete · grant pattern emerges (same failure weekly) → escalates to product fix, stated in the report.", "metric": "pattern → product fix, not more grants.", "chain": "student emails: “streak broke on a hospital day” → agent opens RJ-05 · looks up nino@… → session history + streak ledger: wounded Jul 26 → broke Jul 29 · win-back used Jul 12 → taps Grant repair · logged → ledger writes winback_repair_granted(source=support) + audit entry #A-1102 → weekly support-action report aggregates grants → repeat pattern → product fix"}, "RK-01": {"name": "Builder home", "flow": "JA-K01 · Builder home — every activity, one board entry point · per course", "status": "new", "purpose": "Course activity board: shell, items, device badge, lifecycle status, weak-spot stats per row; new/import actions always visible.", "adapt": "Full table with weak-spot bars, last-run attempt counts and status filter pills; bulk select for archive.", "states": ["loading", "empty course (first-run CTA)", "populated (drawn)", "filtered", "import in progress", "error / retry"], "story": "A lecturer opens the Web Development course on Monday 09:12 and lands on the builder board: every practice activity with its shell, item count, device rule, lifecycle status and the weak-spot stats that justify its existence. From here she starts a new activity, imports one from the bank, or taps a row to keep editing.", "why": "Activities multiply fast across courses and cohorts; without one board, drafts get lost, reviews stall and nobody knows which activities actually target the current weak spots. The board is the honest answer to “what should I fix next?”", "what": "A course-scoped list: shell icon + name, item count, device badge (📱/💻/both), status (draft / review / published), weak-spot hit rate with a mini bar, last-run stats; filter pills by status and device; “New activity” and “Import from bank” entries always visible.", "how": "Server-paginated table filtered to the course; weak-spot stats roll up nightly from attempt events; row tap opens the canvas (RK-03), status pill opens the publish gate (RK-08), “New activity” opens the shell picker (RK-02). Metric: course page → activity open in &lt; 3 s.", "kata": "Kata: absent — and why: staff-only surface; the mascot lives student-side, the builder speaks in facts.", "edge": "Edge cases: Course with 0 activities → first-run CTA instead of an empty table; 200+ activities → pagination + search; weak-spot stats not computed yet → “collecting data” state; lecturer without edit rights → read-only board.", "metric": "course page → activity open in &lt; 3 s.", "chain": "lecturer opens course “Web Development” → RK-01 board · 14 activities, weak-spot bars → taps filter pill “review · 3” → RK-01 filtered · only in-review rows → taps “＋ New activity” → RK-02 shell picker → RK-03 canvas skeleton"}, "RK-02": {"name": "Shell picker", "flow": "JA-K02 · Choose a shell — four mechanics, one goal creation step 1 · template", "status": "new", "purpose": "Four mechanic cards (floor / chips / boss / timed drill) with best-for hints and skeleton summary; selection continues to the canvas.", "adapt": "Cards in a 2×2 / 4-up grid with the selected shell expanded: default slots, rewards and editable-config note.", "states": ["default (none picked)", "selected (drawn)", "returning editor (shell pre-picked)", "locked after publish (read-only)"], "story": "The first creation step asks for the mechanic, not a form: floor (linear Q&amp;A climb, ~6 min), chips (Duolingo-style side-games), boss (no-help gate) or timed drill ⏱. Each card states what it is best for and the default rewards it ships with, so the lecturer chooses pedagogy first — cosmetics never.", "why": "The shell drives student motivation and session shape; choosing it late means rebuilding the canvas. Honest time/effort hints up front prevent “pretty but wrong” activities.", "what": "Four shell cards with emoji, one-line mechanic, session length, best-for hint and the default reward/mechanic config each shell ships with; a summary sheet of the skeleton the choice creates; continue to the canvas.", "how": "A shell is a template: it creates the canvas skeleton plus default mechanic config (RK-10) and stays switchable until first publish — after that the shell is frozen into the snapshot. Metric: ≥ 90 % of activities keep their first shell choice (low rework).", "kata": "Kata: absent — and why: staff tool; shell cards carry the emojis, no mascot needed.", "edge": "Edge cases: Lecturer backs out after picking → draft kept with shell pre-picked; switching shells mid-build → warn that per-item rewards reset to the new shell defaults; published activity → this screen is read-only history; boss shell + 0 items → continue disabled.", "metric": "≥ 90 % of activities keep their first shell choice (low rework).", "chain": "taps “＋ New activity” on RK-01 → RK-02 shell picker (none picked, Continue disabled) → taps 🧱 Floor card → skeleton sheet: 8 slots · 10 XP / 5 🪙 per item · 📖 after slot 3 → taps “Continue → canvas” → RK-03 canvas opens with floor skeleton + RK-10 defaults"}, "RK-03": {"name": "Activity canvas", "flow": "JA-K03 · Activity canvas — arrange the run creation step 2 · drag &amp; drop", "status": "new", "purpose": "Drag-to-reorder item list, per-item XP/coins, guidebook card insertion, live map preview chip, continuous validation flags.", "adapt": "Two-pane: canvas left, map preview + rewards budget rail right; keyboard reordering supported.", "states": ["empty skeleton", "populated (drawn)", "dragging", "invalid item flagged", "autosave error (retry)", "published (read-only snapshot view)"], "story": "On the canvas the lecturer arranges the run: drag items into order, tune per-item XP and coins, drop a guidebook card between two hard items, and keep an eye on the map preview chip that shows how the shell will render the journey. One item glows red — its explanation is missing, so publish stays blocked.", "why": "Order, pacing and rewards are the pedagogy of the shell; a visible map preview stops blind building, and the QA-law explanation gate must be visible where the work happens, not at the publish gate.", "what": "Item list with drag handles, type pill and per-item XP/coins; insert guidebook card anywhere; add-item menu with the nine types; map preview chip mirroring the shell metaphor; inline flags for missing explanations and device-mismatched items.", "how": "Canvas autosaves the draft on every change; a reorder is a single PATCH; the map chip renders live from the draft; validation (explanation present, rewards set, tests exist for code items) runs continuously and feeds the publish gate. Metric: reorder → persisted &lt; 500 ms.", "kata": "Kata: absent — and why: staff canvas; the map preview is where the student-facing art shows, deliberately small.", "edge": "Edge cases: Drag onto a locked published activity → read-only; two lecturers editing → last-write-wins with conflict toast; guidebook card in a boss shell → allowed but flagged “boss shows no help mid-run”; 60+ items → virtualised list; autosave offline → local queue with “unsaved” banner.", "metric": "reorder → persisted &lt; 500 ms.", "chain": "“Continue → canvas” from RK-02 → RK-03 canvas · floor skeleton, 8 empty slots → taps “＋ Add item” → picks mcq → RK-04 editor → save → item lands in slot 1 → drags item 4 above the 📖 card → PATCH 200 · autosaved · 🗺 map preview re-renders → taps “Publish gate →” → RK-08 · blocked chip: item 4 explanation missing"}, "RK-04": {"name": "Standard question editors", "flow": "JA-K04 · Standard question editors — nine item types, one law BUILT · extends forms · + explanation gate", "status": "built", "purpose": "Nine item-type editors (mcq … guided-steps) with difficulty/XP/coins and the mandatory explanation field; per-item runner preview.", "adapt": "Three-pane: type rail, editor, settings + grading note; bulk explanation audit across items.", "states": ["new item", "editing (drawn)", "explanation missing (save blocked)", "invalid config", "saved", "type switched (confirm data loss)"], "story": "Every non-code item is authored in the forms-engine editors the LMS already has: mcq, multi, typed, token-order (Parsons), fill-blank, spot-bug, scenario, evidence-upload and guided-steps. The builder adds exactly one thing on top: the explanation field is mandatory — an item without it cannot save, let alone publish.", "why": "Rebuilding nine editors would burn the whole budget; the forms engine already grades them. The gap is pedagogical, not technical: QA law demands an explanation on every item because the runner shows it after every attempt.", "what": "Type switcher plus the forms editor for the selected type; builder chrome adds difficulty, XP/coins and the required explanation block with a red “required” state; per-item preview renders exactly what the runner will show.", "how": "Builder reuses the forms components and their auto-graders as-is; on save it validates explanation non-empty (QA gate) and writes the item into the draft. Metric: 0 items published without an explanation — enforced at save, rechecked at the publish gate.", "kata": "Kata: absent — and why: inherited staff editor from the forms engine; mascot stays in the student runner.", "edge": "Edge cases: Switching item type with content present → confirm dialog (options may not map); evidence-upload items → device rule auto-suggests 💻; scenario with 8 steps → mobile editor scrolls, tablet/desktop show step rail; explanation under 20 chars → soft warning, still saves once non-empty.", "metric": "0 items published without an explanation — enforced at save, rechecked at the publish gate.", "chain": "“＋ Add item → mcq” on RK-03 → RK-04 editor · type rail on mcq → types question + options, marks A correct → taps “Save item” with explanation empty → save blocked · red QA-gate state on Explanation * → writes explanation → taps Save → saved → RK-03 canvas · item shows “explanation ✓”"}, "RK-05": {"name": "Code-console editor", "flow": "JA-K05 · Code-console questions — the centerpiece NEW · WASM sandbox · zero server risk", "status": "new", "purpose": "Author starter code, reference solution, weighted hidden tests and expected console output in a tabbed dark-editor layout.", "adapt": "Three-pane: code editor, test list with weights, rationale rail (WASM, device rule suggestion).", "states": ["empty item", "editing (drawn)", "unsaved", "invalid test syntax", "saved", "published (read-only)"], "story": "The author writes starter code, a reference solution, hidden tests and the expected console output. Then she opens the validation console and runs her own solution in the browser: 3 of 4 tests pass — the perf test fails at 341 ms, so she fixes the limit before any student ever touches the item. Students later get the same editor plus in-browser console for instant pass/fail, while the hidden tests remain the real grade source.", "why": "Coding practice is the school’s core product, and server-side code execution is both a security nightmare and a cost sink. WebAssembly (Pyodide) runs student code in a browser sandbox: zero server risk, instant feedback, works offline-ish.", "what": "RK-05 editor: tabbed starter code / reference solution / hidden tests (author-defined, weighted) / expected output / settings; auto-suggests 💻 device rule. RK-12 validation console: runs the reference solution against the hidden tests in-browser and diffs the expected output; red until green.", "how": "Code executes in a WASM sandbox on the client; hidden tests and expected output are stored with the draft but never shipped to students; grading runs the hidden tests against the snapshot at attempt time. Metric: console feedback &lt; 2 s on a mid-range phone.", "kata": "Kata: absent — and why: staff authoring surface; the console speaks monospace, not mascot.", "edge": "Edge cases: Author deletes the reference solution → validation console refuses to run (“nothing to grade against”); test with syntax error → flagged inline before run; WASM load failure on old browser → graceful “use a newer browser” wall; expected output with trailing whitespace → diff-normalised compare; 50+ hidden tests → batched run with progress.", "metric": "console feedback &lt; 2 s on a mid-range phone.", "chain": "“＋ Add item → 💻 code console” on RK-03 → RK-05 editor · tabs: starter / solution / tests / output → authors starter code + reference + 4 weighted tests → taps “▶ Run validation preview” → RK-12 runs WASM in-browser · t4 ✗ 341 ms (limit 200) → raises t4 limit to 400 ms → re-run → 4/4 green → Save item → RK-03 shows “4 hidden tests ✓”, 💻 rule suggested"}, "RK-12": {"name": "Validation preview console", "flow": "JA-K05 · Code-console questions — the centerpiece NEW · WASM sandbox · zero server risk", "status": "new", "purpose": "Run the reference solution against hidden tests in-browser; diff expected output; block grade-check until green.", "adapt": "Console + results table side by side; link out to student preview (RK-07).", "states": ["running", "all pass", "tests failing (drawn)", "expected-output mismatch", "runtime error in starter code"], "story": "The author writes starter code, a reference solution, hidden tests and the expected console output. Then she opens the validation console and runs her own solution in the browser: 3 of 4 tests pass — the perf test fails at 341 ms, so she fixes the limit before any student ever touches the item. Students later get the same editor plus in-browser console for instant pass/fail, while the hidden tests remain the real grade source.", "why": "Coding practice is the school’s core product, and server-side code execution is both a security nightmare and a cost sink. WebAssembly (Pyodide) runs student code in a browser sandbox: zero server risk, instant feedback, works offline-ish.", "what": "RK-05 editor: tabbed starter code / reference solution / hidden tests (author-defined, weighted) / expected output / settings; auto-suggests 💻 device rule. RK-12 validation console: runs the reference solution against the hidden tests in-browser and diffs the expected output; red until green.", "how": "Code executes in a WASM sandbox on the client; hidden tests and expected output are stored with the draft but never shipped to students; grading runs the hidden tests against the snapshot at attempt time. Metric: console feedback &lt; 2 s on a mid-range phone.", "kata": "Kata: absent — and why: staff authoring surface; the console speaks monospace, not mascot.", "edge": "Edge cases: Author deletes the reference solution → validation console refuses to run (“nothing to grade against”); test with syntax error → flagged inline before run; WASM load failure on old browser → graceful “use a newer browser” wall; expected output with trailing whitespace → diff-normalised compare; 50+ hidden tests → batched run with progress.", "metric": "console feedback &lt; 2 s on a mid-range phone.", "chain": "“＋ Add item → 💻 code console” on RK-03 → RK-05 editor · tabs: starter / solution / tests / output → authors starter code + reference + 4 weighted tests → taps “▶ Run validation preview” → RK-12 runs WASM in-browser · t4 ✗ 341 ms (limit 200) → raises t4 limit to 400 ms → re-run → 4/4 green → Save item → RK-03 shows “4 hidden tests ✓”, 💻 rule suggested"}, "RK-06": {"name": "Device &amp; access rules", "flow": "JA-K06 · Device &amp; access rules — 📱 / 💻 / both, enforced NEW · runner-enforced", "status": "new", "purpose": "Device pill (📱/💻/both) with item-driven suggestion, open/close window, attempt &amp; late policy, audience, badge + enforcement-wall previews. Badges 📱 / 💻 / 📱+💻 set here, shown on every node and CTA.", "adapt": "Two cards + badge-preview rail; “preview enforcement” opens the student wall in a dialog.", "states": ["default (both)", "suggested 💻 (drawn)", "window not set (draft-only)", "conflicting rules warning", "saved", "published (locked, version via re-publish)"], "story": "The lecturer sets the device rule for the activity: 📱 phone, 💻 desktop or both. The builder suggests 💻 automatically because item 3 is a code console. She also sets the open/close window, the attempt policy and the audience — then sees exactly the badge students will see, and the “use a laptop” wall a phone user would hit.", "why": "A coding item on a phone keyboard is misery, and a rule that is only a label trains students to ignore it. The device rule must be enforced by the runner at launch, not just rendered as a pretty badge.", "what": "Device selector with auto-suggestion driven by item types; open/close window; attempts (1 / 3 / unlimited) with scoring policy; late policy; audience scope; live previews of the student badge and the enforcement wall.", "how": "Rules are stored on the activity and snapshotted at publish; the runner checks device form factor before item 1 and shows the wall on violation; window/attempt checks happen at the same gate. Metric: 0 device-rule violations reach item 1.", "kata": "Kata: absent — and why: staff rules screen; even the enforcement-wall preview is quoted text, not a character.", "edge": "Edge cases: Window in the past → publish blocked; “both” chosen with a code item → warning but allowed; student on tablet → form-factor mapping documented (tablet counts as 💻 for code, 📱 otherwise); attempts exhausted → student sees best-score summary, lecturer can grant +1 individually; timezone → stored in course TZ, shown with offset.", "metric": "0 device-rule violations reach item 1.", "chain": "taps “Device rules (RK-06)” on RK-03 → RK-06 opens · 💻 auto-suggested (code item present) → confirms 💻, sets window Mon→Fri, attempts 3 → taps “Save rules” → saved · 💻 badge renders on RK-01 row + student card → publish snapshots the rules (RK-08) → student on phone taps activity → runner gate: “use a laptop 💻” wall — item 1 never loads"}, "RK-07": {"name": "Preview &amp; grade-check", "flow": "JA-K07 · Preview as student + grade-check — trust before publish NEW · mandatory by law", "status": "new", "purpose": "Real-runner preview in all three form factors with answer-key overlay; per-item sign-off and flag flow; progress bar feeds the publish gate.", "adapt": "Preview pane + grade-check rail side by side; code items show the console; overlay toggle always visible.", "states": ["not started", "in progress (drawn)", "item flagged (wrong key)", "100 % signed (gate unlocks)", "author tries self-check (blocked)"], "story": "The reviewer runs the activity exactly as a student would, switching between phone, tablet and desktop, with the answer-key overlay on: every item shows its stored key and explanation inline. On item 4 the overlay exposes a disaster — the stored “bug” is the wrong line. She flags it; publish stays blocked until all five items are signed off.", "why": "One wrong “correct answer” burns student trust forever and is unrecoverable at scale. Previewing in the real runner — not a mock — catches rendering, device and grading bugs before students do.", "what": "Student-runner preview of the draft snapshot with a form-factor switcher; answer-key overlay showing key + explanation per item; per-item grade-check (key correct, explanation renders, grading verified by deliberately answering wrong); sign-off list with flag flow.", "how": "Preview executes the real runner against the immutable draft snapshot; grade-check state is stored per item per reviewer; the publish gate reads it and refuses anything below 100 %. Metric: 100 % of items grade-checked before publish, reviewer ≠ author.", "kata": "Kata: absent — and why: staff review surface; the student chrome is previewed inside it, not addressed to the reviewer.", "edge": "Edge cases: Author opens grade-check on own activity → blocked, “assign a reviewer”; item edited after sign-off → its sign-off resets automatically; preview on phone-width for a 💻-only activity → shows the enforcement wall instead; code item with red validation (RK-12) → grade-check disabled for that item; reviewer flags then leaves → flag persists with comment thread.", "metric": "100 % of items grade-checked before publish, reviewer ≠ author.", "chain": "reviewer M. Ferreira opens “Preview” from RK-08 → RK-07 · real runner vs draft snapshot · 🔑 overlay ON → switches 📱 → ▦ → 💻 per item → items render per form factor · 💻-only activity at 📱 width shows the RK-06 wall → answers item 4 wrong on purpose → key mismatch → taps “✗ Flag wrong key” → flag + comment to author · item 4 sign-off blocked → author fixes key in RK-04 → item 4 sign-off resets → reviewer re-checks → 5/5 → RK-08 unlocks"}, "RK-08": {"name": "Publish gate", "flow": "JA-K08 · Publish gate + bank — review, snapshot, reuse gate · snapshot law · 2 BUILT reuses", "status": "new", "purpose": "Four-step gate (draft · grade-check · review · publish) with role enforcement and snapshot-on-publish notice.", "adapt": "Pipeline cards with open review comments and snapshot preview.", "states": ["draft", "grade-check pending", "in review (drawn)", "review rejected (back to draft)", "ready", "published (v1)", "re-publish (v2)"], "story": "The activity finishes its journey: draft done, grade-check 5/5, peer review by someone who is not the author, then publish — which writes an immutable snapshot and attaches it to a module session. The question bank feeds both directions: items imported into the draft, validated items exported for reuse across programs, with the private → course → global visibility ladder. Mechanic config (lives / wager / timer) is tuned per shell and frozen with the snapshot.", "why": "Publishes must be boring. Reviewed by a second pair of eyes (law: reviewer ≠ author), frozen so later bank edits never corrupt live activities, attached so students actually find it — and reusable so the next program does not start from zero.", "what": "RK-08: four-step gate with checklist and reviewer request, publish locked until every step is green. RK-09: bank list with visibility ladder, import/export, per-item snapshot status. RK-10: per-shell lives/wager/timer/no-help config with defaults compare. RK-11: module/session picker with per-attachment snapshot binding.", "how": "Gate state machine draft → review → published with role check reviewer ≠ author; publish writes the snapshot atomically and links attachments to it; bank import copies items into the draft (source stays clean); re-publish creates v2 with explicit per-attachment upgrade. Metric: 0 published activities mutated after publish.", "kata": "Kata: absent — and why: governance surface; the only characters here are ❤ and 🪙 from the mechanic config.", "edge": "Edge cases: Author requests review from themselves → blocked by role check; reviewer rejects → back to draft with comments, grade-check resets on edited items only; publish while window already open → allowed, students see it immediately; import of a globally-edited item → copy, not reference; deleting an attached module → attachment dangles with “orphan” warning, activity stays published.", "metric": "0 published activities mutated after publish.", "chain": "grade-check hits 5/5 on RK-07 → RK-08 gate · steps ①② green → author taps “Request review” → picks M. Ferreira → ③ review · role check passes (reviewer ≠ author) → reviewer approves (1 comment resolved) → author taps “Publish” → snapshot v1 written atomically · status → published → opens RK-11 → attaches v1 to session 3.2 → live: students see “👹 Flexbox boss · 💻 · closes Fri 18:00” on the module card"}, "RK-09": {"name": "Q
