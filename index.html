with feedback, earlier step scores preserved.", "metric": "session-detail opens ≥50% of attendees; guided-practice completion ≥70%.", "chain": "taps “Today: Khinkali lab” on RM-11 → RM-20: header time/room/Zoom + topics + homework 📱 → taps homework “Guided: fold 20 khinkali” → RM-21 rail: step 3 current, demo video + photo evidence required → uploads photo, taps “Mark done” → step 3 → pending evaluation · chef notified → server event: chef scores step 3 (9/10) → rail updates, step 4 unlocks · all done → ceremony + total to RM-13"}, "RM-22": {"name": "Sign a document", "flow": "JA-M17 · Document signing (DocFlow) all programs", "status": "built", "purpose": "The signing moment: secure header (doc number, sender, expiry), document body, required fields marked, signature pad (draw or type), one-time consent line, decline with reason.", "adapt": "desktop 2-pane (document left, your fields right); mobile stacked, signature pad thumb-reachable.", "states": ["awaiting signature", "fields partially filled", "consent unchecked (submit blocked, stated)", "signed → sealed confirmation", "declined (reason)", "expired (ask resend)"], "story": "“As a student, I want to open a document my school sends me, read it, fill what’s mine, and sign it with a finger or a name — and to see every document I’ve signed since.”", "why": "The LMS runs a full DocFlow engine: envelopes with hash-chained trails, recipients with tiers and tokens, required fields, consents, counters per kind. Students experience only two moments: sign, and look back at what they signed.", "what": "Two screens: the signing view (secure header with doc number, document body, required fields pre-marked, signature pad draw-or-type, one-time consent line, decline path) and my documents (register with doc numbers and states: awaiting, signed/sealed, declined, expired).", "how": "Recipient token resolves the envelope; fields validate required; consent written once per user (terms_version + ip); recipient status → signed, document status → completed, sealed hash computed; decline captures reason. Metric: sent→completed conversion ≥85% within 7 days.", "kata": "Kata: neutral-clerk: “Number 10X-CT-2026-014, two fields, one name. Signed means sealed — after that, not even I can touch it.”", "edge": "Edge cases: Token expired → “ask HR to resend” honest state, no oracle · recipient declines → reason optional, sender notified, student keeps the record · double-submit → idempotent (one sealed hash, one trail) · all learners 18+ (D-23) · sealed ≠ locked: a sealed doc opens read-only anytime.", "metric": "sent→completed conversion ≥85% within 7 days.", "chain": "taps signing link (email/in-app, token in URL) → RM-22 opens envelope 10X-CT-2026-014: body + 2 required fields → fills name + birth date, draws signature → checks one-time consent, taps Sign → sealed confirmation: hash computed, trail closed → RM-23 row flips to “signed ✓ sealed”"}, "RM-23": {"name": "My documents", "flow": "JA-M17 · Document signing (DocFlow) all programs", "status": "built", "purpose": "The personal register: every envelope to you with doc number and state — awaiting (sign-now CTA), signed/sealed ✓, declined, expired.", "adapt": "desktop table; tablet cards; state chips always readable, never color-only.", "states": ["awaiting signature", "signed (sealed, view)", "declined (HR notified, honest)", "expired (ask resend)", "empty (no documents yet)"], "story": "“As a student, I want to open a document my school sends me, read it, fill what’s mine, and sign it with a finger or a name — and to see every document I’ve signed since.”", "why": "The LMS runs a full DocFlow engine: envelopes with hash-chained trails, recipients with tiers and tokens, required fields, consents, counters per kind. Students experience only two moments: sign, and look back at what they signed.", "what": "Two screens: the signing view (secure header with doc number, document body, required fields pre-marked, signature pad draw-or-type, one-time consent line, decline path) and my documents (register with doc numbers and states: awaiting, signed/sealed, declined, expired).", "how": "Recipient token resolves the envelope; fields validate required; consent written once per user (terms_version + ip); recipient status → signed, document status → completed, sealed hash computed; decline captures reason. Metric: sent→completed conversion ≥85% within 7 days.", "kata": "Kata: neutral-clerk: “Number 10X-CT-2026-014, two fields, one name. Signed means sealed — after that, not even I can touch it.”", "edge": "Edge cases: Token expired → “ask HR to resend” honest state, no oracle · recipient declines → reason optional, sender notified, student keeps the record · double-submit → idempotent (one sealed hash, one trail) · all learners 18+ (D-23) · sealed ≠ locked: a sealed doc opens read-only anytime.", "metric": "sent→completed conversion ≥85% within 7 days.", "chain": "taps signing link (email/in-app, token in URL) → RM-22 opens envelope 10X-CT-2026-014: body + 2 required fields → fills name + birth date, draws signature → checks one-time consent, taps Sign → sealed confirmation: hash computed, trail closed → RM-23 row flips to “signed ✓ sealed”"}, "RM-24": {"name": "Change password", "flow": "JA-M18 · Change password all programs", "status": "built", "purpose": "The secure self-service: current → new (strength meter + plain rule) → confirm → update, with the other-devices-sign-out note and the forced-change state.", "adapt": "centered card max 480 on all factors; strength meter full-width.", "states": ["choosing", "weak (rule shown, submit disabled)", "mismatch (inline)", "forced change on first login (explains why)", "success (other sessions revoked, stated)"], "story": "“As a student, I want to change my password in seconds, with a strength hint and no surprises about what happens to my other devices.”", "why": "The LMS hardens auth properly: argon2id hashes, a session-version stamp that revokes old tokens on change, password-age tracking for rotation, and a must_change_password gate for first logins. The UI’s job is to make that machinery feel simple and honest.", "what": "One screen: current password, new password with live strength meter and the plain rule, confirm, the honest note that other devices sign out, and the forced-change state when the flag is set.", "how": "Verify current → hash new (argon2id) → bump session_version (this session survives, others die) → stamp password_changed_at → audit entry. Metric: change completion ≥95% once started.", "kata": "Kata: neutral-clerk: “New key cut in eight characters. This door stays open for you — the others close. That’s not a threat, that’s the point.”", "edge": "Edge cases: Wrong current password → uniform error, no hint which part failed · forced change but student keeps dismissing → gate returns at next login, never traps · same as old password → rejected with the rule restated · on shared device → shows the “others sign out” line before submit, always.", "metric": "change completion ≥95% once started.", "chain": "profile → security → “Change password” → RM-24: current / new / confirm, meter idle → types new password — meter updates per keystroke → taps Update → server: current verified → argon2id hash → session_version bumped → RM-24 success: “done · your other devices were signed out” (this device stays)"}, "RM-25": {"name": "Account suspended", "flow": "JA-M19 · Suspended account edge", "status": "built", "purpose": "The calm dead-end that isn’t one: shield, “paused by the college”, data-safe promise, coordinator contact, mistake report, switch account.", "adapt": "centered hero on all factors; no app chrome, no nav — the only screen in the product without them.", "states": ["suspended (default)", "suspended while mid-floor (progress preserved, stated)", "reactivated → welcome back", "sibling device (switcher offered)"], "story": "“As a student whose account got suspended, I want to know my work is safe, who to talk to, and what I can do next — not a dead 403 page.”", "why": "Suspension revokes sessions and routes to /suspended. The state must be calm and honest: data preserved, a human contact, a report path for mistakes, and an account-switch route for siblings on shared devices.", "what": "A full-page calm notice: shield mark, “access paused by the college”, data-safe promise, coordinator contact, mistake report path, sign-in-with-another-account. No chrome, no nav — the only screen in the product without them.", "how": "users.active=0 → session_version bumped → /suspended; report writes to the reports channel; switcher (RA-08) unaffected. Metric: suspension → resolution contact made within 48h ≥60%.", "kata": "Kata: absent — and why: no mascot on an enforcement surface; the page is plain, calm and human.", "edge": "Edge cases: Suspended during an active exam → the exam’s integrity log records the cutoff, invigilator notified · reactivated mid-semester → cohort/buddy/league re-checked quietly · shared device with sibling → switcher is the primary escape, stated · no pushes, no mascot, no nav — enforcement surfaces stay bare.", "metric": "suspension → resolution contact made within 48h ≥60%.", "chain": "server event: coordinator sets users.active=0 · session_version bumped → student’s next request (any screen) → RM-25 full-page: shield + “paused by the college” + data-safe line → taps “Message your coordinator” → contact sheet: coordinator name + channel, 48h expectation stated"}, "RN-01": {"name": "Add a friend", "flow": "JA-N01 · Add a friend friend code · invite link · first-name search — no directory", "status": "new", "purpose": "Three routes in one screen: your shareable code (tap to copy, regenerate kills it), a 7-day invite link, and rate-limited first-name search; result cards show first name + band only, and a request is a pending offer, not a follow.", "adapt": "three routes as side-by-side cards; desktop adds a “pending requests” strip and the revocable-links list.", "states": ["default (code visible)", "searching", "1 exact match", "no exact match", "request sent ✓", "rate-limited (try again in 42m)", "link expired", "regenerate confirm"], "story": "Wednesday 19:40. Noor met Mara at the evening study circle. She opens Add a friend, reads out her six-character code, Mara types it in — done. No scrolling through classmates, no “people you may know”, no way to find anyone who wasn’t already looking to be found.", "why": "Connection must be opt-in and initiated in the real world. A searchable directory of children is a safeguarding failure; a shareable code is not.", "what": "One calm screen with three routes: a regenerable friend code, a 7-day invite link, and an exact-match first-name search capped at 5/hour. Requests are offers the other side can quietly ignore.", "how": "Code = 6 chars, regenerating kills the old one instantly; link expires in 7 days and is revocable from pair settings (RN-05); search returns exact first-name matches only — first name + program/band, never grades or streaks — and hard-stops at the rate limit. Metric: ≥40% of friend requests accepted within 7 days; 0 directory-scraping or enumeration incidents.", "kata": "Kata: 🦊 Fenn the fox: “A code passed hand-to-hand beats any directory — you choose who can find you.”", "edge": "Edge cases: search budget exhausted → “try again in 42 min”, never partial-name browsing · code mistyped 3× → gentle cooldown, no lockout shame · invite link opened after expiry → polite expired page, owner prompted to share a fresh one · duplicate request to the same student → merges silently · code regenerated → old code and old links die instantly, pending requests survive · request ignored 7 days → lapses quietly, never re-notified.", "metric": "≥40% of friend requests accepted within 7 days; 0 directory-scraping or enumeration incidents.", "chain": "student taps “Add a friend” (RN-02 ➕ or empty state) → RN-01 three routes → route A: reads code aloud → friend types 4K7-QT2 on her device → request sent ✓ · pending — Mara accepts → pair appears in RN-02 (JA-N02)"}, "RN-02": {"name": "Friends list", "flow": "JA-N02 · Friends list pair flames · 1/day nudge · silent unpair", "status": "new", "purpose": "All pair flames with shared-streak state (lit / waiting / dimmed), 1/day nudge per pair; tap a pair → pair-flame sheet (RG-05, already specified); unpair is not here — it’s one level down in RN-05.", "adapt": "tablet groups lit / waiting / dimmed under section headers; desktop shows the list beside the open RG-05 pair-flame sheet.", "states": ["list (lit / waiting / dimmed)", "nudge sent (24h cooldown chip)", "nudge budget used", "empty (“no friends yet — add from RN-01”)", "offline (cached list, nudges queued)", "pair archived after silent unpair"], "story": "Sunday 18:05. Noor’s list shows three pairs: Mara — flame ×6, both practiced today ✓; Theo — flame ×3, waiting on him, so she spends her one daily nudge; Anouk’s flame has dimmed after two quiet days, and the copy says “no pressure, just an invite”. Nobody else’s grades, streaks, or mistakes appear anywhere on this screen.", "why": "Pair flames are the co-op retention engine, but only if the shared streak stays a private thing between two students — the moment it becomes comparable, it becomes pressure.", "what": "A list of all pairs with shared-streak state (lit / waiting / dimmed), one nudge per pair per day, and a calm path to pair settings (RN-05). Tapping a pair opens the pair-flame sheet already specified in RG-05 — this flow reuses it, never duplicates it.", "how": "Shared-streak state derives from both students’ daily activity but displays only the pair artifact (flame count), never either side’s personal stats; nudge = 1/day per pair and counts inside the ≤2/day notification budget; unpair is deliberately not on this screen — it lives one tap deeper in RN-05 so it can’t happen by accident. Metric: ≥30% of active pairs keep a weekly shared streak alive; nudge→session rate ≥25%.", "kata": "Kata: 🦊 Fenn the fox: “A pair flame counts only what you two did together — never what either of you did alone.”", "edge": "Edge cases: nudge already spent today → chip shows 24h cooldown, counts inside the ≤2/day notification budget · partner muted you → your nudge delivers silently (you’re never told) · flame dimmed ≥7 days → one gentle “still pals?” prompt, then an archive offer — never an auto-unpair · offline → cached list, nudges queue and send on reconnect · the other side unpaired → the row quietly becomes a past pair: no alert, no reason, no trace · empty list → routes to RN-01, never suggests strangers.", "metric": "≥30% of active pairs keep a weekly shared streak alive; nudge→session rate ≥25%.", "chain": "student opens Friends tab → RN-02 list: Mara lit ×6 · Theo waiting ×3 · Anouk dimmed → taps Nudge on Theo (1/day per pair) → RN-02 nudge sent ✓ chip · 24h cooldown — counts inside ≤2/day push budget → Theo opens from the nudge → practices → both halves done → pair flame advances ×4 at midnight"}, "RN-03": {"name": "Friend quest", "flow": "JA-N03 · Friend quest weekly joint goal · shared bar · per-friend cap", "status": "new", "purpose": "Weekly joint goal (“earn 250 ⚡ together”): one shared bar, per-friend contribution rows with a ≤60% cap so nobody carries, and a chest card that pays both or neither; opt-in each week.", "adapt": "tablet splits bar + contribution ledger; desktop adds a week-history table of past quests.", "states": ["in-progress (178/250)", "you capped (your ⚡ stops counting — copy invites partner)", "complete → chest for both", "expired (no-blame reset)", "no active quest (opt-in next week)", "unpaired mid-week → quest voided"], "story": "Friday 20:15. Noor and Mara’s weekly quest reads “earn 250 ⚡ together” — the bar sits at 178. Noor has added 96, Mara 82. Noor’s cap is 150 (60%): she can sprint, but she can’t carry. When the bar fills, one chest opens — and it pays both of them, or neither.", "why": "A joint goal turns the solo ⚡ grind into co-op — but without a contribution cap, the stronger student carries and the other learns to be carried. Both outcomes kill the friendship mechanic.", "what": "RN-03 shows the weekly friend quest: one shared progress bar, each partner’s contribution against their cap (≤60% of goal), and a chest that opens for both at completion — or neither.", "how": "Progress = sum of both partners’ ⚡ earned anywhere in the app that week, but each side stops counting at the cap; the chest rolls into both inventories simultaneously; an expired quest resets with no-blame copy and no penalty. Contributions are the only friend-visible number — never grades, accuracy, or mistakes. Metric: ≥50% of active pairs complete the weekly quest; cap-reached events on the stronger partner ≥20% (proof the cap is load-bearing).", "kata": "Kata: 🦊 Fenn the fox: “The chest opens for both or neither — nobody carries, and nobody is carried.”", "edge": "Edge cases: you hit the 60% cap → your ⚡ stops counting, copy invites Mara (“her half is waiting”) · partner inactive all week → quest expires with no-blame copy; a chest never half-pays · ⚡ from any practice counts here (one shared pool) · pair unpairs mid-week → quest voids for both, ⚡ already earned stays earned, no chest · both capped below goal → quest shows the math honestly and offers a smaller joint goal next week · chest opening requires no claim action — it lands in both inventories at once.", "metric": "≥50% of active pairs complete the weekly quest; cap-reached events on the stronger partner ≥20% (proof the cap is load-bearing).", "chain": "Monday 00:00 · both partners opted in → RN-03 quest created: “earn 250 ⚡ together” · week 12 → either partner earns ⚡ in any practice, anywhere in the app → RN-03 shared bar advances — each side capped at 150 (60%) → bar reaches 250 ⚡ → quest chest lands in both inventories at once — both or neither"}, "RN-04": {"name": "Meet your people", "flow": "JA-N04 · Meet your people band/cohort suggestions · never auto-add · silent unpair", "status": "new", "purpose": "Band/cohort suggestions as pure offers: first name + band only, accept sends a hello, decline fades the card invisibly; never auto-add, max 3/week, “why am I seeing this?” explainer on the card.", "adapt": "tablet shows suggestion cards two-up; desktop adds the cohort context panel and privacy explainer inline.", "states": ["2 suggestions", "hello sent (pending both-confirm)", "declined (invisible fade)", "empty band (“still forming” — never fabricates names)", "weekly suggestion cap reached"], "story": "Monday 19:00. Noor’s suggestions card reads “students in your evening band — 4 of you practice after 18:00” and offers Mila: first name, band, grade. Nothing else. Noor can say hi or tap “Not now” — and if she declines, the card simply fades. Mila never knows she was offered, let alone declined. In pair settings, unpairing from anyone is one tap behind a single confirm — and stays silent forever.", "why": "Cohort belonging is real retention, but matching children must be an offer with a dignified exit — a suggestion that obliges, exposes, or reports back is a safeguarding failure.", "what": "RN-04 offers band/cohort suggestions (“students in your evening band”, “same cohort”), max 3/week, first name + band only, accept or decline — decline is invisible and never re-offered for 30 days. RN-05 is pair settings: one-tap silent unpair, mute nudges, invite-link revoke.", "how": "Suggestions derive only from band/cohort metadata the school already holds — never from performance, so a suggestion can never leak “students at your level”; nothing is ever auto-added; unpair sends no notification and leaves no trace on the other side; mute is equally silent. Metric: ≥20% hello-accept rate on suggestions; &lt;5% unpair-within-7-days after a suggestion-based pairing.", "kata": "Kata: 🦊 Fenn the fox: “A suggestion is a knock on the door — ‘not now’ closes it without a sound.”", "edge": "Edge cases: decline → card fades, never re-offered for 30 days, invisible to the other side · both accept simultaneously → hello exchanged, pair still pending until both confirm · suggestion pool empty → honest “your band is still forming” state, never fabricated names · already-paired student suggested → filtered server-side · unpair/mute never feeds back into suggestion ranking · unpair during an active friend quest → quest voids per JA-N03, no chest, no message · re-pair after unpair requires a fresh code — history does not resurrect the old pair.", "metric": "≥20% hello-accept rate on suggestions; &lt;5% unpair-within-7-days after a suggestion-based pairing.", "chain": "system: Monday · band/cohort metadata match found (never performance data) → RN-04 suggestion card: Mila · evening band · Grade 6 (max 3/week) → student taps “Say hi 👋” → RN-04 hello sent · pending both-confirm → Mila accepts → pair appears in RN-02 (JA-N02)"}, "RN-05": {"name": "Pair settings", "flow": "JA-N04 · Meet your people band/cohort suggestions · never auto-add · silent unpair", "status": "new", "purpose": "The dignity screen: one-tap silent unpair behind a single confirm sheet (nothing is ever sent to the other side), mute-nudges toggle, invite-link revoke — every exit is quiet.", "adapt": "tablet shows settings list with confirm sheet; desktop renders the confirm as a centered dialog.", "states": ["settings", "mute on (partner never told)", "confirm-unpair sheet/dialog", "unpaired → returns to RN-02, no trace", "link revoked (old link dies instantly)"], "story": "Monday 19:00. Noor’s suggestions card reads “students in your evening band — 4 of you practice after 18:00” and offers Mila: first name, band, grade. Nothing else. Noor can say hi or tap “Not now” — and if she declines, the card simply fades. Mila never knows she was offered, let alone declined. In pair settings, unpairing from anyone is one tap behind a single confirm — and stays silent forever.", "why": "Cohort belonging is real retention, but matching children must be an offer with a dignified exit — a suggestion that obliges, exposes, or reports back is a safeguarding failure.", "what": "RN-04 offers band/cohort suggestions (“students in your evening band”, “same cohort”), max 3/week, first name + band only, accept or decline — decline is invisible and never re-offered for 30 days. RN-05 is pair settings: one-tap silent unpair, mute nudges, invite-link revoke.", "how": "Suggestions derive only from band/cohort metadata the school already holds — never from performance, so a suggestion can never leak “students at your level”; nothing is ever auto-added; unpair sends no notification and leaves no trace on the other side; mute is equally silent. Metric: ≥20% hello-accept rate on suggestions; &lt;5% unpair-within-7-days after a suggestion-based pairing.", "kata": "Kata: 🦊 Fenn the fox: “A suggestion is a knock on the door — ‘not now’ closes it without a sound.”", "edge": "Edge cases: decline → card fades, never re-offered for 30 days, invisible to the other side · both accept simultaneously → hello exchanged, pair still pending until both confirm · suggestion pool empty → honest “your band is still forming” state, never fabricated names · already-paired student suggested → filtered server-side · unpair/mute never feeds back into suggestion ranking · unpair during an active friend quest → quest voids per JA-N03, no chest, no message · re-pair after unpair requires a fresh code — history does not resurrect the old pair.", "metric": "≥20% hello-accept rate on suggestions; &lt;5% unpair-within-7-days after a suggestion-based pairing.", "chain": "system: Monday · band/cohort metadata match found (never performance data) → RN-04 suggestion card: Mila · evening band · Grade 6 (max 3/week) → student taps “Say hi 👋” → RN-04 hello sent · pending both-confirm → Mila accepts → pair appears in RN-02 (JA-N02)"}, "RO-01": {"name": "Integrity card", "flow": "JA-O01 · Exam integrity card &amp; lobby before start", "status": "new", "purpose": "Pre-exam contract: device requirement (desktop-only vs in-app), timer, one attempt, and the exact danger-zone consequence printed plainly with its grace seconds — the start path doesn't exist until the rules do.", "adapt": "rules become a two-column card; the consequence panel is highlighted, never fine print. Desktop render shows the in-app-quiz variant with 📱/💻 device badges.", "states": ["desktop-exam variant (device required)", "in-app variant (runs here, strict mode listed)", "consequence mirrored from builder (kill / −% / −points / warn+log)", "not-eligible (wrong device — no start button)", "already-attempted (one attempt spent, result link instead)"], "story": "“As a student, I want every rule — device, timer, one attempt, consequence — printed before I start, so nothing about the exam can ever surprise me.”", "why": "Rules discovered mid-exam read as traps, and a student who feels trapped learns the system is adversarial. Printing the law first converts enforcement into fairness — the card that warns is the same card that protects.", "what": "A pre-exam integrity card (RO-01) stating the device requirement, timer, the one-attempt rule and the exact danger-zone consequence in plain language — then a countdown lobby (RO-05) that holds students on server time until the start minute.", "how": "RO-01 copy is generated from the exam's builder config (shape, timer, consequence, grace seconds), so printed text can never drift from enforcement. The lobby syncs to server time; Enter unlocks itself at the start minute and the entry writes exam_entered to the audit trail. Metric: ≤1% of exam starts produce a “I didn't know” support ticket.", "kata": "Kata: fair-starter: “Every rule is on the table before the clock starts — device, timer, one attempt, consequence. If it isn't printed here, it can't happen to you.”", "edge": "Edge cases: Wrong device → card flips to not-eligible with what-to-do, no Continue button · already-attempted → card shows the sealed-result link instead of the lobby, no restart path exists · device clock wrong → lobby syncs to server time; device drift is shown, never trusted · consequence copy is generated from the builder config, so the printed warning can never drift from enforcement · student spams Enter before 10:00 → button is inert until the server minute flips, no refresh lottery.", "metric": "≤1% of exam starts produce a “I didn't know” support ticket.", "chain": "builder publishes exam config (RO-06 v2: 40 min · −20% · 5s grace) → student taps “Algebra II · Midterm” → RO-01 integrity card — consequence printed from config → taps Continue to lobby → RO-05 lobby — server-time countdown 04:59…00:01 → start minute 10:00 arrives → Enter unlocks · tap writes exam_entered to audit → RO-02 strict runner boots"}, "RO-05": {"name": "Countdown lobby", "flow": "JA-O01 · Exam integrity card &amp; lobby before start", "status": "new", "purpose": "Holding room synced to server time: big countdown to the start minute, three-line rules recap, Enter enables itself exactly at start — no refresh lottery, no clock trust.", "adapt": "centered lobby card; desktop adds a rules table and a live “classmates waiting” count.", "states": ["waiting (&gt;5 min)", "imminent (≤60s, countdown emphasized)", "open (Enter enabled, entry audit-logged)", "late-join window per builder", "missed (window closed — states plainly what happens next)"], "story": "“As a student, I want every rule — device, timer, one attempt, consequence — printed before I start, so nothing about the exam can ever surprise me.”", "why": "Rules discovered mid-exam read as traps, and a student who feels trapped learns the system is adversarial. Printing the law first converts enforcement into fairness — the card that warns is the same card that protects.", "what": "A pre-exam integrity card (RO-01) stating the device requirement, timer, the one-attempt rule and the exact danger-zone consequence in plain language — then a countdown lobby (RO-05) that holds students on server time until the start minute.", "how": "RO-01 copy is generated from the exam's builder config (shape, timer, consequence, grace seconds), so printed text can never drift from enforcement. The lobby syncs to server time; Enter unlocks itself at the start minute and the entry writes exam_entered to the audit trail. Metric: ≤1% of exam starts produce a “I didn't know” support ticket.", "kata": "Kata: fair-starter: “Every rule is on the table before the clock starts — device, timer, one attempt, consequence. If it isn't printed here, it can't happen to you.”", "edge": "Edge cases: Wrong device → card flips to not-eligible with what-to-do, no Continue button · already-attempted → card shows the sealed-result link instead of the lobby, no restart path exists · device clock wrong → lobby syncs to server time; device drift is shown, never trusted · consequence copy is generated from the builder config, so the printed warning can never drift from enforcement · student spams Enter before 10:00 → button is inert until the server minute flips, no refresh lottery.", "metric": "≤1% of exam starts produce a “I didn't know” support ticket.", "chain": "builder publishes exam config (RO-06 v2: 40 min · −20% · 5s grace) → student taps “Algebra II · Midterm” → RO-01 integrity card — consequence printed from config → taps Continue to lobby → RO-05 lobby — server-time countdown 04:59…00:01 → start minute 10:00 arrives → Enter unlocks · tap writes exam_entered to audit → RO-02 strict runner boots"}, "RO-02": {"name": "Strict exam runner", "flow": "JA-O02 · Strict in-app runner one attempt", "status": "new", "purpose": "Exam-mode question runner: timer always visible, question + options only, progress bar, zero hint/shop surfaces. A pause control exists only for in-class exams, inside its live window.", "adapt": "question card centers with a 2-col option grid; desktop shows timer + progress in a slim header strip and the integrity reminder as a footer row.", "states": ["running", "answered (locks per question on submit)", "reconnecting (clock rule per builder)", "paused — in-class window only (R8-05)", "time-expired auto-submit", "submitted"], "story": "“As a student, I want exam mode to be visibly different — no hints, no shop, just me and the timer — so I trust the grade means something.”", "why": "The runner's value is its austerity. If exam mode looks like practice mode with a darker title, grades stop meaning anything and honest students feel played.", "what": "A stripped runner (RO-02): question, options, timer, progress — nothing else. No hints, no shop, no streak items; connection required; one attempt. In-class exams may pause/resume only inside a builder-set window (R8-05).", "how": "The runner boots in an exam-session context where hint and shop APIs return hard-disabled, not hidden. Answers submit per-question with server timestamps; a connection drop falls to a reconnecting state whose clock rule (pause vs run) comes from the builder and was printed on RO-01. Every event is audit-logged. Metric: 0 hint/shop calls served inside exam sessions; ≥99% answer-submit success.", "kata": "Kata: focus-keeper: “No hints in here — just you, the question and the clock. I'll be right outside when you're done.”", "edge": "Edge cases: Connection drops mid-exam → reconnecting state; the clock pauses only if the builder allows, and that rule was printed on RO-01 · app killed → relaunch resumes at the last submitted question; the one attempt is preserved, not reset · time expires mid-question → only submitted answers count; auto-submit is logged · hint/shop deep-links during a session → hard-disabled response plus an audit entry, never a silent failure · pause pressed outside the R8-05 window → no pause control rendered at all, so there is nothing to abuse.", "metric": "0 hint/shop calls served inside exam sessions; ≥99% answer-submit success.", "chain": "Enter unlocks at start minute (RO-05) → RO-02 boots strict — hint &amp; shop APIs return hard-disabled → answers Q6, taps Submit &amp; next → server timestamps + locks Q6 · progress 6/20 · timer keeps running → …Q20 submitted / timer hits 0:00 → auto-submit · attempt sealed → RO-04 sealed result"}, "RO-03": {"name": "Danger-zone takeover", "flow": "JA-O03 · Danger zone — mobile enforcement live desktop exam", "status": "new", "purpose": "Full-screen takeover: dimmed app behind, big ⚠, live countdown from the builder's grace seconds, one Return button, and the consequence restated in one small line — exactly as printed on RO-01.", "adapt": "same takeover, same countdown, same copy — enforcement is identical on every factor; only the frame scales.", "states": ["countdown running", "returned (dismiss + log)", "expired → consequence applied (kill / −% / −points / warn+log)", "expired state shows what was applied + audit ref", "repeat entry within same exam (countdown restarts, still logged)"], "story": "“As a student taking a desktop exam, I want one unmistakable warning if I open the app — a countdown and a way back — so a reflex tap doesn't become a penalty.”", "why": "Most mid-exam app opens are reflex, not cheating. The takeover treats the student as honest until the grace seconds run out — the warning is loud because the consequence is real, and both were printed on RO-01.", "what": "A full-screen red takeover (RO-03) on any app open during a live desktop exam: dimmed app behind, big ⚠, live countdown from the builder's grace seconds, one Return button, and the exact “what happens if I stay” line.", "how": "The exam session publishes its live status; an app-foreground event triggers the takeover and writes danger_zone_entered; Return writes danger_zone_returned; expiry applies the builder-configured consequence (kill exam / penalty % / deduct points / warn+log) and writes danger_zone_consequence with the rule snapshot attached. Metric: ≥90% of takeovers end in a return before expiry.", "kata": "Kata: guard-sprite: “Hey — your exam is live over there. Hop back before the countdown ends and nothing bad happens. The countdown is the whole trick.”", "edge": "Edge cases: Return tapped exactly at 0:00 → server timestamp wins; returns inside grace are honored and near-ties resolve in the student's favor, still logged · exam ends while the takeover is up → the takeover dissolves silently, no consequence · repeat opens in the same exam → each entry restarts the countdown and logs; escalation happens only via a new builder config version, never mid-session · consequence fired = kill exam → desktop runner ends the attempt, RO-04 shows “attempt voided — rule: app opened mid-exam (config v2)” with the audit ref.", "metric": "≥90% of takeovers end in a return before expiry.", "chain": "server: desktop exam session live (Algebra II · Midterm) → student opens the app (foreground event) → RO-03 takeover — full red screen · ⚠ · countdown 0:05 · writes danger_zone_entered → taps “Return to exam” before 0:00 → app exits to desktop · writes danger_zone_returned · exam unaffected"}, "RO-04": {"name": "Exam result · sealed", "flow": "JA-O04 · Result &amp; consequence config read-only forever", "status": "new", "purpose": "Student result view with the full breakdown (per-stage, per-item); a failure auto-notifies the lecturer with the same table. Read-only forever — corrections are new sealed records, never edits; any applied consequence is shown with its rule ref and timestamp. No edit affordance anywhere, for anyone.", "adapt": "makeup becomes a table (stage · item · score); desktop adds the audit reference beside the total.", "states": ["scored", "consequence applied (shown with rule ref + timestamp)", "fail (lecturer auto-notified with same table)", "pending (essay awaiting teacher — still uneditable by the student)", "sealed (immutable, audit ref shown)"], "story": "“As a student, I want to see exactly how my score is made up — and to know that nobody, not even a teacher, can move the number.”", "why": "Grades that can be quietly edited corrupt everything downstream — leagues, mastery, trust. Read-only is a law, not a preference; the builder config exists so schools tune enforcement before it fires, never after.", "what": "The student result view (RO-04): full per-stage, per-item score makeup, any applied consequence shown with its rule, and the immutable no-editing line — a fail auto-notifies the lecturer with the same table. The admin builder screen (RO-06): choose the danger-zone consequence (kill exam / penalty % / deduct points / warn+log) and the grace seconds, with the student-facing copy previewed before save.", "how": "RO-04 renders from the sealed exam record — no edit endpoint exists for anyone; corrections are new sealed records with reason and author. RO-06 writes versioned rules with author + timestamp to the audit trail, and RO-01/RO-03 copy is generated from that same record so warning and enforcement never diverge. Metric: 0 grade mutations post-seal (invariant); 100% of consequence events traceable to a config version.", "kata": "Kata: honest-scorer (RO-04): “82 is what you earned — I counted it twice and sealed it. Now nobody can move the number, not even me.” · RO-06: absent — and why: staff surface, no mascot — the versioned audit log is the personality here.", "edge": "Edge cases: Teacher wants to fix a miskeyed grade → no edit endpoint exists for anyone; the correction path is a new sealed record with reason + author, shown beside the original · config edited while an exam session is live → the builder is locked; the save queues as the next version · consequence fired while a result is still pending → shown on RO-04 as applied rule + timestamp, and the pending essay can't be edited by the student either · fail notification fails to deliver → the sealed record still stands; delivery retries and the lecturer inbox shows the same table on next login.", "metric": "0 grade mutations post-seal (invariant); 100% of consequence events traceable to a config version.", "chain": "runner auto-submits at 10:41 (RO-02) → server seals the exam record → RO-04 result — 82/100, per-stage per-item table, audit ref EX-2041 → student re-opens weeks later → RO-04 identical — sealed, read-only forever"}, "RO-06": {"name": "Danger-zone config", "flow": "JA-O04 · Result &amp; consequence config read-only forever", "status": "new", "purpose": "Staff builder surface: pick the consequence and grace seconds, preview the exact student-facing RO-01/RO-03 copy, save as a versioned rule — every save signed to the audit trail.", "adapt": "radios gain an effect column; desktop adds a live audit table of recent config changes.", "states": ["editing", "preview (student copy generated from the rule)", "saved (versioned + logged)", "live-exam locked (config frozen while a session runs)", "default warn+log for new exams"], "story": "“As a student, I want to see exactly how my score is made up — and to know that nobody, not even a teacher, can move the number.”", "why": "Grades that can be quietly edited corrupt everything downstream — leagues, mastery, trust. Read-only is a law, not a preference; the builder config exists so schools tune enforcement before it fires, never after.", "what": "The student result view (RO-04): full per-stage, per-item score makeup, any applied consequence shown with its rule, and the immutable no-editing line — a fail auto-notifies the lecturer with the same table. The admin builder screen (RO-06): choose the danger-zone consequence (kill exam / penalty % / deduct points / warn+log) and the grace seconds, with the student-facing copy previewed before save.", "how": "RO-04 renders from the sealed exam record — no edit endpoint exists for anyone; corrections are new sealed records with reason and author. RO-06 writes versioned rules with author + timestamp to the audit trail, and RO-01/RO-03 copy is generated from that same record so warning and enforcement never diverge. Metric: 0 grade mutations post-seal (invariant); 100% of consequence events traceable to a config version.", "kata": "Kata: honest-scorer (RO-04): “82 is what you earned — I counted it twice and sealed it. Now nobody can move the number, not even me.” · RO-06: absent — and why: staff surface, no mascot — the versioned audit log is the personality here.", "edge": "Edge cases: Teacher wants to fix a miskeyed grade → no edit endpoint exists for anyone; the correction path is a new sealed record with reason + author, shown beside the original · config edited while an exam session is live → the builder is locked; the save queues as the next version · consequence fired while a result is still pending → shown on RO-04 as applied rule + timestamp, and the pending essay can't be edited by the student either · fail notification fails to deliver → the sealed record still stands; delivery retries and the lecturer inbox shows the same table on next login.", "metric": "0 grade mutations post-seal (invariant); 100% of consequence events traceable to a config version.", "chain": "runner auto-submits at 10:41 (RO-02) → server seals the exam record → RO-04 result — 82/100, per-stage per-item table, audit ref EX-2041 → student re-opens weeks later → RO-04 identical — sealed, read-only forever"}, "RP-01": {"name": "Link GitHub", "flow": "JA-P01 · Link GitHub — one-time install honest scope · one-tap revoke", "status": "new", "purpose": "One-time install &amp; scope consent: shows the complete can/cannot list before the student taps install, then a repo picker (private OK) and a revoke line that is always visible, never buried.", "adapt": "permission list and repo picker sit side-by-side; linked state shows a live scope summary.", "states": ["default (unlinked)", "repo picker open", "installing (spinner, ≤30s)", "linked ✓ (scope: n repos)", "revoked → back to default", "error → retry without losing place"], "story": "Mina taps “Link GitHub” braced for the usual OAuth wall of dread. Instead she reads the complete permission list — three cans, one cannot — picks exactly one repo (her private 10x-algo works fine), and sees the revoke promise in plain sight, not buried in settings. Thirty seconds later the badge reads “linked · scope: 1 repo” and the lesson resumes exactly where she left it.", "why": "Students have been burned by “access your whole account” OAuth screens; for a prestige mechanic built on real repos, permission honesty is the feature, not a footnote.", "what": "A one-time install of the college-owned GitHub App, scoped to student-approved repositories only — never the whole account — with private repos fully supported and one-tap revoke that unlinks instantly.", "how": "GitHub App with per-repository permissions: the student picks repos during install and the app physically cannot see anything else; the revoke webhook flips link state in real time. Metric: ≥60% of active P-track students linked within week 1; revoke→unlink completes in &lt;5s.", "kata": "Kata: Pixel the octocat-fox: “Hand me one repo key, not your whole keyring — and take it back whenever you like. I’ll forget you in five seconds flat.”", "edge": "Edge cases: no GitHub account yet → create-account detour, lesson resumes after · installed on the wrong repo → re-picker adds/removes repos, no penalty · org-owned repo with admin restrictions → clear “ask your admin / pick a personal repo” path · revoke while a grade is in flight → that commit still grades and credits, future submits ask to re-link · two students sharing one repo → install is per-user, both can link the same repo · student re-installs after revoke → previous repos remembered, scope re-confirmed aloud.", "metric": "≥60% of active P-track students linked within week 1; revoke→unlink completes in &lt;5s.", "chain": "student taps “Link GitHub” (from RP-02 submit or settings) → RP-01 scope list + repo picker → picks “mina/10x-algo · private ✓” · taps Install → GitHub App install ≤30s (spinner) → RP-01 linked ✓ “scope: 1 repo” → lesson resumes at exact position → next submit commits (JA-P02)"}, "RP-02": {"name": "Code question + editor", "flow": "JA-P02 · Code question — editor, console, submit VS-Code-class editor · WASM console · unlinked never blocked", "status": "new", "purpose": "Solve a real coding question in a real editor: language badge up top, browser console for instant feedback (WASM, zero server risk), and a submit button whose label is the promise — “commits to your repo · authored by you.”", "adapt": "editor and console side-by-side; right rail explains what submit does and shows attempt history.", "states": ["editing (dirty dot)", "console run ✓ / ✗ (stderr inline)", "submitting → queued (sha shown)", "graded toast → RP-03", "resubmit = new sha", "offline (console still runs, submit queues locally)"], "story": "The lesson ends in a code question: “Implement fizzbuzz_ext.” Mina types in a real editor — syntax highlight, autocomplete, a Python 3.12 badge — and taps “Run in browser”: the WASM console prints her output in 184ms, zero server risk. She taps Submit and reads the promise on the button itself: “commits to your repo · authored by you.” Theo, who never linked GitHub, hits the same Submit, gets a soft install sheet, taps “Continue without linking” — and keeps the lesson moving in practice mode: no XP, but no wall.", "why": "Toy playgrounds don’t count for prestige; real code in a real repo does — but the practice loop must stay fast and must never punish the unlinked.", "what": "A code question with a VS-Code-class editor, language badge, and an in-browser console quick check (WebAssembly), then a submit that commits the file into the student’s own repo. Unlinked students get a soft install gate (RP-04) that never blocks the rest of the lesson.", "how": "Monaco editor + WASM runtime for local runs; submit enters the async commit-verify queue, deliberately outside the floor runner; RP-04 shows at most once per session. Metric: ≥70% of code questions reach a submit; median console-run→submit &lt;3 min.", "kata": "Kata: Pixel the octocat-fox: “Write it, run it right here in the browser, then ship it — your name on the commit. No repo yet? Keep walking, the lesson doesn’t stop for paperwork.”", "edge": "Edge cases: WASM unsupported (old browser) → graded server-sandbox fallback, same console UX, flagged honestly · language outside the WASM set → console disabled with tooltip, submit unaffected · paste-bomb &gt;10k lines → hard cap with truncation note · offline at submit → queued locally, commits when back, sha shown after · unlinked student submits repeatedly → RP-04 shows once per session, then silent practice mode · repo renamed or transferred after install → webhook follows, commits keep landing · student edits after submitting → dirty-dot indicator, resubmit creates a new sha (old one still grades once).", "metric": "≥70% of code questions reach a submit; median console-run→submit &lt;3 min.", "chain": "lesson runner reaches code question Q7 → RP-02 editor + WASM console → taps “Run in browser” → console ✓ samples pass (184ms) → taps Submit — linked ✓ → RP-02 submitting → queued (sha a1b2c3d) → graded toast → RP-03 (JA-P03)"}, "RP-04": {"name": "Unlinked gate", "flow": "JA-P02 · Code question — editor, console, submit VS-Code-class editor · WASM console · unlinked never blocked", "status": "new", "purpose": "Soft prompt shown on submit when GitHub isn’t linked: explains exactly what linking buys (commit XP, streak, verified badge) and offers two exits — install now, or continue without linking. The lesson is never blocked; the editor state is preserved either way.", "adapt": "centered sheet/dialog over the still-visible editor; focus returns to editor on dismiss.", "states": ["prompt (once per session)", "install in progress → returns to submit", "skipped (cooled down for the session)", "linked mid-lesson → badge flips, next submit commits"], "story": "The lesson ends in a code question: “Implement fizzbuzz_ext.” Mina types in a real editor — syntax highlight, autocomplete, a Python 3.12 badge — and taps “Run in browser”: the WASM console prints her output in 184ms, zero server risk. She taps Submit and reads the promise on the button itself: “commits to your repo · authored by you.” Theo, who never linked GitHub, hits the same Submit, gets a soft install sheet, taps “Continue without linking” — and keeps the lesson moving in practice mode: no XP, but no wall.", "why": "Toy playgrounds don’t count for prestige; real code in a real repo does — but the practice loop must stay fast and must never punish the unlinked.", "what": "A code question with a VS-Code-class editor, language badge, and an in-browser console quick check (WebAssembly), then a submit that commits the file into the student’s own repo. Unlinked students get a soft install gate (RP-04) that never blocks the rest of the lesson.", "how": "Monaco editor + WASM runtime for local runs; submit enters the async commit-verify queue, deliberately outside the floor runner; RP-04 shows at most once per session. Metric: ≥70% of code questions reach a submit; median console-run→submit &lt;3 min.", "kata": "Kata: Pixel the octocat-fox: “Write it, run it right here in the browser, then ship it — your name on the commit. No repo yet? Keep walking, the lesson doesn’t stop for paperwork.”", "edge": "Edge cases: WASM unsupported (old browser) → graded server-sandbox fallback, same console UX, flagged honestly · language outside the WASM set → console disabled with tooltip, submit unaffected · paste-bomb &gt;10k lines → hard cap with truncation note · offline at submit → queued locally, commits when back, sha shown after · unlinked student submits repeatedly → RP-04 shows once per session, then silent practice mode · repo renamed or transferred after install → webhook follows, commits keep landing · student edits after submitting → dirty-dot indicator, resubmit creates a new sha (old one still grades once).", "metric": "≥70% of code questions reach a submit; median console-run→submit &lt;3 min.", "chain": "lesson runner reaches code question Q7 → RP-02 editor + WASM console → taps “Run in browser” → console ✓ samples pass (184ms) → taps Submit — linked ✓ → RP-02 submitting → queued (sha a1b2c3d) → graded toast → RP-03 (JA-P03)"}, "RP-03": {"name": "Commit status &amp; credit", "flow": "JA-P03 · Commit status &amp; credit received → graded → credited · idempotent · outage-honest", "status": "new", "purpose": "One commit’s full lifecycle, async by design (lives outside the floor runner): received with sha, graded with n/total tests, credited with the exact pass-delta that produced XP and streak. A re-delivered sha shows “already credited · +0”, and outages show a truthful queue state — never a spinner of doom.", "adapt": "lifecycle becomes a horizontal stepper; test-by-test delta table on the right names exactly which flips paid.", "states": ["received / queued", "grading", "graded n/total", "credited (+XP, 🔥, pass-delta)", "already-credited (sha seen → +0)", "grader error → retry, no penalty", "GitHub outage → queued with honest ETA", "notification ‘commit_verified’"], "story": "Minutes after submit, a notification lands: commit_verified. The status screen replays the whole journey — received with sha a1b2c3d, graded 6/6, credited +40 XP and 🔥 13 — and names the payout reason: two tests flipped red→green. Last week, during a GitHub outage, her commit sat honestly labeled “queued — we’ll credit when it’s back” for twenty minutes, then credited on its own. Nothing lost, nothing double-paid, no support ticket.", "why": "Prestige dies if credit feels arbitrary: students must see that real work pays exactly once — never zero, never twice, never for spam pushes.", "what": "An async lifecycle view for each commit — received → graded (n/total tests) → credited (+XP, 🔥 streak, pass-delta) — plus the ‘commit_verified’ notification and an honest queued state during GitHub outages.", "how": "UNIQUE(repo, sha) idempotency key: XP is computed from pass-delta only (red→green flips vs. the student’s prior best), never from push count; outages park jobs in a durable queue with a “we’ll credit when it’s back” state and auto-resume. Metric: 0 idempotency violations (double-credits); p95 received→credited &lt;90s with GitHub healthy.", "kata": "Kata: Pixel the octocat-fox: “Red to green is the only coin I mint. Same commit twice? That coin’s already spent — check the ledger, sha and all.”", "edge": "Edge cases: force-push rewrites history → new sha = genuinely new commit, graded fresh; old sha’s credit stands · webhook retries re-deliver the same sha → UNIQUE key catches it, +0, labeled “already credited” · test harness itself crashes → status “grader error — retrying”, no XP, no penalty, alert to ops · outage &gt;30 min → persistent banner + push notification on resume, queue order preserved · student revokes the app mid-queue → in-flight commit still grades and credits (results already fetched), next submit asks to re-link · XP ledger and commit credit disagree → ledger wins, screen shows both with a “report” link.", "metric": "0 idempotency violations (double-credits); p95 received→credited &lt;90s with GitHub healthy.", "chain": "server: GitHub webhook hears a push to mina/10x-algo (repo-scoped — any device or client) → RP-03 received · sha a1b2c3d · queued for grading → grader finishes 6 hidden tests → RP-03 graded 6/6 · 2 red→green flips → credit engine: pass-delta ×2 → XP ledger → RP-03 credited +40 XP · 🔥 13 → push: ‘commit_verified’ → student opens RP-03"}, "RQ-01": {"name": "Trail composer", "flow": "JA-Q01 · Onboarding-trail composer D-18 · per-program trail · shared policies", "status": "new", "purpose": "Build one program's onboarding trail: pick modules from the shared pool (placement quiz, English level test, archetype via 16personalities connect, verification-for-freezes), drag to order, flag required/optional; any quiz placable in any program's trail.", "adapt": "ordered module list left, selected module's settings + shared quiz pool right, completion-time preview strip.", "states": ["empty trail (publish blocked)", "editing (dirty dot)", "drag-reordering", "module settings open", "publish confirm → version +1", "restored from prior version", "audit drawer open"], "story": "“As a program admin, I assemble my program's onboarding trail from shared building blocks — placement quiz, English level test, archetype via 16personalities connect, verification-for-freezes — order them, mark each required or optional, then apply the same trail policy to the three programs I own after reviewing a diff of exactly what changes in each.”", "why": "Onboarding is where dropout risk is highest; each program needs its own trail, and rebuilding it in code per program guarantees it never gets tuned.", "what": "A composer that orders shared modules into a per-program trail with required/optional flags (RQ-01), plus a policy-sharing screen (RQ-07) that applies one trail/policy to multiple programs with a before-save diff of every affected program and keep/overwrite on conflicts.", "how": "Modules live in a shared pool — any quiz is placable in any program's trail (D-18); trails save as versioned config (audit who/when/what, restore any prior version); apply-to-many renders per-program diffs and stays locked until every listed program is reviewed. Metric: 100% of trail changes ship without a deploy; apply-to-many save blocked until 100% of affected programs reviewed.", "kata": "Kata: absent — and why: staff surface behind roles+permissions, no mascot — warmth lives in the student app, not the console.", "edge": "Edge cases: Module removed while students are mid-trail → current cohort finishes the pinned version, new enrollments get the new trail · a quiz shared by four trails is edited → one versioned quiz, every trail references it and gets a “source changed” notice · policy applied over programs with local overrides → diff flags each conflict, per-program keep/overwrite required before Apply unlocks · admin closes the tab mid-review → nothing saved; apply-to-many has no partial state, one audit entry per program on success only.", "metric": "100% of trail changes ship without a deploy; apply-to-many save blocked until 100% of affected programs reviewed.", "chain": "admin opens RQ-01 for Electrician Y1 → adds “Verification → freezes” from shared pool, drags to #4, flags required → RQ-01 dirty dot · completion preview ≈18 min → taps Publish trail v4 → version +1 live · audit entry (who/when/what) → opens RQ-07 · picks this trail as source · selects 3 programs → RQ-07 per-program diffs · Culinary Y1 conflict → chooses overwrite → 3 of 3 reviewed → Apply → applied ✓ · one audit entry per program"}, "RQ-07": {"name": "Policy sharing &amp; diff", "flow": "JA-Q01 · Onboarding-trail composer D-18 · per-program trail · shared policies", "status": "new", "purpose": "Apply a trail/policy to multiple programs in one action; before saving, shows every program it affects with a per-program diff (added/removed/reordered modules, flag changes) and conflicts against local overrides with per-program keep/overwrite — nothing saves until each program is reviewed.", "adapt": "program checklist left, side-by-side before/after diff right; conflicts highlighted.", "states": ["pick source policy", "programs selected", "per-program diff", "conflict (local override) → keep/overwrite", "all reviewed → apply enabled", "applied ✓ (n programs, one audit entry each)"], "story": "“As a program admin, I assemble my program's onboarding trail from shared building blocks — placement quiz, English level test, archetype via 16personalities connect, verification-for-freezes — order them, mark each required or optional, then apply the same trail policy to the three programs I own after reviewing a diff of exactly what changes in each.”", "why": "Onboarding is where dropout risk is highest; each program needs its own trail, and rebuilding it in code per program guarantees it never gets tuned.", "what": "A composer that orders shared modules into a per-program trail with required/optional flags (RQ-01), plus a policy-sharing screen (RQ-07) that applies one trail/policy to multiple programs with a before-save diff of every affected program and keep/overwrite on conflicts.", "how": "Modules live in a shared pool — any quiz is placable in any program's trail (D-18); trails save as versioned config (audit who/when/what, restore any prior version); apply-to-many renders per-program diffs and stays locked until every listed program is reviewed. Metric: 100% of trail changes ship without a deploy; apply-to-many save blocked until 100% of affected programs reviewed.", "kata": "Kata: absent — and why: staff surface behind roles+permissions, no mascot — warmth lives in the student app, not the console.", "edge": "Edge cases: Module removed while students are mid-trail → current cohort finishes the pinned version, new enrollments get the new trail · a quiz shared by four trails is edited → one versioned quiz, every trail references it and gets a “source changed” notice · policy applied over programs with local overrides → diff flags each conflict, per-program keep/overwrite required before Apply unlocks · admin closes the tab mid-review → nothing saved; apply-to-many has no partial state, one audit entry per program on success only.", "metric": "100% of trail changes ship without a deploy; apply-to-many save blocked until 100% of affected programs reviewed.", "chain": "admin opens RQ-01 for Electrician Y1 → adds “Verification → freezes” from shared pool, drags to #4, flags required → RQ-01 dirty dot · completion preview ≈18 min → taps Publish trail v4 → version +1 live · audit entry (who/when/what) → opens RQ-07 · picks this trail as source · selects 3 programs → RQ-07 per-program diffs · Culinary Y1 conflict → chooses overwrite → 3 of 3 reviewed → Apply → applied ✓ · one audit entry per program"}, "RQ-02": {"name": "Language catalog", "flow": "JA-Q02 · Language catalog D-19 · MVP en + ka · never machine-translate", "status": "built", "purpose": "Enable/disable locales per program (MVP: en + ka visible); per-string override editor on top of the code catalog — admin-edited strings override the catalog, revert restores it; content-language flag on activities (this article is ka); “no machine translation” stated on screen.", "adapt": "string table with filters (missing / overridden / new in code), side-by-side catalog vs override editor, bulk revert.", "states": ["locale list", "override editor open", "overridden (badge, revert)", "missing translation → fallback + queue", "content flag set on activity", "reverted to catalog"], "story": "“As a content admin, I enable Georgian for the Electrician and Welding programs, fix one clumsy string on top of the code catalog (‘Daily quest’ → proper ka wording), and flag Floor 4's reading activity as ka-only content — confident no machine translation will ever silently fill a gap.”", "why": "The school serves Georgian-speaking students from day one; half-localized UI is worse than an honest fallback, and machine-translated learning content is a quality and trust risk we refuse to take.", "what": "Locale enable/disable per program (MVP ships en + ka visible), a per-string override editor layered on the code catalog — admin strings win, revert restores — and a content-language flag on activities.", "how": "Overrides are data, not code edits, so the catalog stays the fallback; a missing ka string renders the en fallback and lands in the human translation queue with an ‘untranslated’ badge in admin — students never see raw keys; no MT integration exists by design, and the screen says so. Metric: 100% of student-facing strings resolve (override, catalog, or declared fallback); 0 machine-translated strings shipped.", "kata": "Kata: absent — and why: staff surface, no mascot — the console speaks in strings and audits, not characters.", "edge": "Edge cases: Override reverted by accident → catalog string returns instantly, audit shows who reverted and when · a code release renames a key → overrides flagged ‘orphaned’ with a mapping prompt, never silently dropped · a program disables ka while students use it → ka-flagged content stays available, UI falls back to en with a notice · someone asks to “just auto-translate” → the screen states the no-machine-translation rule where the button would be.", "metric": "100% of student-facing strings resolve (override, catalog, or declared fallback); 0 machine-translated strings shipped.", "chain": "admin toggles ka = enabled for Electrician + Welding → RQ-02 string table · filter “missing” → 38 ka strings unresolved → opens “Daily quest” · types «ყოველდღიური მისია» · saves → override badge on · catalog kept underneath · audit entry (who/when/what) → flags Floor 4 reading activity as ka-only → activity renders ka content for ka students, hidden from en-only programs"}, "RQ-03": {"name": "Mechanic registry", "flow": "JA-Q03 · Mechanic registry D-22 · shells + rules · feeds the resolver", "status": "new", "purpose": "Register and edit mechanic shells: name/slug, payout shape (fixed pot, linear, curve), integrity constraints (hints? wagers + cap? timer?), device default 📱/💻; shows which floors use which version and what the student resolver currently ranks.", "adapt": "registry table left, rule editor + usage map right, resolver preview strip.", "states": ["registry list", "rule editor open (draft)", "validation error (wager without cap)", "published → resolver updated", "in use by n floors (pinned)", "retired (hidden from builder)"], "story": "“As a game admin, I register a new ‘Drill sprint’ mechanic shell — payout shape: linear XP, hints allowed, no wagers, a 3-minute timer, mobile as the device default — and it becomes available to every floor builder; the student-side ‘activities’ ranking now includes drills without anyone shipping code.”", "why": "Mechanics multiply fast (floors, chips, boss, drill…); without a registry each one becomes a code fork, and the student-side resolver can't rank activities it doesn't know exist.", "what": "A registry of mechanic shells with rules: payout shape, integrity constraints (hints allowed? wagers? timer?), device default. Floors is one mechanic; chips / boss / drill are others; the resolver ranks student-facing ‘activities’ from this list (D-22).", "how": "Each mechanic = shell + rule schema, versioned; integrity constraints are validated at registration (wagers require a cap); live floors pin their mechanic version so mid-season rule edits never retro-change play in flight. Every save is audited and reversible. Metric: new mechanic live in the builder &lt; 1 day from registration; 0 unregistered shells reachable by students.", "kata": "Kata: absent — and why: staff surface, no mascot — rules and payouts are governed here, not performed.", "edge": "Edge cases: Wagers enabled without a cap → validation blocks publish and says why · rule edit mid-season → live floors keep their pinned version, new floors get v2, and a diff is shown before publish · duplicate slug at registration → uniqueness enforced with a suggestion · retiring a shell still used by live floors → blocked until floors migrate or the season ends · device default 📱 set for a mechanic the builder gates 💻 → floor-level device badge overrides the default, and the conflict is surfaced in the editor.", "metric": "new mechanic live in the builder &lt; 1 day from registration; 0 unregistered shells reachable by students.", "chain": "admin taps ＋ Register mechanic → RQ-03 rule editor — slug drill-sprint · payout linear XP · hints ✓ · wagers ✗ · timer 3:00 · device default 📱 → validation passes · taps Publish → shell v1 live in every floor builder · audit entry → student opens roadmap → resolver ranks drills among ‘activities’ (D-22) — no code shipped"}, "RQ-04": {"name": "Notification budgets", "flow": "JA-Q04 · Notification budgets per-category caps · quiet hours · ≤2/day law", "status": "new", "purpose": "Set per-category caps (streak/buddy/quests/school), quiet hours, and priority order; the ≤2/day law is displayed as a fixed constant, never an input; opt-out metric view per category with spike alerts.", "adapt": "budget bars per category, priority-order list, opt-out trend sparkline, law banner pinned.", "states": ["caps editor", "caps sum &gt; law → law-wins notice + priority picker", "quiet hours editor", "saved (audit)", "opt-out metric view", "alert: opt-out spike"], "story": "“As an engagement admin, I set caps per category — streak 1, buddy 1, quests 1, school 1 — inside the hard law of ≤2 notifications per student per day, set quiet hours 21:00–08:00, and watch the opt-out metric to catch fatigue before it becomes churn.”", "why": "Notifications are the easiest way to burn trust; a school product must be provably quiet — one law (≤2/day), visible budgets, and an opt-out metric someone actually looks at.", "what": "Per-category caps (streak / buddy / quests / school), quiet hours, the ≤2/day law shown as a non-editable constant, and an opt-out metric view per category with spike alerts.", "how": "The law value is a constant on screen, not an editable field; when category caps sum above the daily law, the priority order decides and the screen says so; quiet hours are student-local; in-app surfaces are not pushes and don't count against the law; every save is audited and reversible. Metric: ≤2/day holds for 100% of students (monitored); opt-out rate trending down month over month.", "kata": "Kata: absent — and why: staff surface, no mascot — budgets exist precisely so students hear less from us.", "edge": "Edge cases: Admin raises every cap to 99 → daily law still wins, screen shows the effective total (2) next to each cap · quiet hours across timezones → enforced student-local, travel doesn't leak pings · a school-critical notice during quiet hours → only via the explicit ‘critical’ flag, and its use is audited · opt-out spike above threshold → alert card with the offending category and a link to its cap · in-app surfaces (roadmap badges, inbox cards) are not pushes and never consume a budget slot.", "metric": "≤2/day holds for 100% of students (monitored); opt-out rate trending down month over month.", "chain": "admin raises quests cap 1 → 2 → RQ-04 law-wins notice: caps sum 5 &gt; law 2 → priority order decides (streak → buddy) → sets quiet hours 21:00–08:00 · taps Save → budgets v5 live · audit entry (who/when/what) · revert any version → 19:30 next day · streak at risk → student gets 1 streak push — 2nd slot reserved, quests push dropped by priority"}, "RQ-05": {"name": "League &amp; band config", "flow": "JA-Q05 · League &amp; band config band ~30 · zones · contract-only by law", "status": "new", "purpose": "Configure band size (~30), promote/demote counts, season length, quiet-mode default; displays the banding law on-screen (“bands form from the declared contract only — never from surveillance”) and shows surveillance-based banding as a disabled control with the reason.", "adapt": "zone diagram per band, season rollover calendar, law banner pinned on top, disabled control with tooltip.", "states": ["editor", "law banner always visible", "surveillance control disabled (reason shown)", "season preview (rollover date)", "saved → applies next season", "audit view"], "story": "“As a league admin, I configure bands of ~30 students with promote-5 / demote-5 zones, a 4-week season, and quiet mode off by default — and the screen itself carries the law: bands form from the student's declared contract only, so banding by observed activity isn't just hidden, it's a disabled control with the reason printed.”", "why": "Leagues motivate when competition feels fair; banding by surveillance (watch time, clicks) punishes exactly the busy working students this school serves — declared-contract banding is a law, not a preference.", "what": "Band size (~30 with tolerance), promotion/demotion zone counts, season length, quiet-mode default — plus the contract-only banding rule surfaced as an on-screen ⚖ banner with the surveillance option rendered as a disabled-by-law control.", "how": "Bands assign at season start from the declared weekly contract (RQ-08 defaults feed it); a contract change applies next season, never mid-flight; every config change is versioned, audited (who/when/what), and reversible. Metric: 0 bands formed from behavioral data (verified by audit); ≥80% of bands within 29–31 members.", "kata": "Kata: absent — and why: staff surface, no mascot — the fairness law is stated in plain text instead.", "edge": "Edge cases: Cohort smaller than a band (22 active) → partial band allowed, zones scale proportionally and the screen says so · a student raises their declared contract mid-season → applies next season, current band untouched · tie at the zone line → both students take the better outcome, rule documented on screen · holiday week inside a season → optional season pause, decided before the season starts, never retroactively · quiet-mode student → hidden from band view for peers, still graded and still promoted/demoted by the same rules.", "metric": "0 bands formed from behavioral data (verified by audit); ≥80% of bands within 29–31 members.", "chain": "admin opens RQ-05 · sets band ~30 · promote 5 / demote 5 · 4-week season · quiet default off → taps Save → RQ-05 config v3 stored · “applies next season — rollover Sep 29” · audit entry → season starts (server event) → bands form from declared contracts only (RQ-08 defaults) · 29–31 per band → season ends → top 5 promoted · bottom 5 demoted · ties take the better outcome"}, "RQ-06": {"name": "Publishing center", "flow": "JA-Q06 · Publishing center draft → review → published · reviewer ≠ author · notify-me", "status": "new", "purpose": "Lifecycle board for units/floors/activities: draft → review → published with version history, unpublish (keeps history), and a who's-waiting counter (notify-me subscribers) that a publish estore v2 one tap away"}};

window.__HUBINFO = {"hubs": {"0": {"name": "0. Invite", "brief": "Before the student exists in the app, the school creates the account. Accounts are pre-provisioned by the admin (D-14); the student receives the invitation on BOTH channels — SMS and personal email — with a link that drops them straight into first sign-in. Identity = phone number OR personal email; there are no college-issued emails."}, "1": {"name": "1. Auth", "brief": "Access is where trust is won before a single lesson exists. Three invariants govern every screen: no account enumeration (uniform responses), no dead ends (every failure carries exactly one recovery action), and no progress loss (session expiry is non-destructive). Screens already built in Batch 1 are reused; this chapter adds the six it missed."}, "2": {"name": "2. Onboarding", "brief": "Onboarding's only job is a student who leaves with commitments made, not forms filled: a program, a daily goal, a week contract, a calibrated start, and first wins guaranteed. Two atlas notes honored here: RB-00 (Meet Kata) comes from Part M law M5 (the character introduces himself before any form — not an atlas flow, flagged as such), and DS-13 (cohort anchor) is re-homed to Domain G where the atlas places cohort mechanics. Every step persists independently (idempotent upserts), so abandoning never costs anything."}, "3": {"name": "3. Roadmap", "brief": "The roadmap is the student's home: a Candy-crush/Duolingo-style vertical map where every node is a topic wrapped in a mechanic shell. It must answer \"what do I do now?\" in under five seconds — one pulsing current node, one visible next action, stars behind you, locks ahead. Two different \"can't go yet\" semantics (boss-gate lock vs schedule seal), a test-out checkpoint, a boss preview that always shows mercy next to stakes, and an empty-path state that never dead-ends. Home law (D-23): the roadmap IS the home screen — main menu = 🏠 Home · 📋 Assignments · 🗺 Roadmap (center) · 🏆 League · 📅 Events; me, zones explicit, ties published), cooperation without resentment (tiered class quests, absence never subtracts), care without surveillance (buddy first-name-only, mentor wins-only), and safety as structure (community safety policy on the feed chrome, moderation ≤48h, silent unpairs everywhere). Friends are the strongest reason students come back — and the fastest way to break trust if social data leaks. This chapter is privacy-first by construction: a student ever reveals only a first name and program/band; grades, streaks, mistakes, and progress of others are never shared, never ranked, never implied. Adding a friend is deliberate (code, expiring link, or rate-limited first-name search — no directory to browse); unpairing is one tap, silent, and never notifies the other side; nudges are capped at 1/day and count inside the ≤2/day notification budget; friend quests pay both partners or neither, with a per-friend contribution cap so nobody carries; cohort suggestions are offers, never obligations, and a decline is invisible. The pair-flame sheet itself is already specified in RG-05 — this chapter links into it and never re-specifies it."}, "8": {"name": "8. Progression", "brief": "This is where D-21 lives: mistakes are a permanent section — redo, analyze, earn. And where D-20 shows its teeth: gaps are surfaced with their future cost, never quietly forgotten. Boss-gate screens (DS-27…30) stay mapped here as components (the challenge reuses the boss-fight shell); their own flows are checked when cooking R-H. Metrics: mistakes/floor 0.5–1.5 band · clearance ≥60%/wk · due-clearance ≥50%/wk. The wounded-streak synthesis (D-20): a miss never zeroes. Day-close mercy order runs (token → freeze), and if nothing covers, the streak enters wounded — flame dims, decay score ticks, the screen shows what the student is missing and which gaps compound — for up to 3 days. Heal = any floor (micro counts) or a freeze. Unhealed after 3 days → break → repair (E05). Consistency is the uiet hours, the GitHub webhook that verifies commits, the offline outbox sync, exam timers, the anti-cheat workflow-hash monitor, certificate serial minting, and the monotonic timezone check."}}, "sun": {"title": "Start here — the whole journey in 60 seconds", "brief": "Every student begins BEFORE the app: the school pre-provisions the account and the invitation arrives on both SMS and email. One tap → first sign-in (phone OTP or email magic-link) → onboarding makes three commitments (program, daily goal, week contract) → the roadmap becomes home. From there the day splits in two: practice on the game roadmap, and school in the classroom dashboard — assignments, grades, exams, events. League and friends supply the pressure; streaks, quests and the economy supply the pull; exams, certificates and documents supply the proof. Staff build and grade everything you see; the system lane shows the server jobs behind it.", "steps": ["📨 Invite: SMS + email, both channels", "🔐 Auth: phone or email, no passwords", "🌱 Onboarding: program · goal · contract", "🗺 Roadmap: the practice home", "🏫 Classroom: dashboard with calendar/grades/exams inside", "📋 Assignments: hand in, never lose work", "🏆 Social: league + friends", "📈 Progression: streaks, quests, exams", "🎓 Outcomes: certificates, documents, verify"]}};
