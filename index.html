enalty either way → correct → row clears: +8–12⬡ at 2×, strength → 100, SRS interval steps 1·3·7·16·35d. Review wrong → row stays open, interval holds at 1d, kind no-penalty copy.", "how": "Analyze and redo are separate actions — a student may study without risking, and risk when ready. Clearing the last open row queues the D07 chest. Metric: clearance ≥60%/wk.", "kata": "Kata: warm-teacher on analyze: “You picked justify. Of course you did — it says ‘center’ on the tin. Main axis only, friend. Now you own that.”", "edge": "Edge cases: variant also missed → row stays at 1d, second analyze shows both attempts side-by-side · clear during daily cap (Δ3) → coins queue honestly, copy says so · item content updated since the mistake → review runs the new version, old context kept for analysis · analyze without redo is always allowed — study is free, risking is a choice.", "metric": "clearance ≥60%/wk.", "chain": "taps an open row in RD-01 → RD-03 analyze: your answer vs correct side-by-side, trap named, strength 40 → next review 3d → taps “Redo a variant” → RD-02 runner: 4 targeted questions · fresh variant · no new concepts · no penalty → answers Q1…Q4 → correct: row clears +10⬡ (2×) · strength 100 · next review in 3d → last open row cleared → RD-08 chest queued (JA-D07)"}, "RD-02": {"name": "Review runner", "flow": "JA-D02 · Clear a mistake (review) D-21 · analyze → redo", "status": "new", "purpose": "Original-context recap + fresh variant across 4 targeted questions; wrong = kind no-penalty state; clear lands 2× coins + strength 100 visibly.", "adapt": "review runner: centered column max 640px as RC-02.", "states": ["variant presented", "correct (clears, +⬡ ceremony-lite)", "wrong (stays, due tomorrow, kind copy)", "last-open-row (chest queued)"], "story": "“As a student, I want to clear a mistake on a fresh variant — and to study my own wrong answer before I do.”", "why": "Clearing must prove the concept, not the memory of one item: the review runs the original context plus a fresh variant, and D-21's analyze view makes the student's own wrong answer the teacher.", "what": "Inbox → tap row → analyze view (own answer dated, correct beside it, trap named, strength + next-review date) → redo → 4 targeted questions on a fresh variant, no penalty either way → correct → row clears: +8–12⬡ at 2×, strength → 100, SRS interval steps 1·3·7·16·35d. Review wrong → row stays open, interval holds at 1d, kind no-penalty copy.", "how": "Analyze and redo are separate actions — a student may study without risking, and risk when ready. Clearing the last open row queues the D07 chest. Metric: clearance ≥60%/wk.", "kata": "Kata: warm-teacher on analyze: “You picked justify. Of course you did — it says ‘center’ on the tin. Main axis only, friend. Now you own that.”", "edge": "Edge cases: variant also missed → row stays at 1d, second analyze shows both attempts side-by-side · clear during daily cap (Δ3) → coins queue honestly, copy says so · item content updated since the mistake → review runs the new version, old context kept for analysis · analyze without redo is always allowed — study is free, risking is a choice.", "metric": "clearance ≥60%/wk.", "chain": "taps an open row in RD-01 → RD-03 analyze: your answer vs correct side-by-side, trap named, strength 40 → next review 3d → taps “Redo a variant” → RD-02 runner: 4 targeted questions · fresh variant · no new concepts · no penalty → answers Q1…Q4 → correct: row clears +10⬡ (2×) · strength 100 · next review in 3d → last open row cleared → RD-08 chest queued (JA-D07)"}, "RD-04": {"name": "Skills radar", "flow": "JA-D04 · Decay radar sweep (H-02) R5-06 sort · D-20 honesty", "status": "new", "purpose": "Weakest-first list with strength bars, last-practised days, 3×-coins bridge chips, empty-state celebration.", "adapt": "radar list → 3-col card grid desktop; strength bars keep the same 0–100 scale everywhere.", "states": ["populated", "empty (all strong + challenge quest)", "returning-lapse view", "tie-sorted", "offline (cached strengths)"], "story": "“As a student back from two weeks away, I want one honest map of what rusted — weakest first — and zero lectures about the absence.”", "why": "The radar converts vague guilt into an actionable list: skills sorted weakest-first with strength bars and “last practised” labels; tapping one routes into the D03 bridge review. An empty radar is a celebrated terminal state, not a dead page.", "what": "Open radar → skills sorted (strength, then due_on, then last-practised — R5-06) → pick one → 4-question bridge review at 3× coins → pass → strength → 100, radar re-sorts. Empty → “all skills strong” + optional challenge quest.", "how": "Absence is never mentioned — the radar speaks in skill states, not attendance. D-20: decay is shown as recoverable strength numbers, never as threats. Metric: radar→review conversion ≥45%.", "kata": "Kata: absent — this is the student's private cockpit; his only line is on empty: proud “All strong. I checked twice. Choose a challenge, show-off.”", "edge": "Edge cases: empty radar → positive terminal state + challenge quest · tie-break sort documented (R5-06): strength, then due_on, then last-practised · strengths stale (offline week) → “last synced” label, sync on reconnect · returning-lapse view shows the same list — absence is never mentioned, only skill states.", "metric": "radar→review conversion ≥45%.", "chain": "taps “Skills” on Profile (or radar chip on path) → RD-04 radar: weakest-first, bars + last-practised days, 3×⬡ chips → taps the weakest card (flexbox · 40) → RD-02 bridge set: 4 questions · 3×⬡ · no new concepts (JA-D03) → pass: strength 40 → 100, radar re-sorts live"}, "RD-05": {"name": "Challenge card", "flow": "JA-D05 · Prove-it challenge pass (N-02) D-05 · provisional mastery", "status": "new", "purpose": "Stakes declared before a single question: 10Q, ≥8, no hints, one logged attempt, 7-day lock on fail, rewards on pass. Decline with dignity.", "adapt": "mobile sheet → centered dialog max 480px; 7-day lock timer shown in all.", "states": ["offered", "attempted (in progress)", "locked (7d timer visible)", "disabled during active boss"], "story": "“As a student who knows this unit already, I want to challenge the boss directly — 10 questions, no hints — and skip 12 floors with honor.”", "why": "The challenge is the calibrated shortcut: boss-pool items (different from the actual boss, so the gate can't be memorized), ≥8/10, one logged attempt. Pass = floors cleared, +60⚡, unit chest, provisional mastery seeded at 70 — unverified until SRS confirms it (D-05).", "what": "Challenge card on a locked unit → stakes declared (10Q · ≥8 · no hints · 7-day lock on fail) → attempt logged → 10Q boss-pool run → pass → 12 floors cleared, +60⚡, unit chest opens, provisional seeds at 70 → SRS reviews convert provisional → verified. Fail → RD-07 gap routing.", "how": "The honesty contract: provisional means provisional — the radar shows “70 · unverified” until reviews confirm, and decays honestly if they never come. Metric: pass rate 55–75% band (outside = placement or content problem).", "kata": "Kata: hype pre-challenge: “10 questions. No hints. Beat my boss and 12 floors are yours. Honestly? I hope you try.” smug on pass: “Provisional. The reviews will check your homework.”", "edge": "Edge cases: boss items ≠ challenge items (no memorizing the gate) · pass during active boss attempt → blocked, boss first · provisional student stops reviewing → radar shows unverified decay honestly · offline at submit → answers queue (C12), the single logged attempt preserved, submit loss = 0 · decline → card dismissed with dignity, offer returns next session, no push.", "metric": "pass rate 55–75% band (outside = placement or content problem).", "chain": "taps locked Unit 3 → “Challenge the boss” → RD-05 card: stakes declared · 10Q · ≥8 · no hints · 7d lock on fail → taps “Start the challenge” → attempt logged · 10Q boss-pool run (items ≠ actual boss) → submits Q10 → pass 9/10: RD-06 — 12 floors cleared · +60⚡ · unit chest · provisional 70 → later: 2 SRS reviews confirm → radar quietly flips 70 unverified → verified"}, "RD-06": {"name": "Challenge pass", "flow": "JA-D05 · Prove-it challenge pass (N-02) D-05 · provisional mastery", "status": "built", "purpose": "Celebration + floors cleared + unit chest + provisional-mastery honesty (“SRS will verify”).", "adapt": "centered ceremony card max 560px.", "states": ["pass", "provisional seeded", "verified later (quiet radar update)", "unit-unlock state"], "story": "“As a student who knows this unit already, I want to challenge the boss directly — 10 questions, no hints — and skip 12 floors with honor.”", "why": "The challenge is the calibrated shortcut: boss-pool items (different from the actual boss, so the gate can't be memorized), ≥8/10, one logged attempt. Pass = floors cleared, +60⚡, unit chest, provisional mastery seeded at 70 — unverified until SRS confirms it (D-05).", "what": "Challenge card on a locked unit → stakes declared (10Q · ≥8 · no hints · 7-day lock on fail) → attempt logged → 10Q boss-pool run → pass → 12 floors cleared, +60⚡, unit chest opens, provisional seeds at 70 → SRS reviews convert provisional → verified. Fail → RD-07 gap routing.", "how": "The honesty contract: provisional means provisional — the radar shows “70 · unverified” until reviews confirm, and decays honestly if they never come. Metric: pass rate 55–75% band (outside = placement or content problem).", "kata": "Kata: hype pre-challenge: “10 questions. No hints. Beat my boss and 12 floors are yours. Honestly? I hope you try.” smug on pass: “Provisional. The reviews will check your homework.”", "edge": "Edge cases: boss items ≠ challenge items (no memorizing the gate) · pass during active boss attempt → blocked, boss first · provisional student stops reviewing → radar shows unverified decay honestly · offline at submit → answers queue (C12), the single logged attempt preserved, submit loss = 0 · decline → card dismissed with dignity, offer returns next session, no push.", "metric": "pass rate 55–75% band (outside = placement or content problem).", "chain": "taps locked Unit 3 → “Challenge the boss” → RD-05 card: stakes declared · 10Q · ≥8 · no hints · 7d lock on fail → taps “Start the challenge” → attempt logged · 10Q boss-pool run (items ≠ actual boss) → submits Q10 → pass 9/10: RD-06 — 12 floors cleared · +60⚡ · unit chest · provisional 70 → later: 2 SRS reviews confirm → radar quietly flips 70 unverified → verified"}, "RD-07": {"name": "Gap routing", "flow": "JA-D06 · Prove-it fail → gap routing D-20 · N-05 bridge", "status": "new", "purpose": "Exact-gap card: failed skills with calibration honesty, floors re-lit with your variant, 7-day unlock timer, bridge-armed note. Primary = first lit floor.", "adapt": "gap card full-width mobile → 2-col grid desktop with bridge route preview inline.", "states": ["single gap", "multi gap (stacked, weakest first)", "lock timer running", "bridge armed", "floors already done (alternate route offered)"], "story": "“As a student who just failed the challenge, I want the exact gap, not the score — and my path to quietly light up around it.”", "why": "Fail is a routing event, not a verdict: “not yet — here's the exact gap”, the floors teaching it re-lit on the path, confidence-calibration pairs logged (said 90%, scored 40% → radar weights), N-05 bridge armed for when those skills become dependencies. Nothing recorded against them.", "what": "Fail → gap card per failed skill (weakest first) → floors re-lit on the path with the student's own variant → re-challenge locked 7 days with a visible unlock timer (anti-brute-force, locked ≠ sealed — the timer is actionable) → normal floor progress still unlocks the boss as usual.", "how": "D-20 in action: the fail shows what skipping this gap will cost later (“when this becomes a dependency — your moment fires”), making avoidance a visible choice. Metric: fail→floor-start within 48h ≥50%.", "kata": "Kata: warm-teacher: “Not yet. Grid-areas, specifically — you said 90%, the boss said 40%. Floor 7 fixes it. I lit it up for you.”", "edge": "Edge cases: re-challenge locked → unlock timer visible, no nag, locked ≠ sealed · floors completed normally still unlock the boss as usual · student ignores lit floors → resolver keeps them ranked, zero extra notifications (≤2 pushes/day budget) · multi-gap fails stack weakest-first so the first tap is always the highest-leverage one.", "metric": "fail→floor-start within 48h ≥50%.", "chain": "challenge scored &lt;8/10 (RD-05 run) → RD-07 gap routing: exact skill + calibration honesty (“said 90%, scored 40%”) → system: Floor 7 re-lit on path with your variant · N-05 bridge armed · 7-day timer starts → taps “Start Floor 7” → floor run (RC-02) — normal progress still unlocks the boss"}, "RD-08": {"name": "Inbox-zero chest", "flow": "JA-D07 · Inbox zero → chest (H-21) ceremony · monthly badge", "status": "new", "purpose": "Ceremony: mind-blown Kata, +30⬡ chest, next-review dates, monthly zero-day badge, terminal copy. Variant of the DS-36 chest component.", "adapt": "centered ceremony max 480px.", "states": ["zero achieved", "zero-day badge (monthly)", "same-day new mistake (celebrated anyway)", "offline zero (queued ceremony)"], "story": "“As a student who cleared every mistake, I want the app to make a moment of it — because inbox zero is rarer than a floor pass.”", "why": "Inbox zero is the review economy's championship: a chest ceremony (+30⬡), next reviews scheduled visibly, positive terminal copy — and the day counts toward the monthly zero-day challenge.", "what": "Last open mistake clears in RD-02 → zero detected → ceremony queued → RD-08: +30⬡ chest + SRS schedule shown (“I wrote the dates down”) + terminal copy → zero-day badge +1 counted to the monthly challenge.", "how": "The ceremony survives irony: a new mistake arriving the same day doesn't revoke the celebration — it was true when earned. Metric: inbox-zero rate ≥25% of actives/wk.", "kata": "Kata: mind-blown: “Zero. ZERO. I have run this courtyard for years and — fine, I'm proud. Next reviews: Thursday. I wrote it down.”", "edge": "Edge cases: new mistake same day → zero state celebrated anyway, badge kept · chest during daily cap (Δ3) → honest capped copy, badge still counts · offline zero → ceremony queued for reconnect, date preserved · zero with zero lifetime mistakes (new account) → no ceremony, the state only fires on a clear.", "metric": "inbox-zero rate ≥25% of actives/wk.", "chain": "last open mistake cleared in RD-02 (JA-D02) → server: inbox open-count = 0 → ceremony queued → RD-08 chest: +30⬡ · SRS dates shown · terminal copy → zero-day badge +1 → monthly challenge 3/20 → taps “Back to the mountain” → RC-01 path — RD-01 inbox now reads the positive terminal state"}, "RE-03": {"name": "Day-close card", "flow": "JA-E01 · Streak day secured", "status": "built", "purpose": "Secured confirmation + day ledger + quest tick; offline = sync-pending variant, never a false secured.", "adapt": "mobile card → centered dialog max 480px desktop; secured checklist identical.", "states": ["secured", "micro-secured (noted honestly)", "sync pending", "milestone day (7/30/50/100/365 tier)"], "story": "“As a student, I want the app to close my day with a clear 'done' — so tomorrow starts from zero pressure, not leftover doubt.”", "why": "The day-close is the daily contract's signature moment: streak_secured(day) written server-side, flame +1 (season-day display, D-08), society tier checks at 7/30/50/100/365. The secured state must be unmissable and unambiguous — ambiguity is where streak anxiety lives, and a false \"secured\" would be the product's single biggest lie.", "what": "First floor of the day completes → server validates streak_secured → HUD flame +1 → RE-03 day-close card: secured checklist (floor, quest tick, tokens unspent) → tier check at milestones. Micro-floor counts fully (C11) and says so. Offline shows “sync pending” honestly until C12 resolves — never claims secured unvalidated.", "how": "Card appears once per day, dismissible, no confetti debt on ordinary days. Metric: contract-day floor rate ≥70% of actives.", "kata": "Kata: proud at milestones only: “30 days. I counted every one. You showed up.” Ordinary days: silence (scarcity law).", "edge": "Edge cases: milestone lands on micro-day → celebrated anyway (counts fully) · offline secured → sync-pending badge until server validates (C12) · two devices same day → idempotent day-write, no double count.", "metric": "contract-day floor rate ≥70% of actives.", "chain": "student answers last question of floor 13 · pass ≥8/10 → RC-11 floor summary (+96⚡, XP cap check ≤300/day) → server: streak_secured(day) write validates (C12) → HUD flame +1 → RE-03 day-close card (secured checklist) → user taps “Close the day” → RC-01 home · tomorrow starts clean"}, "RE-02": {"name": "Save-push (lock screen)", "flow": "JA-E02 · At-risk → save notification → saved", "status": "built", "purpose": "Kata begging + honest token mention + fastest-floor deep link. One per day, budget priority 1.", "adapt": "lock-screen push is OS-level (identical); desktop web-push = centered permission dialog.", "states": ["at-risk contract day", "tokens owned (mentioned)", "zero tokens (clean ask)", "after 20:00 (micro link)", "free day (never fires)"], "story": "“As a student at 23:38 who forgot today, I want one honest nudge that respects my tokens — not five screaming notifications.”", "why": "The save-push is priority 1 in the Δ4 budget ladder — the single notification the product is allowed to spend on a streak, inside the ≤2 pushes/day law. Its honesty: tokens owned are named in the copy (“2 tokens cover you anyway”), so the nudge informs rather than panics. Silence stays a setting, not a fight.", "what": "Personal boundary −20 min, contract day, no floor yet, save still possible → save-notify fires → deep-link into the fastest floor (micro after 20:00) → floor completes → streak saved, token NOT spent.", "how": "Free days never fire save-notify (contract is contract). No action by boundary → day-close mercy order takes over silently (JA-E03). Metric: save rate ≥25%.", "kata": "Kata: begging: “23:38. Your streak is 12. A 2-minute floor saves it — and your 2 tokens cover you anyway. Your move.”", "edge": "Edge cases: notification permission denied → in-app at-risk card instead, never email-spam · student saves at 23:59 → boundary-aware day-claim (C12/R9-02) · do-not-disturb hours → silent delivery, in-app card carries it.", "metric": "save rate ≥25%.", "chain": "time event: personal boundary −20 min (23:38) · contract day · no floor logged → RE-02 save-push fires (priority 1 · 1st of ≤2 pushes today) → user taps push → deep link → fastest floor (micro floor after 20:00, 2 min) → floor completes ≥8/10 → streak saved → RE-03 day-close card · token NOT spent"}, "RE-01": {"name": "Streak sheet — contract &amp; protections", "flow": "JA-E03 · Token auto-cover (L-10) · JA-E04 freeze consume", "status": "built", "purpose": "The streak&rsquo;s home: contract status, protections owned (freezes, tokens), and a quiet ledger row per cover — token spent or freeze consumed, each with the day it covered. Wounded state lives here too (D-20). No modals, ever.", "adapt": "rail + content: protections 2-up mobile → 4-up row desktop; ledger becomes table (date, cover, balance).", "states": ["contract active", "token spent (silent)", "freeze consumed", "multiple days covered", "wounded begins (nothing left — D-20)", "wounded day 1–3 (decay visible)", "healed", "empty (no covers yet, positive framing)"], "story": "“As a student whose Tuesday exploded, I want my safety nets to work silently at midnight — not a 23:58 modal asking me to make a decision.”", "why": "The mercy order is the anti-anxiety engine, and it runs at the server, not in a dialog: token available → spent silently, streak held, no modal; no token → owned freeze consumes (day marked covered, not growing). Reason codes logged uniformly (no floor · token · freeze · break) so metrics stay comparable (D-07). No modals, ever — the student learns what happened from a quiet ledger row, not an interruption.", "what": "Day-close at personal boundary: contract day, no floor → token_spent silently (streak held) → else freeze_consumed (day covered) → else wounded state (D-20), not instant break. Next open: RE-01 shows the cover as a quiet ledger row — date, cover type, balance after — no guilt copy.", "how": "Multiple missed days consume multiple freezes if owned (max 2 owned per shop rule); tokens are monthly (3/mo, pro-rata); token spends before freeze (renewable before purchasable). Metrics: token coverage ≥65% of misses · freeze attach rate tracked.", "kata": "Kata: smug on the quiet wallet row: “Covered your Tuesday. Token spent. You owe me a floor, not an apology.”", "edge": "Edge cases: no token, no freeze → wounded (E05 path via D-20), reason code “no floor” · token and freeze both owned → token spends first (renewable before purchasable) · cover during pause → impossible (pause pre-empts, E07).", "metric": "", "chain": "time event: day-close at personal boundary · contract day · no floor → server mercy order: token owned? → yes → token_spent silently · streak held · ledger row written → student opens app next morning → RE-01 quiet ledger row: “Jul 21 · covered by token 🪙 · 1 left” — no modal, no guilt copy"}, "RE-04": {"name": "Wounded streak", "flow": "JA-E05 · Wounded → break → paid repair D-20 synthesis", "status": "new", "purpose": "Dimmed flame, decay meter, what-you're-missing rows (league, medal, gap compounding), auto tip, day-counter 1–3, heal CTAs (floor / freeze).", "adapt": "home state: rail + wounded banner spans grid; decay meter same width as contract bar.", "states": ["wounded day 1", "day 2 (decay deeper)", "day 3 (final warning, kind)", "healed (restored ceremony-lite)", "freeze heal"], "story": "“As a student who let it slip, I want the cost of leaving to be visible every day — and one dignified way back when I'm ready.”", "why": "D-20's core: a miss never zeroes the streak. Miss with nothing left → wounded (3 days): flame dims, decay score ticks down daily, and the screen shows exactly what they're missing — league places, medal math, compounding skill gaps — plus one auto tip. Heal = any floor or any freeze. Unhealed after 3 days → break: honest number, no shame copy, two repair paths (free win-back 1/30d, or −100⬡ ledger-visible).", "what": "Wounded day 1–3 → RE-04 home state (dimmed flame + decay meter + missing-cost rows + tip + day counter + heal CTAs) → unhealed → streak_broken → RE-05 break sheet: free win-back if eligible, else −100⬡ repair — both flagged in the ledger, never hidden → declined → number rests on profile; season framing (D-08) means no HUD reset-trauma.", "how": "Repair is a transaction with integrity: flagged in the ledger, counted in metrics (repair uptake 15–30% band — higher = cover too cheap, lower = framing review). Break older than 7 days → win-back only (JA-E06).", "kata": "Kata: worried wounded day 1: “12 days of work — wounded. Not gone. Heal it before it breaks.” begging day 3: “Tomorrow this is a break. Tonight it's a 2-minute floor.” disappointed on decline: “Resting. The number stays. So do I.”", "edge": "Edge cases: heal on wounded day 3 at 23:59 → boundary-aware claim · repair during daily cap (Δ3) → repair is a spend, not an earn — cap doesn't block it · second break in 30d → paid only, copy never accusatory.", "metric": "", "chain": "server: contract day missed · no token · no freeze (mercy order exhausted, JA-E03) → RE-04 wounded day 1: 💔🔥 dimmed · decay 1/3 · missing-cost rows · heal CTAs → user completes any floor (or spends a freeze) → RE-04 healed state → RE-03 day-close · streak restored, flame relit → server: 3rd day-close unhealed → streak_broken → RE-05 break sheet: free win-back (1/30d) or repair −100⬡ ledger-visible"}, "RE-0 dempotent replay on sync conflict → no duplicate medals · season boundary mid-wounded → wounded state carries into new season honestly.", "metric": "", "chain": "time event: season day 30 day-close completes → server: season_rollups row → medal mint (UNIQUE student-season, idempotent) → RE-08 season ceremony: 🥈 21/30 · lifetime 52 kept · league re-banded · fresh 0/30 → user taps “Season 3 →” → RC-01 home: 0/30 counter · season-3 config (recomputed) · streak 12 carries on"}, "RE-09": {"name": "Contract preview", "flow": "JA-E09 · Contract change with preview · + quests tab", "status": "new", "purpose": "Old vs new side-by-side for the next 7 days, apply-forward note, token delta shown. Downgrade path identical in dignity.", "adapt": "settings form as RE-07; tier options 3-up cards desktop.", "states": ["upgrade", "downgrade (never nudged)", "mid-week (old evaluates)", "sandbag-cap note at season"], "story": "“As a student whose schedule changed, I want to see exactly how my next week looks under the new contract before I sign — and to never be punished for choosing fewer days.”", "why": "Contract edits are apply-forward with a preview (R7-03): next 7 days under old vs new, side-by-side, token delta shown, history preserved, and mid-week changes evaluate the current week on the old contract. Downgrade is never nudged against (law 6) — respect is retention; the downgrade path is identical in dignity to the upgrade path.", "what": "Edit contract → RE-09 preview sheet (old vs new, next 7 days, applies next week) → confirm → apply-forward → band re-match at next season (L-07 sandbag cap). RE-10 quests tab (re-homed DS-15): contract-aware daily/weekly quests with progress + reward chips — free days show bonus quests, not obligations.", "how": "Preview is mandatory before confirm; no dark patterns either direction. Metric: change→next-week adherence ≥65%.", "kata": "Kata: absent on downgrade (respect is silent); on upgrade: smug “Four days. Bold. I'll hold you to it — I wro ither direction. Metric: change→next-week adherence ≥65%.", "kata": "Kata: absent on downgrade (respect is silent); on upgrade: smug “Four days. Bold. I'll hold you to it — I wrote it down.”", "edge": "Edge cases: mid-week change → current week old contract, stated plainly · sandbag downgrade before season end → cap applies at re-match, copy honest · token delta on change → pro-rata shown.", "metric": "change→next-week adherence ≥65%.", "chain": "user taps Profile → “Adjust contract” → user picks 3 days/wk (from 5) → RE-09 preview: old M·W·F·S·S vs new M·W·F · token delta · “applies Monday · this week on old terms” → user taps “Preview looks right — apply” → server: apply-forward write (history preserved) · current week still evaluates old → RE-10 quests re-target to 3-day contract from Monday · free days flip to bonus framing"}, "RF-01": {"name": "XP ledger · capped", "flow": "JA-F01 · Earn XP → daily cap (Δ3) engaged", "status": "new", "purpose": "Daily total against the 300⚡ cap with per-source rows; approaching and capped states explained in copy — streak/mastery still count, league freezes for fairness.", "adapt": "rail/side-nav page; ledger becomes a table (source · XP · when); cap card sits beside the total on desktop.", "states": ["accumulating", "approaching (≥90%)", "capped (summary state)", "league-frozen note", "empty day (0⚡, positive framing)"], "story": "“As a grinder, I want the cap explained before I hit it — so a capped day never feels like the app ate my work.”", "why": "The cap keeps the league a fair race (Δ3). Its real risk is betrayal, not balance: a student who earns past an invisible wall learns the economy lies. The card answers “what still counts?” in the same breath as the number.", "what": "A profile-level XP ledger: running daily total against the 300⚡ cap, per-source rows with timestamps, and the approaching / capped / empty-day states written in plain language — including the same-day league freeze.", "how": "Ledger accumulates per XP int lives on the quests tab (RE-10), never on this card.", "how": "quest_progress ticks live on RE-10 and the path card; the server’s third tick fires coins_awarded and opens this card; dismissal archives the set read-only. Partial sets at day-close expire quietly — no loss framing anywhere, no push. Metric: set completion ≥35% of contract days.", "kata": "Kata: proud: “All three. That’s a real day — the coins are just the receipt.”", "edge": "Edge cases: free day → no set generated (the bonus floor still ticks the weekly challenge) · two quests done at 23:59 → expires quietly, no guilt copy, no “failed” row · replaying a completed set → archived state, read-only, no double payout.", "metric": "set completion ≥35% of contract days.", "chain": "user secures streak — 3rd quest ticks (server: quest_progress 3/3) → RE-10 quests tab · set chip flips complete → server fires coins_awarded +20⬡ → RF-02 set-complete ceremony → user taps “Nice · log it” → set archives to quest log on RE-10 (read-only)"}, "RF-03": {"name": "Chest open · rarity", "flow": "JA-F03 · Chest earn → open (S-12) all", "status": "new", "purpose": "The reveal: rarity chip, full contents, roll-honesty copy, public odds link, duplicate rule. One ceremony, all chest types (boss · inbox-zero · monthly · quest chain).", "adapt": "centered dialog over context on all factors; contents 2-up on desktop.", "states": ["opening (roll anim ≤1.5s, skippable)", "rare ✦", "epic ✦✦", "common", "duplicate→coins conversion", "claim → inventory"], "story": "“As a student, I want the chest to be honest magic — rarity I can verify, contents I can see, no rigged moment.”", "why": "Chests are the economy’s surprise engine, and surprise only works on trust. The rules: roll at open (server-side, never at earn), odds bands public (D-10), uniques never duplicate. Break any of these and every future chest is suspect.", "what": "One ceremony for all chest types (boss · inbox-zero · monthly · quest chain): rarity chip, full contents list, the roll-honesty line, the public odds link, and the duplicate-conversion rule on the same screen. Variant of RD-08 (inbox-zero chest).", "how": "Tap → server rolls rarity at open → contents revealed with the odds link; the roll animation (≤1.5s, skippable) is cosmetic — the result is already decided. Duplicate cosmetics auto-convert to coins with the conversion shown. Metric: chest→next-day return +6pts vs baseline.", "kata": "Kata: showman-honest: “The roll just happened — watch. Rare! And the odds are printed if you ever doubt me.”", "edge": "Edge cases: earned offline → open queues until connection (chest waits, no expiry pressure) · duplicate cosmetic → auto-coins with the conversion shown · roll animation is cosmetic — the result is already decided server-side, so skipping never changes the outcome.", "metric": "chest→next-day return +6pts vs baseline.", "chain": "user taps “Open chest” on RC-11 (boss beaten) → RF-03 opening anim ≤1.5s · skippable → server rolls rarity at open — never at earn → RF-03 reveal: rarity chip + contents + odds link (D-10) → user taps Claim → inventory + wallet updated · chest logged"}, "RF-04": {"name": "Shop &amp; wallet", "flow": "JA-F04 · Shop purchase (S-15) all", "status": "built", "purpose": "Wallet + shelves with rules printed on the shelf: freeze cap, boost limit, cosmetic-only tags, and the unbuyable-rank law as a permanent row.", "adapt": "rail/side-nav; shelves 2-col tablet → 3-col desktop; wallet banner spans full width.", "states": ["browsing", "sufficient", "item maxed (freeze cap chip)", "boost owned today (greyed)", "empty wallet (positive framing, earn paths)"], "story": "“As a student, I want the shop to feel like a fair market stall — real prices, my balance after, and rules printed where I can see them.”", "why": "The shop is where the economy’s honesty is tested daily. Every dark pattern we refuse lives here: no hidden caps, no stacking boosts, no rank for sale. So the law sits on the shelf, not in a policy page.", "what": "Wallet header, shelves (protections / fun), per-item rules printed on the shelf (freeze 40⬡ cap 2, boost 60⬡ 1/day no stacking, sprite 80⬡ cosmetic-only), and the unbuyable-rank law as a permanent visible row. Confirm sheet shows item, price, wallet-after.", "how": "Buy → confirm sheet (RF-05) → server commit under an idempotency key → inventory updates, ledger writes one line. Metric: shop conversion 10–25% of weekly actives (economy health, not revenue).", "kata": "Kata: shopkeeper: “Prices are prices, caps are caps, and your rank? Not in my till. Look around.”", "edge": "Edge cases: double-tap Confirm → idempotency key holds, one ledger line always · balance drops below price mid-sheet (second device) → commit fails clean, RF-06 opens with the real gap · no XP→coin conversion exists to offer, by law.", "metric": "shop conversion 10–25% of weekly actives (economy health, not revenue).", "chain": "user taps Buy · XP boost ×2 (60⬡) on RF-04 → RF-05 confirm sheet: price −60⬡ · wallet-after 245 → 185⬡ → user taps Confirm → server commits under idempotency key → success: inventory +1 boost · wallet 185⬡ · one ledger line"}, "RF-05": {"name": "Purchase confirm", "flow": "JA-F04 · Shop purchase (S-15) all", "status": "built", "purpose": "Sheet: item, price, wallet-after — the three numbers that make a purchase honest. Double-tap safe (idempotency key), no countdown pressure.", "adapt": "mobile sheet → centered dialog on tablet/desktop; wallet-after line is the hero number.", "states": ["open", "confirming (idempotency held)", "success → inventory", "insufficient → RF-06", "cancelled"], "story": "“As a student, I want the shop to feel like a fair market stall — real prices, my balance after, and rules printed where I can see them.”", "why": "The shop is where the economy’s honesty is tested daily. Every dark pattern we refuse lives here: no hidden caps, no stacking boosts, no rank for sale. So the law sits on the shelf, not in a policy page.", "what": "Wallet header, shelves (protections / fun), per-item rules printed on the shelf (freeze 40⬡ cap 2, boost 60⬡ 1/day no stacking, sprite 80⬡ cosmetic-only), and the unbuyable-rank law as a permanent visible row. Confirm sheet shows item, price, wallet-after.", "how": "Buy → confirm sheet (RF-05) → server commit under an idempotency key → inventory updates, ledger writes one line. Metric: shop conversion 10–25% of weekly actives (economy health, not revenue).", "kata": "Kata: shopkeeper: “Prices are prices, caps are caps, and your rank? Not in my till. Look around.”", "edge": "Edge cases: double-tap Confirm → idempotency key holds, one ledger line always · balance drops below price mid-sheet (second device) → commit fails clean, RF-06 opens with the real gap · no XP→coin conversion exists to offer, by law.", "metric": "shop conversion 10–25% of weekly actives (economy health, not revenue).", "chain": "user taps Buy · XP boost ×2 (60⬡) on RF-04 → RF-05 confirm sheet: price −60⬡ · wallet-after 245 → 185⬡ → user taps Confirm → server commits under idempotency key → success: inventory +1 boost · wallet 185⬡ · one ledger line"}, "RF-06": {"name": "Insufficient coins", "flow": "JA-F05 · Insufficient coins → earn path all", "status": "new", "purpose": "Gap number first, then the fastest legitimate earn paths as deep links — sorted by time-to-coins, routed to real work, never to a top-up (there is none).", "adapt": "mobile sheet → centered dialog; earn-path rows identical across factors.", "states": ["gap shown", "1 path available", "2+ paths", "path completed → return with balance", "law row always present"], "story": "“As a broke student, I want ‘not enough’ to point me at work I already have — not at a wallet I don’t.”", "why": "The insufficient moment is where economies either respect students or exploit them. We route to the fastest legitimate earn path (mistakes, quests) as a deep link — never to a grind loop, never to a purchase. There is no top-up to offer, by law.", "what": "A sheet on the shop: the gap number first, one primary earn path deep-linked, a secondary path, and the unbuyable-rank law restated where temptation lives.", "how": "Confirm without balance → server rejects with the real gap → sheet lists fastest paths sorted by time-to-coins (R4-03); a tap routes straight into the mistakes inbox (RD-01) or quests tab (RE-10); return lands on RF-05 with the updated balance. Metric: insufficient→earn follow ≥30%.", "kata": "Kata: shopkeeper: “Can’t sell you a shortcut — there isn’t one. But your inbox? That’s money waiting.”", "edge": "Edge cases: zero earn paths available (inbox zero, quests done) → say so honestly, point at tomorrow’s set — never a top-up · path followed but still short → sheet returns with the updated gap · coins credited while the sheet is open → gap recomputes before any routing.", "metric": "insufficient→earn follow ≥30%.", "chain": "user confirms freeze at 22⬡ (costs 40⬡) → server rejects: insufficient · gap 18⬡ → RF-06 sheet: gap first · paths sorted by time-to-coins → user taps “Clear 2 mistakes → +16⬡” → RD-01 mistakes inbox (deep link) → mistakes cleared, coins land → return to RF-05 with updated balance"}, "RF-07": {"name": "Month-close karma", "flow": "JA-F06 · Token karma payout (L-10) monthly", "status": "new", "purpose": "Month-close card inside the wallet: tokens saved → karma, grant refresh, and the wallet log showing both earn and spend rows without spin.", "adapt": "rail/side-nav; karma card + log table side-by-side on desktop.", "states": ["month-close payout", "0 tokens saved (no shade — neutral copy)", "grant refreshed", "mid-month (log only)"], "story": "“As a saver, I want restraint to pay — so hoarding tokens feels as smart as spending them.”", "why": "Life tokens protect streaks (L-10); if only spending pays, students burn protection for points. Karma makes saving a scored strategy and feeds the economy monitor’s source/sink ratio (R4-02).", "what": "A month-close beat inside the wallet: leftover tokens convert to +10⬡ each, the grant refreshes per schedule, and the wallet log shows both sides of the month — earn rows and spend rows — without spin.", "how": "Month-close job (server, 1st of month 00:00) writes token_karma(count) and refreshes the grant; the wallet log renders both as first-class rows. Metric: save-vs-spend distribution tracked — observation only, no target.", "kata": "Kata: honest-accountant: “Two tokens unspent — that’s discipline, and discipline pays. +20.”", "edge": "Edge cases: 0 tokens left → no karma row and no guilt copy (spending was also valid) · month-close while paused → karma waits, writes and logs on return · karma is coins — same ledger, same caps, same honesty.", "metric": "save-vs-spend distribution tracked — observation only, no target.", "chain": "month-close job runs (server · Aug 1, 00:00) → token_karma(2) written → +20⬡ coins → RF-07 month-close card in wallet → grant refreshes: 3 tokens for August (schedule) → wallet log: karma row + refresh row beside earn/spend history"}, "RF-08": {"name": "Monthly challenge", "flow": "JA-F07 · Monthly challenge (H-10) opt-in", "status": "new", "purpose": "Opt-in month goal: progress bar with band-adjusted target, complete/near-miss rewards stated up front, and the “never badged as missed” row as a design element, not fine print.", "adapt": "quest surface: card spans grid on desktop with reward rows beside; tablet stacked card.", "states": ["not joined (join CTA)", "in progress", "mid-month join (pro-rated note)", "complete (+200⬡ + badge)", "near-miss ≥80% (consolation)", "skipped month (no trace)"], "story": "“As a student, I want a big optional mountain once a month — with the prize, the consolation, and the exit all stated before I climb.”", "why": "The monthly challenge is the economy’s long note: a month-sized goal that respects different contracts (band-adjusted targets) and different temperaments (never badged as missed). Opt-in honesty is what makes opt-in meaningful.", "what": "A challenge card on the quests surface: target with live progress, the band-adjusted note, complete (+200⬡ + badge) and near-miss (≥80% → consolation) rewards stated up front, pro-rated for mid-month joins.", "how": "1st of month: challenge live; joining sets the target from the declared contract band; floors tick progress across the month; month-end settles complete / near-miss / quiet archive. Metric: completion 25–45% band is the health signal.", "kata": "Kata: mountaineer: “Twenty-four floors, your pace counted fairly. Climb or don’t — the mountain holds no grudge.”", "edge": "Edge cases: joins Aug 15 → target pro-rates with the note shown on the card · contract change mid-month → band re-computed and shown, no silent shift · 0 floors by month-end → quietly archives, no “failed” language · Parallel Workers band → proportional target stated on the card.", "metric": "completion 25–45% band is the health signal.", "chain": "1st of month, 00:00 (server) → challenge live → RF-08 card on RE-10 quests surface · not joined, Join CTA → user taps “Join the challenge” → RF-08 in progress · band-adjusted target 24 floors → month-end settles (server) → complete: +200⬡ + badge"}, "RG-01": {"name": "Band assignment", "flow": "JA-G01 · League join with band (L-07) week-1 end · opt-out", "status": "new", "purpose": "One-time league onboarding: 30-student cohort, band label, zones explicit with headcounts, honest band-source line, quiet-lane opt-out without guilt copy.", "adapt": "rail/side-nav league surface; zone rows 3-up on desktop; opt-out route never secondary-styled.", "states": ["assigned (shown once)", "zones expanded", "quiet-mode chosen", "quiet-mode active (league hidden, no shade)"], "story": "“As a new league student, I want to see exactly who I’m racing and why the race is fair — and a dignified exit if racing isn’t my game.”", "why": "The league only works if the race feels fair on day one. The band comes from the declared time budget (contract × goal), all three zones are stated before the first race, and the quiet lane is offered once — with zero “missing out” nudges.", "what": "A one-time band-assignment card: 30-student cohort, band label, the three zones explicit with headcounts, the declared-not-surveillance line, and a quiet-lane opt-out styled as an equal-dignity route.", "how": "Week-1 boundary after ~5 active days → band computed from the declared budget → card shown once; quiet mode = no placement, no league surface, no reminders. Metric: band fairness p90/p10 ≤3.5× (L3.1).", "kata": "Kata: fair-referee: “Thirty of you, same hours a week, same rules. Racing not your thing? The quiet lane is a choice, not a failure.”", "edge": "Edge cases: Contract changes later → re-band at next season boundary (stated) · quiet-mode student later joins → band computed then · band fairness metric drifts → config review, not silent re-shuffle.", "metric": "band fairness p90/p10 ≤3.5× (L3.1).", "chain": "Sun 24:00 · week-1 closes (5 active days) → server: band = declared 5h/wk contract × goal → RG-01 band card, shown once: “Evening band · ≤5h/wk · 30 students” → student taps a zone row → RG-01 zones expanded: 🟢 top 7 · 🟡 8–25 · 🔴 bottom 5 → taps “Join the race” → RG-02 standings, you pinned at 0⚡"}, "RG-02": {"name": "League standings", "flow": "JA-G02 · Weekly race → promotion → podium (H-13) league students", "status": "built", "purpose": "Live race view: band + week + deadline, you pinned with zone, gap quantified (“25⚡ to #2”), fairness rules published on the screen.", "adapt": "standings = table on desktop with zone column + gap card beside; tablet table; you-row pinned both.", "states": ["live updating", "you in promotion zone", "safe middle", "demotion zone (kind, no flame)", "week closed (snapshot)", "capped-XP week note (F01)"], "story": "“As a league student, I want the race readable at a glance and Monday to feel like a medal — my gap as a number, the rules in the open, the ceremony honest.”", "why": "Standings are the heartbeat, podium the payoff. Live XP updates, a gap quantified as a CTA, tie and cap rules published on the screen, and a Monday ceremony whose tier label carries the band — promotion never pretends you beat the world.", "what": "Two screens: standings (band + week + Sunday 24:00 deadline, you pinned with zone, “25⚡ to #2” gap CTA, fairness rules printed) and the Monday podium (top-3 visual, +120⬡ + 🧊, band-labeled tier, kind card for places 4–7).", "how": "Every XP write updates standings live; Sunday 24:00 (personal-boundary aware) snapshot; top 7 promote Monday → per-band ceremony; ties → earlier-to-that-XP wins; capped weeks hit all equally. Metric: podium view ≥70% · promoted D7 +12pts.", "kata": "Kata: medal-marshal: “Third place, Evening band, twenty-five XP from silver — that number is a door, not a verdict. See you at the next tier.”", "edge": "Edge cases: Tie at the promotion cutoff → earlier-to-that-XP wins, rule printed on the standings · capped-XP week (F01) → noted on screen, applies to all 30 equally · student in quiet mode → no standings, no ceremony, by design.", "metric": "podium view ≥70% · promoted D7 +12pts.", "chain": "student clears a floor (+40⚡ write) → RG-02 standings update live · you pinned #3 🟢 → taps “25⚡ to #2” gap CTA → floor runner (RC-04) → XP applied to the race → Sun 24:00 snapshot (personal-boundary aware) → Mon 09:00 · ceremony opens → RG-03 podium: promoted · +120⬡ + 🧊 · tier carries band"}, "RG-03": {"name": "Monday podium", "flow": "JA-G02 · Weekly race → promotion → podium (H-13) league students", "status": "built", "purpose": "Per-band ceremony: podium top-3 (you placed), reward drop (+120⬡ + 🧊), new tier with band label, one CTA.", "adapt": "centered card on tablet; desktop dialog over league; podium visual identical.", "states": ["promoted (podium)", "promoted places 4–7 (kind card, same rewards)", "not promoted (standings, no ceremony)", "first season (explainer chip)"], "story": "“As a league student, I tes": ["first demotion", "repeated (tip rotates, tone preset by age band)", "3rd repeat (quiet-lane offer)", "accepted quiet lane"], "story": "“As a demoted student, I want the fall to cost me nothing but pride — and to get one useful tip, not a guilt trip.”", "why": "Demotion is where leagues lose people. The law: the tier moves, wallet and mastery never do. One concrete tip mined from the student’s own week turns the moment from verdict into coaching.", "what": "A kind card at week close: tier-move line, untouched-assets line (streak, coins, mastery), one data-derived tip, retry framing — and after a 3rd repeat, a judgment-free quiet-lane offer.", "how": "Sunday 24:00 snapshot bottom 5 → demotion applies to tier only, Monday 09:00 → card shows the own-pattern tip; 3 consecutive repeats → quiet-mode offer without judgment. Metric: demoted-student W2 retention ≥70%.", "kata": "Kata: soft-coach: “The tier moved, you didn’t lose a thing. Look — your own weeks are telling us when you actually show up.”", "edge": "Edge cases: Gen Z band → slightly more competitive copy (tone preset, same facts) · tip has no data yet (new student) → generic-but-honest “contract days are the lever” · quiet-lane accepted → league hidden, zero shade.", "metric": "demoted-student W2 retention ≥70%.", "chain": "Sun 24:00 snapshot → you finish #27 of 30 (bottom 5) → Mon 09:00 · tier moves Evening → Weekend band → RG-04 soft-landing card: assets untouched + one own-data tip → taps “Plan my comeback week” → RG-02 standings, new tier, you at 0⚡ · week starts clean"}, "RG-05": {"name": "Friend pair sheet", "flow": "JA-G04 · Friend streak pair opt-in", "status": "new", "purpose": "Shared-flame contract in one sheet: both sides, shared +5⚡, 1-day grace, 1/day nudge, one-tap silent unpair. All rules visible before commitment.", "adapt": "mobile sheet → tablet sheet → desktop dialog; rule rows identical across factors.", "states": ["invited (accept/decline)", "paired", "grace day in use", "nudge sent (1/day cap)", "unpaired (silent)", "farming-flagged (nudges muted pending review)"], "story": "“As a student, I want a shared flame with my friend — small stakes, one kind nudge a day, and a clean exit.”", "why": "Pairs convert accountability into affection. The design limits are the point: +5⚡ shared and nothing more, one-day grace, one nudge per day inside the notification budget, and unpairing that never notifies — exits without social debt.", "what": "A pair sheet: both avatars + shared flame, the shared-XP rule, the grace rule, the nudge rule, and the silent-unpair line — all visible before anyone commits. The invite flow lives on the same sheet.", "how": "Invite → pair on accept; both complete → +5⚡ each; one misses → 1-day grace; nudge = priority 3 in the Δ4 ladder (counts in the ≤2/day push budget); pair-farming detection flags mutual nudges without floors. Metric: paired W4 retention +10pts vs solo.", "kata": "Kata: warm-matchmaker: “One flame, two people, five XP a day. And if it ever stops being fun — one tap, and no one has to know.”", "edge": "Edge cases: Friend never accepts → invite expires quietly in 7d · both miss same day → grace consumed, no double penalty · farming flag → nudges muted, review queue, no public accusation.", "metric": "paired W4 retention +10pts vs solo.", "chain": "student taps “Invite a friend” on RG-05 → RG-05 invite link sent to Ana T. (expires in 7d) → Ana accepts → RG-05 paired: shared flame lit, rules shown once → both clear today’s floors → RG-05 +5⚡ each · flame grows"}, "RG-06": {"name": "Buddy card", "flow": "JA-G05 · Buddy pair &amp; nudge (N-03) assigned", "status": "new", "purpose": "The mutual-notice card: assigned buddy, daily status, 2-day-miss check-in with kind templates, privacy limits (first name only), safety rails visible.", "adapt": "card on home surface; desktop 2-pane with nudge column; recipient view = separate state, same card.", "states": ["buddy active", "buddy missed 2 days (nudge prompt)", "nudge sent", "buddy inactive (re-pair pending)", "unpaired after report (no detail shown)"], "story": "“As a student, I want one person who notices when I vanish — kindly, privately, without knowing my grades.”", "why": "The buddy is the second-chancer’s safety net. Assigned, not chosen (no popularity contest); the nudge triggers on absence, never on failure; the recipient sees a first name and a status, never a metric.", "what": "Two screens: the buddy card (assigned buddy, today’s status, the 2-day-miss kindness check-in, safety rails) and the day-one cohort anchor (your 12, your named buddy, first quest teaser, feed rules).", "how": "Cohort formed week 1 → buddies assigned (late-joiners from the late pool); either misses 2 contract days → nudge card (priority 2 in Δ4); buddy inactive 14d → silent re-pair; harassment report → instant unpair + moderation (G07). Metric: nudge→return ≥40%.", "kata": "Kata: quiet-keeper: “Dato’s been away two days. Not a lecture — just knock. People come back to people who knock softly.”", "edge": "Edge cases: Both buddies miss simultaneously → nudges fire both ways, no spam stacking · recipient never sees buddy’s scores/streaks · late-joiner → paired from late-join pool within 48h.", "metric": "nudge→return ≥40%.", "chain": "week 1 · cohort formed (12 students) → RG-14 anchor shown once: cohort, named buddy, quest teaser, feed rules → server assigns buddy (same timezone ±2h) → RG-06 buddy card on Home: “Dato · active today ✓”"}, "RG-14": {"name": "Cohort anchor", "flow": "JA-G05 · Buddy pair &amp; nudge (N-03) assigned", "status": "built", "purpose": "The day-one social landing: your 12-person cohort, your named buddy, the first class quest teaser, and the feed rules — belonging before competition.", "adapt": "centered card on all factors; rules row always present.", "states": ["formed (shown once, day one)", "buddy pending ≤48h", "quest teaser", "returning (card archived)"], "story": "“As a student, I want one person who notices when I vanish — kindly, privately, without knowing my grades.”", "why": "The buddy is the second-chancer’s safety net. Assigned, not chosen (no popularity contest); the nudge triggers on absence, never on failure; the recipient sees a first name and a status, never a metric.", "what": "Two screens: the buddy card (assigned buddy, today’s status, the 2-day-miss kindness check-in, safety rails) and the day-one cohort anchor (your 12, your named buddy, first quest teaser, feed rules).", "how": "Cohort formed week 1 → buddies assigned (late-joiners from the late pool); either misses 2 contract days → nudge card (priority 2 in Δ4); buddy inactive 14d → silent re-pair; harassment report → instant unpair + moderation (G07). Metric: nudge→return ≥40%.", "kata": "Kata: quiet-keeper: “Dato’s been away two days. Not a lecture — just knock. People come back to people who knock softly.”", "edge": "Edge cases: Both buddies miss simultaneously → nudges fire both ways, no spam stacking · recipient never sees buddy’s scores/streaks · late-joiner → paired from late-join pool within 48h.", "metric": "nudge→return ≥40%.", "chain": "week 1 · cohort formed (12 students) → RG-14 anchor shown once: cohort, named buddy, quest teaser, feed rules → server assigns buddy (same timezone ±2h) → RG-06 buddy card on Home: “Dato · active today ✓”"}, "RG-07": {"name": "Class quest card", "flow": "JA-G06 · Class quest (N-03) cohort", "status": "new", "purpose": "Cooperative goal with live cohort progress, tier ladder (25/35/50⬡), your-part state, and fairness lines (no subtraction, no naming the missing).", "adapt": "quest surface card; tier rows 3-up on desktop; progress + your-part always pinned.", "states": ["in progress", "your part done ✓", "tier reached (feed auto-post)", "closed paid", "closed unpaid (no loss copy)"], "story": "“As a cohort member, I want a shared goal where my part matters — and where a classmate’s absence never taxes me.”", "why": "Cooperative quests build the cohort without building resentment. Tiered payouts kill the all-or-nothing collapse; absence never subtracts; the feed celebrates contributors and never names the missing.", "what": "A quest card on the quests surface: cohort goal, live 9/12 progress, your part ticked, the 8/10/12 tier ladder explicit, and the two fairness lines printed on the card.", "how": "Week-1 quest live; each completion updates progress for all 12; Sunday close pays by tier reached; the feed auto-posts the tier celebrating contributors (opt-out respected). Metric: tier ≥8/12 in ≥80% of cohorts.", "kata": "Kata: team-captain: “Nine of twelve and climbing. Your brick is laid — every tier pays, nobody’s absence empties your pocket.”", "edge": "Edge cases: Cohort below 12 members → tiers scale proportionally, stated · quest ends mid-floor for someone → their completion counts to the tier honestly · repeat quest weeks → variant goal, same fairness rules.", "metric": "tier ≥8/12 in ≥80% of cohorts.", "chain": "Mon 09:00 · week quest goes live → RG-07 quest card: “12 floors this week”, 0/12, tiers 8/10/12 → you clear your floor → RG-07 your part ✓ · progress 9/12 live for the whole cohort → 10th completion lands Wed 18:42 → tier 10/12 locked · RG-08 feed auto-post celebrates contributors by first name → Sun 24:00 close → RG-07 closed paid: +35⬡ to every contributor"}, "RG-08": {"name": "Cohort feed", "flow": "JA-G07 · Cohort feed · post, react, report cohort", "status": "built", "purpose": "The class space: community-safety banner pinned, auto-posted wins with opt-out, lecturer question, reactions, and report affordance with moderation rules on the chrome.", "adapt": "feed = single column max 680 centered on desktop; policy banner pinned top on all factors.", "states": ["browsing", "posted", "reacted", "reported (pending)", "auto-hidden (2 reports)", "moderated (action logged)", "auto-post opt-out"], "story": "“As a student, I want a class space that feels alive and safe — wins celebrated, my name minimal, and a report button
