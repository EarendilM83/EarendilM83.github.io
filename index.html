<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

*{box-sizing:border-box;margin:0}

#top{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(7,11,24,.88);backdrop-filter:blur(8px);padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.07)}

.fchip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#C7D2F2;border-radius:999px;padding:3px 10px;font:700 10px ui-rounded;cursor:pointer}

#drawer .closex{position:sticky;top:0;float:right;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;width:28px;height:28px;font-weight:900;cursor:pointer;z-index:2}

</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><b>🪐 10x LMS — Neural Journey Map</b>
<span class="hint">drag pan · wheel zoom · <b>hover a moon for its screen</b> · click moon = trace flow · click planet = fly in</span>
<input id="search" placeholder="find screen / step…">
<button id="edgetog">🕸 edges: auto</button>
<button class="fchip on" data-f="all">all</button><button class="fchip" data-f="student">student</button><button class="fchip" data-f="staff">staff</button><button class="fchip" data-f="system">system</button><button class="fchip" data-f="built">✓ built</button><button class="fchip" data-f="new">✦ new</button>
<span class="lg"><span><span class="dot" style="background:#12B76A"></span>built</span><span><span class="dot" style="background:#fff"></span>new</span><span><span class="dot" style="background:#F2C661"></span>state</span><span><span class="dot" style="background:#64748B"></span>system</span></span>
</div>
<div id="phasejump"></div>
<div id="tip"></div>
<div id="drawer"><div class="inner" id="drawerin"></div></div>
<div id="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit">⤢</button></div>
<canvas id="minimap" width="150" height="110"></canvas>
<script>// ===== 10x Neural Journey Map — canvas engine =====
const PHASES = ['Invite','Auth','Onboarding','Roadmap','Classroom','Assignments','Events','Social & League','Progression','Outcomes'];
const PCOLORS = ['#F59E0B','#EF4444','#10B981','#3B82F6','#06B6D4','#84CC16','#F97316','#EC4899','#8B5CF6','#14B8A6'];
const STAFF_C='#A78BFA', SYS_C='#64748B';

function hubColor(h){ return h<10?PCOLORS[h]:h===10?STAFF_C:SYS_C; }
function hubName(h){ return h<10?(h+'. '+PHASES[h]):h===10?'Staff · Lecturer & Admin':'System · server events'; }

function boot(DATA, SHOTS){
const cv = document.getElementById('cv');
const ctx2d = cv.getContext('2d');
const tip = document.getElementById('tip');
const DPR = Math.min(2, window.devicePixelRatio||1);

// ---------- static data ----------
const L = window.__LAYOUT; // {pos:{id:[x,y]}, hubs:{h:[x,y,r]}}
const nodes = DATA.nodes.map(n=>{
  const h = n.lane==='staff'?10:n.lane==='system'?11:n.phase;
  const p = L.pos[n.id]||[0,0];
  const sqi = n.screen ? (window.__SEQ[n.screen]!==undefined ? window.__SEQ[n.screen] : 9999) : (n.status==='state'? -1 : 9999);
  return {...n, h, x:p[0], y:p[1], dx:p[0], dy:p[1], tx:p[0], ty:p[1], sqi,
    c: hubColor(h),
    ph: Math.random()*Math.PI*2,
    label: n.title.length>24?n.title.slice(0,23)+'…':n.title };
});
const nodeById = {}; nodes.forEach(n=>nodeById[n.id]=n);
const hubs = Object.entries(L.hubs).map(([h,v])=>({id:+h,x:v[0],y:v[1],r:v[2],c:hubColor(+h),name:hubName(+h)}));
const hubById = {}; hubs.forEach(h=>hubById[h.id]=h);

const edges = DATA.edges.map((e,i)=>{
  const a=nodeById[e.from], b=nodeById[e.to]; if(!a||!b) return null;
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
  const len=Math.hypot(dx,dy)||1;
  const sign = (i%2?1:-1);
  const bulge = Math.min(60,len*0.14)*sign;
  const cx=mx-dy/len*bulge, cy=my+dx/len*bulge;
  return {a,b,cx,cy,label:e.label||'',c:hubColor(a.h),
    parts:[{t:Math.random(),s:0.00045+Math.random()*0.00035},
           {t:Math.random(),s:0.00045+Math.random()*0.00035}]};
}).filter(Boolean);

// starfield
const stars=[]; for(let i=0;i<420;i++) stars.push({x:(Math.random()-0.5)*4200, y:(Math.random()-0.5)*4200, r:Math.random()*1.4+0.3, p:Math.random()*6.28});

// adjacency for trace
const adj={}, radj={};
DATA.edges.forEach(e=>{ (adj[e.from]=adj[e.from]||[]).push(e.to); (radj[e.to]=radj[e.to]||[]).push(e.from); });
const reach=(s,map)=>{ const seen=new Set([s]),q=[s]; while(q.length){const c=q.pop();(map[c]||[]).forEach(n=>{if(!seen.has(n)){seen.add(n);q.push(n);}});} return seen; };

// ---------- camera ----------
let cam={x:0,y:0,s:0.34}, camTo={...cam}, anim=null;
function flyTo(x,y,s,dur=750,scrX,scrY){
  const Wpx=innerWidth, Hpx=innerHeight;
  const cx = scrX!==undefined ? x - (scrX - Wpx/2)/s : x;
  const cy = scrY!==undefined ? y - (scrY - Hpx/2)/s : y;
  anim={t0:performance.now(),dur,from:{...cam},to:{x:cx,y:cy,s}};
}
function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

let W=0,H=0;
function resize(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; }
addEventListener('resize',resize); resize();

// world<->screen
const sx=x=>(x-cam.x)*cam.s+W/2, sy=y=>(y-cam.y)*cam.s+H/2;

// ---------- state ----------
let hoverNode=null, hoverHub=null, traced=null, keepSet=null, focusHub=null, filter='all', edgeMode='auto';
let pipeMode=false;
function layoutPipeline(){
  const seqOf = id => nodeById[id] ? nodeById[id].sqi : 9999;
  // ---- backward: canonical decreasing predecessors ----
  const back=[traced]; let cur=traced, guard=0;
  while(guard++<30){
    const preds=(radj[cur]||[]).map(id=>({id,s:seqOf(id)})).filter(o=>o.s<seqOf(cur));
    if(!preds.length) break;
    preds.sort((a,b)=>b.s-a.s);
    const nx=preds[0].id;
    if(back.includes(nx)) break;
    back.unshift(nx); cur=nx; }
  // ---- forward: canonical increasing successors ----
  const chain=back.slice(); cur=traced;
  const visited=new Set(chain); guard=0;
  while(guard++<30){
    const outs=(adj[cur]||[]).map(id=>({id,s:seqOf(id)})).filter(o=>o.s>seqOf(cur) && !visited.has(o.id));
    if(!outs.length) break;
    outs.sort((a,b)=>a.s-b.s);
    cur=outs[0].id; chain.push(cur); visited.add(cur); }
// ---- stubs: direct neighbors of chain nodes ----
  const chainSet=new Set(chain);
  const stubs={};
  chain.forEach(cid=>{
    const nb=[...(adj[cid]||[]),...(radj[cid]||[])].filter(x=>!chainSet.has(x));
    const uniq=[...new Set(nb)].slice(0,4);
    if(uniq.length) stubs[cid]=uniq;
  });
  // ---- layout: chain in one row, stubs hung below ----
  const PY=-1650;
  chain.forEach((cid,i)=>{ const n=nodeById[cid]; n.tx=i*215; n.ty=PY; });
  Object.entries(stubs).forEach(([cid,arr])=>{
    const ci=chain.indexOf(cid);
    arr.slice(0,4).forEach((x,k)=>{ const n=nodeById[x];
      n.tx=ci*215+(k%2?1:-1)*40;
      n.ty=PY+(k%2?1:-1)*(74+Math.floor(k/2)*42); });
  });
  window.__pipeIdx={}; chain.forEach((cid,i)=>window.__pipeIdx[cid]=i+1);
  stubSet=new Set(Object.values(stubs).flat());
  keepSet=new Set([...chain, ...stubSet]);
  window.__pipeEdges=new Set();
  for(let i=0;i<chain.length-1;i++) window.__pipeEdges.add(chain[i]+'>'+chain[i+1]);
  Object.entries(stubs).forEach(([cid,arr])=>arr.forEach(x=>{ window.__pipeEdges.add(cid+'>'+x); window.__pipeEdges.add(x+'>'+cid); }));
  const pw=(chain.length-1)*215, ph=130;
  const availW=innerWidth-540, availH=innerHeight-220;
  const fit=Math.min(availW/Math.max(pw+260,1), availH/300);
  const s=Math.min(1.2, Math.max(0.4, fit));
  const drawerOpen = drawer.classList.contains('open');
  const scrX = drawerOpen ? (innerWidth-460)/2 : innerWidth/2;
  flyTo(pw/2, -1650+30, s, 750, scrX, innerHeight/2-30);
  pipeMode=true;
}
function clearPipeline(){ nodes.forEach(n=>{ n.tx=n.x; n.ty=n.y; }); pipeMode=false; window.__pipeEdges=null; }
let stubSet=new Set();
const dimmed=n=>{
  if(filter!=='all' && !(n.lane===filter||n.status===filter||(filter==='system'&&n.h===11))) return true;
  if(keepSet) return !keepSet.has(n.id);
  return false;
};

// ---------- screenshot cache ----------
const IMG={};
function shotImg(screen){
  if(!screen || !SHOTS[screen]) return null;
  if(IMG[screen]) return IMG[screen];
  const im=new Image(); im.src=SHOTS[screen]; IMG[screen]=im; return im;
}

// ---------- render ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last); last=now;
  if(anim){ const t=Math.min(1,(now-anim.t0)/anim.dur), k=ease(t);
    cam.x=anim.from.x+(anim.to.x-anim.from.x)*k;
    cam.y=anim.from.y+(anim.to.y-anim.from.y)*k;
    cam.s=anim.from.s+(anim.to.s-anim.from.s)*k;
    if(t>=1) anim=null; }
  ctx2d.setTransform(DPR,0,0,DPR,0,0);
  // bg
  const g=ctx2d.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'#0D1430'); g.addColorStop(1,'#070B18');
  ctx2d.fillStyle=g; ctx2d.fillRect(0,0,W,H);
  // stars
  for(const s of stars){ const X=sx(s.x),Y=sy(s.y);
    if(X<-10||Y<-10||X>W+10||Y>H+10) continue;
    ctx2d.globalAlpha=0.25+0.2*Math.sin(now*0.001+s.p);
    ctx2d.fillStyle='#BFD0FF'; ctx2d.beginPath(); ctx2d.arc(X,Y,s.r*Math.max(0.6,cam.s*1.2),0,6.283); ctx2d.fill(); }
  ctx2d.globalAlpha=1;

  const t=now;
  const zoomed=cam.s>0.85;
  const showEdges = edgeMode==='on' || (edgeMode==='auto' && (zoomed||hoverNode||traced));

  // ---- animate node display positions ----
  const lerpK = 1-Math.pow(0.88, dt/16);
  for(const n of nodes){ n.dx+=(n.tx-n.dx)*lerpK; n.dy+=(n.ty-n.dy)*lerpK; }
  // ---- edges ----
  if(showEdges){
    for(const e of edges){
      if(pipeMode && window.__pipeEdges && !window.__pipeEdges.has(e.a.id+'>'+e.b.id)) continue;
      const inTrace = keepSet && keepSet.has(e.a.id) && keepSet.has(e.b.id);
      const near = hoverNode && (e.a===hoverNode||e.b===hoverNode);
      let alpha = 0.16;
      if(traced) alpha = inTrace?0.9:0.03;
      else if(hoverNode) alpha = near?0.95:0.05;
      let x1=sx(e.a.dx),y1=sy(e.a.dy),x2=sx(e.b.dx),y2=sy(e.b.dy),cx=sx(e.cx),cy=sy(e.cy);
      if(pipeMode && inTrace){
        // circuit-board elbow for the traced pipeline (offset by card size)
        const cw=Math.min(260,Math.max(56,84*cam.s)), ch=cw*1.9;
        const oA=window.__pipeIdx&&window.__pipeIdx[e.a.id]!==undefined?cw/2:8;
        const oB=window.__pipeIdx&&window.__pipeIdx[e.b.id]!==undefined?cw/2:8;
        const ex1=x1+oA, ex2=x2-oB, emx=(ex1+ex2)/2;
        const isChainEdge = window.__pipeIdx[e.a.id]!==undefined && window.__pipeIdx[e.b.id]!==undefined;
        ctx2d.strokeStyle=e.c; ctx2d.globalAlpha=isChainEdge?Math.min(1,alpha):alpha*0.35; ctx2d.lineWidth=isChainEdge?2:1;
        ctx2d.beginPath(); ctx2d.moveTo(x1,y1);
        ctx2d.bezierCurveTo(ex1+18,y1, emx-18,y2, emx,y2);
        ctx2d.lineTo(x2,y2); ctx2d.stroke();
        if(e.label){ ctx2d.globalAlpha=1; ctx2d.fillStyle='#C7D2F2';
          ctx2d.font='700 9px ui-rounded,system-ui'; ctx2d.textAlign='center';
          ctx2d.fillText(e.label.slice(0,30), emx, (y1+y2)/2-5); }
        continue;
      }
      if((x1<-80&&x2<-80)||(x1>W+80&&x2>W+80)||(y1<-80&&y2<-80)||(y1>H+80&&y2>H+80)) continue;
      ctx2d.strokeStyle=e.c; ctx2d.globalAlpha=alpha; ctx2d.lineWidth=near||inTrace?1.8:1;
      ctx2d.beginPath(); ctx2d.moveTo(x1,y1); ctx2d.quadraticCurveTo(cx,cy,x2,y2); ctx2d.stroke();
      // particles
      if(alpha>0.4){
        for(const p of e.parts){ p.t=(p.t+p.s*dt)%1;
          const u=1-p.t, px=u*u*e.a.dx+2*u*p.t*e.cx+p.t*p.t*e.b.dx, py=u*u*e.a.dy+2*u*p.t*e.cy+p.t*p.t*e.b.dy;
          ctx2d.globalAlpha=alpha*0.95; ctx2d.fillStyle='#fff';
          ctx2d.beginPath(); ctx2d.arc(sx(px),sy(py),Math.max(1.3,1.9*cam.s),0,6.283); ctx2d.fill(); }
      }
      // labels when close
      if(cam.s>1.15 && alpha>0.4 && e.label){
        ctx2d.globalAlpha=Math.min(1,alpha+0.15); ctx2d.fillStyle='#A9B4D8';
        ctx2d.font=`700 ${9}px ui-rounded,system-ui`; ctx2d.textAlign='center';
        ctx2d.fillText(e.label.slice(0,34), cx, cy-4); }
    }
    ctx2d.globalAlpha=1;
  }

  // ---- orbit rings ----
  for(const h of hubs){
    ctx2d.strokeStyle=h.c; ctx2d.globalAlpha=0.1; ctx2d.setLineDash([4,7]);
    ctx2d.beginPath(); ctx2d.arc(sx(h.x),sy(h.y),h.r*cam.s,0,6.283); ctx2d.stroke(); ctx2d.setLineDash([]); }
  ctx2d.globalAlpha=1;

  // ---- sun ----
  const SX=sx(0),SY=sy(0);
  const sr=42*Math.max(0.7,cam.s);
  const sg=ctx2d.createRadialGradient(SX-sr*0.3,SY-sr*0.3,sr*0.1,SX,SY,sr*2.6);
  sg.addColorStop(0,'rgba(255,220,140,.95)'); sg.addColorStop(0.28,'rgba(245,158,11,.55)'); sg.addColorStop(1,'rgba(245,158,11,0)');
  ctx2d.fillStyle=sg; ctx2d.beginPath(); ctx2d.arc(SX,SY,sr*2.6,0,6.283); ctx2d.fill();
  const sg2=ctx2d.createRadialGradient(SX-sr*0.35,SY-sr*0.35,sr*0.05,SX,SY,sr);
  sg2.addColorStop(0,'#FFE9B8'); sg2.addColorStop(0.6,'#F59E0B'); sg2.addColorStop(1,'#B45309');
  ctx2d.fillStyle=sg2; ctx2d.beginPath(); ctx2d.arc(SX,SY,sr,0,6.283); ctx2d.fill();
  ctx2d.fillStyle='#2A1A00'; ctx2d.font=`900 ${Math.max(10,12*cam.s+4)}px ui-rounded,system-ui`; ctx2d.textAlign='center'; ctx2d.textBaseline='middle';
  if(true){ ctx2d.fillText('10x LMS',SX,SY-4); ctx2d.font=`700 ${Math.max(7,8*cam.s+2)}px ui-rounded,system-ui`; ctx2d.fillText('start: the invitation',SX,SY+Math.max(10,12*cam.s)); }

  if(pipeMode){ ctx2d.globalAlpha=0.06; }
  // ---- planets ----
  for(const h of hubs){
    const X=sx(h.x),Y=sy(h.y);
    if(X<-200||Y<-200||X>W+200||Y>H+200) continue;
    const pr=Math.max(14,Math.min(30,h.r*0.14))*Math.max(0.6,Math.min(1.6,cam.s));
    const gg=ctx2d.createRadialGradient(X-pr*0.3,Y-pr*0.3,pr*0.1,X,Y,pr*2.4);
    gg.addColorStop(0,h.c+'CC'); gg.addColorStop(0.4,h.c+'44'); gg.addColorStop(1,h.c+'00');
    ctx2d.fillStyle=gg; ctx2d.beginPath(); ctx2d.arc(X,Y,pr*2.4,0,6.283); ctx2d.fill();
    const gg2=ctx2d.createRadialGradient(X-pr*0.35,Y-pr*0.35,pr*0.08,X,Y,pr);
    gg2.addColorStop(0,'#ffffff'); gg2.addColorStop(0.25,h.c); gg2.addColorStop(1,'#0B1020');
    ctx2d.fillStyle=gg2; ctx2d.beginPath(); ctx2d.arc(X,Y,pr,0,6.283); ctx2d.fill();
  }
  // hub labels on top of moons
  for(const h of hubs){
    const X=sx(h.x),Y=sy(h.y);
    if(X<-200||Y<-200||X>W+200||Y>H+200) continue;
    const pr=Math.max(14,Math.min(30,h.r*0.14))*Math.max(0.6,Math.min(1.6,cam.s));
    ctx2d.textAlign='center'; ctx2d.textBaseline='top';
    ctx2d.font=`900 ${Math.max(9,10*Math.min(1.4,cam.s)+2)}px ui-rounded,system-ui`;
    const ly=Y+pr+4;
    ctx2d.fillStyle='rgba(6,10,24,.8)'; ctx2d.fillText(h.name,X+1,ly+1);
    ctx2d.fillStyle=hoverHub===h?'#fff':'#EAF0FF';
    ctx2d.fillText(h.name,X,ly);
    const cnt = nodes.reduce((s,n)=>s+(n.h===h.id?1:0),0);
    ctx2d.font=`700 ${Math.max(7,8*cam.s+1)}px ui-rounded,system-ui`; ctx2d.fillStyle='#9FB0DD';
    ctx2d.fillText(cnt+' steps',X,ly+Math.max(11,11*Math.min(1.4,cam.s)+2));
  }

  if(pipeMode) ctx2d.globalAlpha=1;
  // ---- moons ----
  const labelZoom = cam.s>0.7 || pipeMode;
  for(const n of nodes){
    const wob = pipeMode?0:1;
    const fx=n.dx+Math.sin(t*0.00045+n.ph)*3.2*wob, fy=n.dy+Math.cos(t*0.00038+n.ph)*3.2*wob;
    const X=sx(fx),Y=sy(fy);
    if(X<-40||Y<-40||X>W+40||Y>H+40) continue;
    const dim=dimmed(n);
    const sel = traced===n.id;
    const isStub = pipeMode && stubSet.has(n.id);
    const isCard = pipeMode && window.__pipeIdx && window.__pipeIdx[n.id]!==undefined;
    if(isCard) { /* always rendered as filmstrip card below */ }
    else {
    const r=(sel?2.1:1)*(isStub?0.62:1)*Math.max(2.1,4.4*Math.min(2.2,cam.s));
    const emph = sel || hoverNode===n || (keepSet&&keepSet.has(n.id));
    ctx2d.globalAlpha = dim?0.07:(isStub?0.45:1);
    // pulsing beacon for the selected node — visible at any zoom
    if(sel){
      const pulse=(t*0.0011)%1;
      ctx2d.strokeStyle=n.c; ctx2d.globalAlpha=(1-pulse)*0.85;
      ctx2d.lineWidth=Math.max(1.5,2.5*cam.s);
      ctx2d.beginPath(); ctx2d.arc(X,Y,r+4+pulse*26*Math.max(0.7,cam.s),0,6.283); ctx2d.stroke();
      ctx2d.globalAlpha=0.35;
      ctx2d.beginPath(); ctx2d.arc(X,Y,r+6,0,6.283); ctx2d.stroke();
      ctx2d.globalAlpha=1;
    }
    if(emph){ ctx2d.shadowColor=sel?'#ffffff':n.c; ctx2d.shadowBlur=sel?26:14; }
    ctx2d.fillStyle=n.c;
    ctx2d.beginPath(); ctx2d.arc(X,Y,r,0,6.283); ctx2d.fill();
    ctx2d.shadowBlur=0;
    if(sel){ ctx2d.fillStyle='rgba(255,255,255,.92)';
      ctx2d.beginPath(); ctx2d.arc(X,Y,r*0.42,0,6.283); ctx2d.fill(); }
    // ring: status
    ctx2d.lineWidth=Math.max(1,1.2*Math.min(2,cam.s));
    if(n.lane==='system'){ ctx2d.strokeStyle='#94A3B8'; ctx2d.setLineDash([]); }
    else if(n.status==='built'){ ctx2d.strokeStyle='#12B76A'; ctx2d.setLineDash([]); }
    else if(n.status==='new'){ ctx2d.strokeStyle='rgba(255,255,255,.85)'; ctx2d.setLineDash([]); }
    else { ctx2d.strokeStyle='#F2C661'; ctx2d.setLineDash([2.5,2.5]); }
    ctx2d.beginPath(); ctx2d.arc(X,Y,r+2.4,0,6.283); ctx2d.stroke(); ctx2d.setLineDash([]);
    // step number in pipeline mode
    if(pipeMode && window.__pipeIdx && window.__pipeIdx[n.id]!==undefined){
      ctx2d.font=`900 ${Math.max(9,10*Math.min(1.5,cam.s))}px ui-rounded,system-ui`;
      ctx2d.textAlign='center'; ctx2d.textBaseline='bottom';
      ctx2d.fillStyle=n.c; ctx2d.fillText(window.__pipeIdx[n.id], X, Y-r-5);
    }
    // label
    if(!dim && !isStub && (labelZoom||emph||hoverNode===n)){
      ctx2d.font=`700 ${Math.max(8,9*Math.min(1.6,cam.s))}px ui-rounded,system-ui`;
      ctx2d.textAlign='center'; ctx2d.textBaseline='top';
      ctx2d.fillStyle='rgba(7,11,24,.8)'; ctx2d.fillText(n.label,X+1,Y+r+4.5);
      ctx2d.fillStyle=emph?'#fff':'#C9D3F2'; ctx2d.fillText(n.label,X,Y+r+4);
    }
    }
  }
  ctx2d.globalAlpha=1;
  // ---- pipeline screenshot filmstrip ----
  if(pipeMode && window.__pipeIdx){
    const cw=Math.min(260,Math.max(56,84*cam.s)), ch=cw*1.9;
    for(const n of nodes){
      const idx=window.__pipeIdx[n.id]; if(idx===undefined) continue;
      const X=sx(n.dx), Y=sy(n.dy);
      if(X<-cw||Y<-ch||X>W+cw||Y>H+ch) continue;
      // card
      ctx2d.save();
      ctx2d.beginPath(); ctx2d.roundRect(X-cw/2,Y-ch/2,cw,ch,10); ctx2d.clip();
      const im=n.screen?shotImg(n.screen):null;
      if(im&&im.complete&&im.naturalWidth){ ctx2d.drawImage(im,X-cw/2,Y-ch/2,cw,ch); }
      else { ctx2d.fillStyle='#141B38'; ctx2d.fillRect(X-cw/2,Y-ch/2,cw,ch);
        ctx2d.fillStyle='#3D4A78'; ctx2d.font='700 9px ui-rounded'; ctx2d.textAlign='center';
        ctx2d.fillText(n.screen||'state',X,Y); }
      ctx2d.restore();
      // border + step badge
      ctx2d.strokeStyle=n.c; ctx2d.lineWidth=2;
      ctx2d.beginPath(); ctx2d.roundRect(X-cw/2,Y-ch/2,cw,ch,10); ctx2d.stroke();
      ctx2d.fillStyle=n.c;
      ctx2d.beginPath(); ctx2d.arc(X-cw/2+11,Y-ch/2+11,10,0,6.283); ctx2d.fill();
      ctx2d.fillStyle='#fff'; ctx2d.font='900 11px ui-rounded'; ctx2d.textAlign='center'; ctx2d.textBaseline='middle';
      ctx2d.fillText(idx,X-cw/2+11,Y-ch/2+11);
      // name below
      ctx2d.font='800 10px ui-rounded,system-ui'; ctx2d.textBaseline='top';
      ctx2d.fillStyle='rgba(7,11,24,.85)'; ctx2d.fillText(n.label,X+1,Y+ch/2+5);
      ctx2d.fillStyle='#EAF0FF'; ctx2d.fillText(n.label,X,Y+ch/2+4);
      // hide the orb under the card
    }
  }
  // ---- selection marker (screen-space, always visible at any zoom) ----
  if(traced){
    const n=nodeById[traced];
    if(n){
      const fx=n.dx, fy=n.dy;
      const X=sx(fx), Y=sy(fy);
      const pulse=(t*0.0011)%1;
      // expanding pulse ring (screen px)
      ctx2d.strokeStyle=n.c; ctx2d.globalAlpha=(1-pulse)*0.9; ctx2d.lineWidth=2.5;
      ctx2d.beginPath(); ctx2d.arc(X,Y,9+pulse*24,0,6.283); ctx2d.stroke();
      // static halo
      ctx2d.globalAlpha=0.5; ctx2d.lineWidth=1.6;
      ctx2d.beginPath(); ctx2d.arc(X,Y,11,0,6.283); ctx2d.stroke();
      // core dot
      ctx2d.globalAlpha=1; ctx2d.fillStyle='#fff';
      ctx2d.beginPath(); ctx2d.arc(X,Y,4.4,0,6.283); ctx2d.fill();
      ctx2d.fillStyle=n.c;
      ctx2d.beginPath(); ctx2d.arc(X,Y,3,0,6.283); ctx2d.fill();
      // name chip
      ctx2d.font='800 11px ui-rounded,system-ui'; ctx2d.textAlign='left'; ctx2d.textBaseline='middle';
      const label=n.icon+' '+n.title;
      const tw=ctx2d.measureText(label).width;
      const bx=X+18, by=Y-18;
      ctx2d.fillStyle='rgba(7,11,24,.88)';
      ctx2d.beginPath(); ctx2d.roundRect(bx-7,by-11,tw+16,22,7); ctx2d.fill();
      ctx2d.strokeStyle=n.c; ctx2d.lineWidth=1.2;
      ctx2d.beginPath(); ctx2d.roundRect(bx-7,by-11,tw+16,22,7); ctx2d.stroke();
      ctx2d.fillStyle='#fff'; ctx2d.fillText(label,bx,by);
      ctx2d.globalAlpha=1;
    }
  }
  drawMini();
  requestAnimationFrame(frame);
}

// ---------- minimap ----------
const mm=document.getElementById('minimap'), mc=mm.getContext('2d');
let bnds=null;
function drawMini(){
  if(!bnds){ const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
    bnds={x0:Math.min(...xs)-300,y0:Math.min(...ys)-300,x1:Math.max(...xs)+300,y1:Math.max(...ys)+300}; }
  mc.clearRect(0,0,150,110); mc.fillStyle='#0B1020'; mc.fillRect(0,0,150,110);
  const s=Math.min(150/(bnds.x1-bnds.x0),110/(bnds.y1-bnds.y0));
  for(const n of nodes){ mc.fillStyle=n.c; mc.fillRect((n.x-bnds.x0)*s-1,(n.y-bnds.y0)*s-1,2.2,2.2); }
  if(traced){ const tn=nodeById[traced];
    if(tn){ mc.strokeStyle='#fff'; mc.lineWidth=1.4;
      mc.strokeRect((tn.x-bnds.x0)*s-3.5,(tn.y-bnds.y0)*s-3.5,7,7);
      mc.fillStyle=tn.c; mc.fillRect((tn.x-bnds.x0)*s-2,(tn.y-bnds.y0)*s-2,4,4); } }
  mc.fillStyle='#F59E0B'; mc.fillRect((0-bnds.x0)*s-2,(0-bnds.y0)*s-2,4,4);
  mc.strokeStyle='rgba(255,255,255,.9)'; mc.lineWidth=1;
  const wx=W/cam.s, hy=H/cam.s;
  mc.strokeRect((cam.x-wx/2-bnds.x0)*s,(cam.y-hy/2-bnds.y0)*s,wx*s,hy*s);
}


// ---------- info drawer ----------
const drawer=document.getElementById('drawer'), drawerIn=document.getElementById('drawerin');
function openInfo(html){ tip.style.display='none'; drawerIn.innerHTML='<button class="closex" onclick="closeInfo()">✕</button>'+html; drawer.classList.add('open'); drawer.scrollTop=0; }
window.closeInfo=()=>drawer.classList.remove('open');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeInfo(); });
const esc=s=>String(s||'').replace(/</g,'&lt;');
function statusBadge(n){ const map={built:['#12B76A','✓ BUILT in LMS'],new:['#1F6BF6','✦ NEW — from the PRD'],state:['#B98A00','STATE / BRANCH'],system:['#64748B','SYSTEM EVENT']};
  const c=n.lane==='system'?map.system:(map[n.status]||map.state);
  return `<span class="statusb" style="background:${c[0]}22;border:1px solid ${c[0]}88;color:${c[0]}">${c[1]}</span>`; }
function nodeInfoHTML(n){
  const inf=window.__INFO[n.screen]||null;
  const shot=n.screen&&SHOTS[n.screen]?`<img src="${SHOTS[n.screen]}">`:'';
  let h=`${statusBadge(n)}<h2>${esc(n.icon)} ${esc(n.title)}</h2><div class="sub">${n.screen?esc(n.screen)+' · ':''}${inf?esc(inf.flow):esc(n.lane)}</div>${shot}`;
  if(inf){
    h+=`<div class="sec"><h3>The feature in one line</h3><p>${esc(inf.purpose)}</p></div>`;
    if(inf.story) h+=`<div class="sec"><h3>User story</h3><div class="storyq">${esc(inf.story)}</div></div>`;
    if(inf.why) h+=`<div class="sec"><h3>Why it exists</h3><p>${esc(inf.why)}</p></div>`;
    if(inf.what) h+=`<div class="sec"><h3>What happens</h3><p>${esc(inf.what)}</p></div>`;
    if(inf.chain) h+=`<div class="sec"><h3>Main path</h3><div class="chain">▸ ${esc(inf.chain)}</div></div>`;
    if(inf.states&&inf.states.length) h+=`<div class="sec"><h3>Every state it can be in</h3><div class="chiprow">${inf.states.map(s=>`<span class="stchip">${esc(s)}</span>`).join('')}</div></div>`;
    if(inf.adapt) h+=`<div class="sec"><h3>Tablet & desktop</h3><p>▦ ${esc(inf.adapt)}</p></div>`;
    if(inf.edge) h+=`<div class="sec"><h3>Edge cases</h3><p>${esc(inf.edge)}</p></div>`;
    if(inf.kata) h+=`<div class="kata"><b>🐱 Kata:</b> ${esc(inf.kata.replace(/^Kata:\s*/,''))}</div>`;
    if(inf.metric) h+=`<div class="metric">🎯 ${esc(inf.metric)}</div>`;
  } else {
    h+=`<div class="sec"><p>${esc(n.desc||'A supporting state in the journey.')}</p></div>`;
  }
  return h;
}
function hubInfoHTML(h){
  const inf=window.__HUBINFO.hubs[String(h.id)]||{};
  const steps=nodes.filter(n=>n.h===h.id);
  const list=steps.slice(0,14).map(n=>`<span class="stchip">${esc(n.icon||'')} ${esc(n.label)}</span>`).join('');
  return `<span class="statusb" style="background:${h.c}22;border:1px solid ${h.c}88;color:${h.c}">PHASE · ${steps.length} steps</span>
  <h2>${esc(inf.name||h.name)}</h2>
  <div class="sec"><p>${esc(inf.brief||'')}</p></div>
  <div class="sec"><h3>What lives here</h3><div class="chiprow">${list}${steps.length>14?`<span class="stchip">+${steps.length-14} more — zoom in</span>`:''}</div></div>
  <div class="sec"><p style="color:#8FA0CC;font-size:11px">Hover any moon to preview it · click one for its full brief and to trace its flow.</p></div>`;
}
function sunInfoHTML(){
  const s=window.__HUBINFO.sun;
  return `<span class="statusb" style="background:#F59E0B22;border:1px solid #F59E0B88;color:#F59E0B">THE WHOLE JOURNEY</span>
  <h2>${esc(s.title)}</h2>
  <div class="sec"><p>${esc(s.brief)}</p></div>
  <div class="sec"><h3>The journey in 9 steps</h3><ol class="steps">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
  <div class="sec"><p style="color:#8FA0CC;font-size:11px">Click any planet to fly into it. Hover a moon for its screenshot. Click a moon to read its full feature brief and trace its path.</p></div>`;
}

// ---------- hit test ----------
function pick(e){
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=null,bd=16/Math.max(0.4,cam.s)+6;
  const cw=Math.min(260,Math.max(56,84*cam.s)), ch=cw*1.9;
  for(const n of nodes){
    const X=sx(n.dx),Y=sy(n.dy);
    if(pipeMode && window.__pipeIdx && window.__pipeIdx[n.id]!==undefined){
      if(Math.abs(mx-X)<cw/2+6 && Math.abs(my-Y)<ch/2+6){ best={type:'node',v:n}; bd=0; continue; }
    }
    const d=Math.hypot(X-mx,Y-my); if(d<bd){bd=d;best={type:'node',v:n};} }
  for(const h of hubs){ const X=sx(h.x),Y=sy(h.y),d=Math.hypot(X-mx,Y-my);
    if(d<Math.max(20,30*cam.s)&&d<bd){bd=d;best={type:'hub',v:h};} }
  const d0=Math.hypot(sx(0)-mx,sy(0)-my);
  if(d0<44*Math.max(0.7,cam.s)&&d0<bd) best={type:'sun',v:null};
  return best;
}

// ---------- events ----------
let drag=null,moved=false;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    cam.x=drag.cx-dx/cam.s; cam.y=drag.cy-dy/cam.s; anim=null; return; }
  const p=pick(e);
  hoverNode=p&&p.type==='node'?p.v:null;
  hoverHub=p&&p.type==='hub'?p.v:null;
  cv.style.cursor=p?'pointer':'grab';
  if(hoverNode && !drawer.classList.contains('open')){
    const n=hoverNode, shot=n.screen&&SHOTS[n.screen]?SHOTS[n.screen]:null;
    tip.innerHTML=(shot?`<img src="${shot}">`:'')+
      `<div class="tt">${n.icon||''} ${n.title}</div>`+
      `<div class="tk">${n.screen?n.screen+' · ':''}${n.status==='built'?'BUILT in LMS':n.status==='new'?'NEW (PRD)':n.lane==='system'?'system event':'state / branch'}</div>`+
      (n.desc?`<div class="td">${n.desc}</div>`:'');
    tip.style.display='block';
    const w=352; let x=e.clientX+18,y=e.clientY+18;
    tip.style.left=(x+w>innerWidth-8?e.clientX-w-10:x)+'px';
    requestAnimationFrame(()=>{ const h=tip.offsetHeight+10;
      tip.style.top=(y+h>innerHeight-8?innerHeight-h-8:y)+'px'; });
  } else tip.style.display='none';
});
cv.addEventListener('pointerup',e=>{ const wasDrag=moved; drag=null;
  if(wasDrag) return;
  const p=pick(e); if(!p){ traced=null; keepSet=null; focusHub=null; closeInfo(); clearPipeline(); return; }
  if(p.type==='hub'){ focusHub=p.v; flyTo(p.v.x,p.v.y,Math.max(0.9,900/(p.v.r*2.6))); openInfo(hubInfoHTML(p.v)); return; }
  if(p.type==='sun'){ openInfo(sunInfoHTML()); return; }
  const n=p.v;
  if(pipeMode){
    if(traced===n.id){ openInfo(nodeInfoHTML(n)); return; }
    if(keepSet && keepSet.has(n.id)){ traced=n.id; openInfo(nodeInfoHTML(n)); return; }
    // node outside the pipeline: fall through and re-trace from it
  } else if(traced===n.id){ traced=null; keepSet=null; closeInfo(); clearPipeline(); return; }
  traced=n.id; keepSet=new Set([...reach(n.id,adj),...reach(n.id,radj)]);
  layoutPipeline();
  openInfo(nodeInfoHTML(n));
});
cv.addEventListener('dblclick',e=>{
  const r=cv.getBoundingClientRect();
  const wx=cam.x+(e.clientX-r.left-W/2)/cam.s, wy=cam.y+(e.clientY-r.top-H/2)/cam.s;
  flyTo(wx,wy,Math.min(3.4,cam.s*2.1),350,e.clientX,e.clientY);
});
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const f=Math.exp(-e.deltaY*(e.deltaMode===1?0.04:0.0022));
  const ns=Math.min(3.4,Math.max(0.08,cam.s*f));
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left-W/2, my=e.clientY-r.top-H/2;
  cam.x+=mx/cam.s-mx/ns; cam.y+=my/cam.s-my/ns; cam.s=ns; anim=null;
},{passive:false});
document.getElementById('zin').onclick=()=>flyTo(cam.x,cam.y,Math.min(3.4,cam.s*1.7),220);
document.getElementById('zout').onclick=()=>flyTo(cam.x,cam.y,Math.max(0.08,cam.s*0.6),220);
document.getElementById('zfit').onclick=()=>flyTo(0,0,0.34);

// edge toggle
let et=document.getElementById('edgetog');
et.onclick=()=>{ edgeMode=edgeMode==='auto'?'on':edgeMode==='on'?'off':'auto'; et.textContent='🕸 edges: '+edgeMode; };

// search
const inp=document.getElementById('search');
inp.addEventListener('input',()=>{ const q=inp.value.trim().toLowerCase(); if(q.length<2) return;
  const hit=nodes.find(n=>(n.title+(n.screen||'')).toLowerCase().includes(q));
  if(hit) flyTo(hit.x,hit.y,1.5); });

// filter chips
document.querySelectorAll('.fchip').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    filter=b.dataset.f; };
});

// phase chips
const pj=document.getElementById('phasejump');
hubs.forEach(h=>{ const b=document.createElement('button');
  b.textContent=h.name.split(' ·')[0]; b.style.borderColor=h.c+'99';
  b.onclick=()=>{ focusHub=h; flyTo(h.x,h.y,Math.max(0.9,900/(h.r*2.6))); };
  pj.appendChild(b); });

flyTo(0,0,0.34,10);
requestAnimationFrame(frame);
}

window.__INFO = {"RA-01": {"name": "Splash", "flow": "JA-A01 · First-ever app open (cold start)", "status": "new", "purpose": "Brand mark + wordmark + school line, nothing else interactive. Communicates \"alive\" instantly; hand-off is automatic.", "adapt": "full-viewport centered brand on all factors; no nav, no chrome — identical layout, only safe-area changes.", "states": ["default ≤1s", "slow-network &gt;3s → progress bar", "offline → honest \"no connection — retry\" (retry = primary)"], "story": "“As a new student opening the app for the first time, I want to reach a real screen in under a second and understand what this app is, so that I don't bounce before I'm even enrolled.”", "why": "Cold open is the single highest-abandon moment of the product's life; a dead white splash reads as broken, not loading. The splash's only job is to prove aliveness and hand off — never to teach, never to stall.", "what": "Splash → session check (none on first open) → login RA-02. No local state is trusted; enrolment is verified server-side only. Success = routed into JA-A02 within a second.", "how": "Brand mark only, ≤1s; if the session check passes 3s the splash grows a determinate-feeling progress bar (never a spinner alone, never blank); offline gets an honest retry, not a hang. Pixel-identical on web vs app. Metric: cold→authenticated ≥90%.", "kata": "Kata: absent on splash (speed is the message); on RA-02 he sits above the buttons with warm-teacher: \"New? Sit anywhere. The register sorts itself.\" — first impression = the product has a character.", "edge": "Edge cases: slow network → progress indicator after 3s; device clock skew breaking TLS → plain-language error + support link; deep-link arrival before auth → remember intent, restore after session (joins A07's queue). ID note: the login screen (RA-02) is specified in JA-A02 per D-14; this flow only owns RA-01.", "metric": "cold→authenticated ≥90%.", "chain": "student taps app icon — no stored session → RA-01 splash ≤1s, brand only → system: session check returns “none” → RA-02 login (JA-A02)"}, "RA-02": {"name": "Login (S-01)", "flow": "JA-A02 · Login — phone number or email amended D-14", "status": "built", "purpose": "Smart identifier field + SSO fallback. Button label follows detection live; below: \"School gave you credentials? They work right here.\"", "adapt": "centered auth card max 420px; desktop adds brand panel left (xl only); no nav.", "states": ["empty", "phone detected", "email detected", "SSO redirecting", "offline", "invalid format (inline)"], "story": "“As a student whose account my school already created, I want to sign in with the phone number or email they registered me with — no college email, no password.”", "why": "Students don't have college-issued emails; the phone is the identity they actually check. Accounts are pre-provisioned — the credentials message (email or SMS) is the front door, and first sign-in must feel like an invitation, not IT setup.", "what": "One smart field: digits/+ → phone (SMS OTP route), text with @ → email (magic-link route, unchanged per D-14). SSO stays for schools that have it. The credentials message deep-links into the app with the identifier pre-filled.", "how": "Detection is live as they type — the primary button relabels (\"Text me a code\" / \"Email me a link\") before submit, so there is no wrong choice. Uniform response on both routes (no enumeration, R1-04). Metric: first-sign-in completion ≥90% from credentials message.", "kata": "Kata: warm-teacher: \"The number your school used. Type it — I saved you a seat.\"", "edge": "Edge cases: identifier matches a phone and email on different accounts → ask which (this reveals nothing — both are theirs); landline number → offer email route kindly; credentials message older than 30 days → still works, re-verifies on entry. ID note: RA-05 (standalone e-mail verify) retired under D-14 — folded into RA-04; later IDs keep their numbers per the stable-ID rule.", "metric": "first-sign-in completion ≥90% from credentials message.", "chain": "student taps credentials SMS/email link → identifier pre-filled → RA-02 login → types identifier — detection runs live → RA-02 button relabels “Text me a code” / “Email me a link” → taps submit → RA-04 uniform sent state (JA-A03)"}, "RA-03": {"name": "SSO handoff", "flow": "JA-A02 · Login — phone number or email amended D-14", "status": "new", "purpose": "Brand interstitial while the Google/Apple round-trip runs — spinner + “don't close”, cancel drops back to RA-02. Slow IdP (&gt;5s) gains a “use email instead” escape.", "adapt": "same centered auth card as RA-02 — continuity matters mid-redirect.", "states": ["redirecting", "slow &gt;5s (escape link)", "cancelled → RA-02", "IdP error → toast + retry"], "story": "“As a student whose account my school already created, I want to sign in with the phone number or email they registered me with — no college email, no password.”", "why": "Students don't have college-issued emails; the phone is the identity they actually check. Accounts are pre-provisioned — the credentials message (email or SMS) is the front door, and first sign-in must feel like an invitation, not IT setup.", "what": "One smart field: digits/+ → phone (SMS OTP route), text with @ → email (magic-link route, unchanged per D-14). SSO stays for schools that have it. The credentials message deep-links into the app with the identifier pre-filled.", "how": "Detection is live as they type — the primary button relabels (\"Text me a code\" / \"Email me a link\") before submit, so there is no wrong choice. Uniform response on both routes (no enumeration, R1-04). Metric: first-sign-in completion ≥90% from credentials message.", "kata": "Kata: warm-teacher: \"The number your school used. Type it — I saved you a seat.\"", "edge": "Edge cases: identifier matches a phone and email on different accounts → ask which (this reveals nothing — both are theirs); landline number → offer email route kindly; credentials message older than 30 days → still works, re-verifies on entry. ID note: RA-05 (standalone e-mail verify) retired under D-14 — folded into RA-04; later IDs keep their numbers per the stable-ID rule.", "metric": "first-sign-in completion ≥90% from credentials message.", "chain": "student taps credentials SMS/email link → identifier pre-filled → RA-02 login → types identifier — detection runs live → RA-02 button relabels “Text me a code” / “Email me a link” → taps submit → RA-04 uniform sent state (JA-A03)"}, "RA-04": {"name": "Sent state (uniform)", "flow": "JA-A03 · OTP &amp; magic-link verification amended D-14", "status": "built", "purpose": "\"If this number/email is registered, a code/link is on its way\" — identical for every input, with the no-enumeration lock note. Resend with visible cooldown.", "adapt": "centered card max 420px; illustration scales, layout identical.", "states": ["just sent (SMS)", "just sent (email)", "resend cooling", "throttled (neutral)", "offline"], "story": "“As a student, I want the code or link to just work — and to never learn anything about whether my identifier is registered.”", "why": "The uniform response is the security contract; the two channels (SMS OTP, email link) must feel identical in tone and honesty — and neither may leak who is enrolled.", "what": "Phone → 6-digit SMS code, single-use, 10-min TTL → typed in-app. Email → 6-digit single-use magic link, 10-min TTL → tapped, lands in-app. Per-IP and per-identifier throttles; 5 failed attempts → 15-min cooldown, neutral copy.", "how": "OTP entry auto-advances, auto-submits on the 6th digit, paste-from-SMS supported; wrong-code errors are uniform (\"that code didn't work — request a fresh one\") with no attempt counter shown. Metric: OTP/link → session ≥85%.", "kata": "Kata: smug: \"Six digits. I counted them as you typed. Don't make it weird.\"", "edge": "Edge cases: SMS delayed &gt;60s → voice-call fallback offered; email prefetch consuming link → GET doesn't consume, confirm step does; same code requested twice → first code stays valid until TTL (no race).", "metric": "OTP/link → session ≥85%.", "chain": "RA-02 submit → server issues code/link (uniform response) → RA-04 sent state → SMS arrives → student types digits (paste supported) → RA-15 auto-submits on 6th digit → server: code valid → session created → RA-10 home / first-run onboarding"}, "RA-15": {"name": "OTP entry", "flow": "JA-A03 · OTP &amp; magic-link verification amended D-14", "status": "new", "purpose": "Six boxes, big numerals, auto-advance, auto-submit on the 6th digit; \"didn't arrive?\" → resend + switch-to-email escape.", "adapt": "centered card; OTP boxes grow to 56px on desktop, stay single row.", "states": ["entering", "auto-submitting", "wrong code (uniform)", "expired → one-tap resend", "success → session"], "story": "“As a student, I want the code or link to just work — and to never learn anything about whether my identifier is registered.”", "why": "The uniform response is the security contract; the two channels (SMS OTP, email link) must feel identical in tone and honesty — and neither may leak who is enrolled.", "what": "Phone → 6-digit SMS code, single-use, 10-min TTL → typed in-app. Email → 6-digit single-use magic link, 10-min TTL → tapped, lands in-app. Per-IP and per-identifier throttles; 5 failed attempts → 15-min cooldown, neutral copy.", "how": "OTP entry auto-advances, auto-submits on the 6th digit, paste-from-SMS supported; wrong-code errors are uniform (\"that code didn't work — request a fresh one\") with no attempt counter shown. Metric: OTP/link → session ≥85%.", "kata": "Kata: smug: \"Six digits. I counted them as you typed. Don't make it weird.\"", "edge": "Edge cases: SMS delayed &gt;60s → voice-call fallback offered; email prefetch consuming link → GET doesn't consume, confirm step does; same code requested twice → first code stays valid until TTL (no race).", "metric": "OTP/link → session ≥85%.", "chain": "RA-02 submit → server issues code/link (uniform response) → RA-04 sent state → SMS arrives → student types digits (paste supported) → RA-15 auto-submits on 6th digit → server: code valid → session created → RA-10 home / first-run onboarding"}, "RA-06": {"name": "Not-enrolled recovery", "flow": "JA-A04 · Login failure recovery", "status": "built", "purpose": "Teaches the product while recovering: lecturer adds students, not the app. Actions: \"Ask my lecturer to enrol me\" (draft provided) / contact support (pre-filled).", "adapt": "centered recovery card max 480px; actions stack on mobile, row on desktop.", "states": ["first time", "repeated (ticket pre-filled + lecturer notified)", "ticket sent confirmation"], "story": "“As a student who hit a wall at login, I want exactly one obvious next step, so that a failure never becomes a reason to quit.”", "why": "Failure screens are where funnels die silently. The rule: every failure state carries exactly one recovery action — choice under failure is cruelty.", "what": "Three failure states (SSO down / link expired / not enrolled), each a full screen with one primary recovery. Not-enrolled doubles as a route: \"ask your lecturer\" + pre-filled support — externally uniform with A03's response.", "how": "Not-enrolled never reveals anything an enumerator could distinguish from A03 — same words, plus the lecturer/support route behind channel proof. Repeated not-enrolled from the same email → support ticket pre-filled + lecturer notified. Metric: failure→recovered ≥60% same session.", "kata": "Kata: worried, one line, no jokes about the institution: \"This one isn't your fault. One tap fixes it.\" — he absorbs frustration so the school doesn't.", "edge": "Edge cases: support link opened → conversation tagged with flow A04 + email hash; lecturer enrols while student is on this screen → poll/webhook refreshes into A02 automatically.", "metric": "failure→recovered ≥60% same session.", "chain": "server: identifier check returns not-enrolled (after channel proof) → RA-06 recovery — uniform words + lecturer route → taps “Ask my lecturer to enrol me” → RA-06 ticket-sent confirmation → lecturer enrols (webhook) → auto-refresh into RA-02 login"}, "RA-07": {"name": "Expired / SSO-down recovery", "flow": "JA-A04 · Login failure recovery", "status": "new", "purpose": "One screen template, one action: expired link → \"Send a fresh link\"; SSO down → \"Use email instead\". Neutral, no blame, no error codes.", "adapt": "centered card max 480px; support link becomes inline row on desktop.", "states": ["link-expired", "sso-down", "recovery sent", "recovery failed → support"], "story": "“As a student who hit a wall at login, I want exactly one obvious next step, so that a failure never becomes a reason to quit.”", "why": "Failure screens are where funnels die silently. The rule: every failure state carries exactly one recovery action — choice under failure is cruelty.", "what": "Three failure states (SSO down / link expired / not enrolled), each a full screen with one primary recovery. Not-enrolled doubles as a route: \"ask your lecturer\" + pre-filled support — externally uniform with A03's response.", "how": "Not-enrolled never reveals anything an enumerator could distinguish from A03 — same words, plus the lecturer/support route behind channel proof. Repeated not-enrolled from the same email → support ticket pre-filled + lecturer notified. Metric: failure→recovered ≥60% same session.", "kata": "Kata: worried, one line, no jokes about the institution: \"This one isn't your fault. One tap fixes it.\" — he absorbs frustration so the school doesn't.", "edge": "Edge cases: support link opened → conversation tagged with flow A04 + email hash; lecturer enrols while student is on this screen → poll/webhook refreshes into A02 automatically.", "metric": "failure→recovered ≥60% same session.", "chain": "server: identifier check returns not-enrolled (after channel proof) → RA-06 recovery — uniform words + lecturer route → taps “Ask my lecturer to enrol me” → RA-06 ticket-sent confirmation → lecturer enrols (webhook) → auto-refresh into RA-02 login"}, "RA-08": {"name": "Account switcher", "flow": "JA-A05 · Logout &amp; account switch (shared device)", "status": "built", "purpose": "\"Who's learning?\" — recent accounts as large avatar rows + \"add another\". Each row shows name, program, streak — identity is glanceable before tap.", "adapt": "full page on all factors (not a sheet): avatar rows max 560px centered; desktop shows 2-col account cards + add-account tile.", "states": ["1 account cached", "2+ cached", "none cached (pure login)", "offline (switch allowed, sync queued)"], "story": "“As a student on a school tablet my class shares, I want to hand it to the next student without my streak, caches or floors ever touching theirs.”", "why": "Shared tablets are the default hardware in Georgian vocational schools; cross-account contamination would destroy trust in every metric the ministry sees.", "what": "Profile → \"Not you? Switch account\" → confirm sheet → session cleared, push re-keyed to (device, new account), previous account's offline cache sealed under its account ID → next student logs into their own state. Zero merging.", "how": "The confirm sheet makes the stakes explicit (\"Nino's offline floors stay sealed under Nino's account\") — one destructive-sounding action, fully explained. The switcher shows avatars of recent accounts for one-tap return. Metric: cross-account contamination = 0 (QA invariant).", "kata": "Kata: playful-angry on the sheet: \"Dato gets his own streak. Hands off Nino's.\" — the rule lands as loyalty, not admin.", "edge": "Edge cases: student A's unsubmitted offline floors → preserved for A's next login, never attributed to B; push tokens re-keyed so A's save-push never lands on B's session.", "metric": "cross-account contamination = 0 (QA invariant).", "chain": "student taps Profile → “Not you? Switch account” → RA-08 account switcher → taps Dato's row → RA-09 confirm sheet — stakes listed → taps red “Switch account” → cache sealed · push re-keyed → RA-02 for Dato → Dato's own RA-10 home"}, "RA-09": {"name": "Switch confirm sheet", "flow": "JA-A05 · Logout &amp; account switch (shared device)", "status": "new", "purpose": "Modal bottom sheet: what happens to caches, offline floors, push. Confirm = destructive-style button; cancel is the safe default.", "adapt": "mobile bottom sheet → centered dialog; destructive confirm keeps left-to-right order.", "states": ["with unsubmitted offline work (warning row)", "clean state", "switching (progress)"], "story": "“As a student on a school tablet my class shares, I want to hand it to the next student without my streak, caches or floors ever touching theirs.”", "why": "Shared tablets are the default hardware in Georgian vocational schools; cross-account contamination would destroy trust in every metric the ministry sees.", "what": "Profile → \"Not you? Switch account\" → confirm sheet → session cleared, push re-keyed to (device, new account), previous account's offline cache sealed under its account ID → next student logs into their own state. Zero merging.", "how": "The confirm sheet makes the stakes explicit (\"Nino's offline floors stay sealed under Nino's account\") — one destructive-sounding action, fully explained. The switcher shows avatars of recent accounts for one-tap return. Metric: cross-account contamination = 0 (QA invariant).", "kata": "Kata: playful-angry on the sheet: \"Dato gets his own streak. Hands off Nino's.\" — the rule lands as loyalty, not admin.", "edge": "Edge cases: student A's unsubmitted offline floors → preserved for A's next login, never attributed to B; push tokens re-keyed so A's save-push never lands on B's session.", "metric": "cross-account contamination = 0 (QA invariant).", "chain": "student taps Profile → “Not you? Switch account” → RA-08 account switcher → taps Dato's row → RA-09 confirm sheet — stakes listed → taps red “Switch account” → cache sealed · push re-keyed → RA-02 for Dato → Dato's own RA-10 home"}, "RA-10": {"name": "Warm-start Home", "flow": "JA-A06 · Returning user warm start", "status": "built", "purpose": "Home with rollups pre-applied + Kata's continuity line (\"Back? I noted the 2-day gap. We continue exactly where you left off.\"). Resume-first when a floor is unfinished.", "adapt": "bottom nav → rail (tablet) / side nav (desktop); resume hero spans 2 of 3 columns; gap-note inline.", "states": ["fresh day (quests reset)", "streak at risk (amber)", "resume available", "season ceremony queued", "silent-refresh in progress"], "story": "“As a returning student, I want the app to open exactly where my life left off — streak intact, quests reset, season checked — in under two seconds.”", "why": "Warm start is 95% of all opens; every extra second here is paid daily by every student (R1-01: no login wall for stored sessions).", "what": "Splash ≤0.5s → local session validation → Home directly. Overnight rollups applied silently: streak rollover, decay tick, quest reset, season check — with changes already reflected (amber flame, ceremony queued).", "how": "Resume beats greeting: if an unfinished floor exists, Home shows \"Resume — 3 min left\" as the primary action. Refresh-token near expiry → silent background refresh; failure → non-destructive login with state preserved. Metric: time-to-interactive ≤2.5s p75.", "kata": "Kata: smug continuity line — he noticed the gap AND kept the seat warm. Judgment as care.", "edge": "Edge cases: streak died overnight → Home arrives with repair state queued (JA-E domain), never a surprise modal; server clock vs device clock conflict → server wins, shown honestly.", "metric": "time-to-interactive ≤2.5s p75.", "chain": "student taps app icon — stored session exists → RA-01 splash ≤0.5s → local session validates → rollups applied silently: streak rollover · decay tick · quest reset · season check → RA-10 home — resume hero + Kata continuity line"}, "RA-11": {"name": "Re-auth overlay", "flow": "JA-A07 · Session expiry mid-task", "status": "new", "purpose": "Sheet over frozen context: \"One tap — your answer is safe.\" SSO re-prompt or magic link; floor timer visibly paused.", "adapt": "modal everywhere — centered dialog max 400px, scrim, focus trapped.", "states": ["over floor (timer paused)", "over purchase (intent queued)", "re-authing", "replay success → context restores", "abandoned (24h hold note)"], "story": "“As a student whose session expires mid-floor, I want to re-login without losing the answer I was about to submit — ever.”", "why": "Expiry-related progress loss is the single unforgivable bug in a streak product (QA invariant: = 0).", "what": "401 → interaction freezes, in-flight action queued locally with idempotency key → non-destructive re-auth overlay (timer pauses) → re-auth → queued action replays → student lands exactly where they were.", "how": "The overlay is a sheet, not a route — the floor stays visible (dimmed) behind it, so context is never lost. If abandoned, the queue holds 24h with resume state (JA-C10). Metric: expiry-related progress loss = 0.", "kata": "Kata: worried→proud on restore: \"Held it. Nothing lost. As expected.\" — the save is the emotional beat.", "edge": "Edge cases: replay conflicts with server state (answer already counted) → idempotency key dedupes silently; purchase intent replay → re-validates price/offer before charging.", "metric": "expiry-related progress loss = 0.", "chain": "server: 401 on answer submit → client: action queued with idempotency key · timer ⏸ · floor freezes → RA-11 re-auth sheet over dimmed floor → student re-auths (SSO / email link) → session renewed → queued answer replays → floor resumes at Q6 · toast “submitted ✓ — nothing lost”"}, "RA-12": {"name": "Language picker", "flow": "JA-A08 · Language &amp; locale switch amended D-19", "status": "built", "purpose": "Rows = admin-enabled languages only (MVP: 2). Untranslated-content badge explained inline; \"new language available\" pill when config adds one.", "adapt": "mobile sheet → centered dialog; language list becomes 2-col grid on desktop.", "states": ["ka active (MVP)", "en active", "newly-enabled language (badge)", "content-not-translated badge visible", "overflow-safe long strings"], "story": "“As a student, I want the app in the language I think in — and to only ever see languages my school actually supports.”", "why": "The catalog is an admin decision (D-19): a school enables languages when its content is ready for them, never before. MVP ships English + Georgian; any future language appears the day an admin flips it on — not as a teaser that leads to untranslated floors.", "what": "Settings → language → picker renders the config-driven list (MVP: ქართული / English) → UI strings hot-swap instantly → choice persists per account across devices. Content (floor) language is per-program; untranslated content shows an honest badge (\"this floor is English-only for now\") instead of pretending.", "how": "Live preview: each row renders in its own language; radio select applies instantly, no save button. Layout budget rule (R9-04): strings wrap, never clip — CI pseudo-localization keeps it true. New languages enabled by admin appear with a \"new\" badge. Metric: switch-related layout defects = 0.", "kata": "Kata: absent — utility screens keep his scarcity law; his lines simply obey the new locale instantly, and he never mocks anyone's language choice.", "edge": "Edge cases: admin disables a language a student is using → graceful fallback to school default + one-line notice (never a silent swap); Georgian long compound strings → layout budget wraps; content partially translated → per-floor badge, not per-app pretense.", "metric": "switch-related layout defects = 0.", "chain": "student opens Profile → Language → RA-12 picker — config-driven list (MVP: ქართული / English) → taps the English row → UI strings hot-swap instantly · choice persisted per account, syncs to 💻 → Kata's next line arrives in the new locale"}, "RA-13": {"name": "Connect Google / Apple", "flow": "JA-A09 · Connect accounts &amp; contact verification → streak freezes new · D-14", "status": "new", "purpose": "Two branded buttons, one-tap OAuth; value prop in one line: \"Never type a code again.\"", "adapt": "mobile sheet → centered dialog max 440px; provider buttons full-width on all.", "states": ["none connected", "Google connected", "Apple connected", "both", "OAuth error (neutral)", "offline"], "story": "“As a student, I want one-tap sign-in forever — and if securing my account earns me streak freezes, I will absolutely do it today.”", "why": "Security hygiene is the least gamified thing in most products and the most gamifiable in this one: verify email + verify phone = +1 streak freeze each. The product gets reachable channels and recovery paths; the student gets insurance on their streak. Everyone wins, nobody lectures.", "what": "Post-auth (day-1 quest + profile home): connect Google / Apple for one-tap sign-in; verify the email and phone on file (loop back through A03's code/link). Each verification claims +1 streak freeze, granted with ceremony, visible in the streak sheet.", "how": "Framed as a quest (\"Secure your streak\") with two checkmarks and two rewards, not as a settings chore. Verification reuses the OTP/link machinery — no new backend concepts. Metric: both-channels-verified ≥55% of actives by day 7.", "kata": "Kata: hype on 2/2: \"Two channels, two freezes. Your streak just got insurance. I almost respect that.\" On ignore (day 3): playful-angry \"Unfrozen streaks die in winter. Your choice.\"", "edge": "Edge cases: phone/email already verified at provisioning → quest pre-completed, freeze granted retroactively with the ceremony intact; channel changes later → re-verification required, freeze not revoked (no take-backsies — punishment kills the deal).", "metric": "both-channels-verified ≥55% of actives by day 7.", "chain": "day-1 quest card “Secure your s ept rather than revealing the answer — an answer-revealer would train dependence and poison calibration.", "what": "Tap 💡 → RC-07 sheet prices both kinds of help pre-commit (elimination −5⬡, scaffold −10⬡, free in week 1) → confirm → one elimination/scaffold revealed → ledger writes the spend → item scores normally; wager voided after hint (calibration purity).", "how": "The sheet discloses price and pedagogical style before a coin moves — Δ2 calm economy: no surprise debits. Insufficient coins → earn-path deep link (JA-F05), never a purchase wall. Metric: hint→subsequent correct ≥70%.", "kata": "Kata: playful-angry on third hint in one floor: “Again? Fine. But we’re reading the guidebook after.” — judgment that redirects, never blocks.", "edge": "Edge cases: hint on wagered item → wager voided, stake returned, stated plainly · hint revealed then floor abandoned → spend stands (ledger honest), hint re-shown free on resume · insufficient coins mid-floor → earn path pauses the floor, resume intact (JA-C10).", "metric": "hint→subsequent correct ≥70%.", "chain": "taps 💡 Hint on RC-04 → RC-07 sheet · cost table pre-commit → confirms elimination −5⬡ → ledger writes −5⬡ · 2 wrong options grey out on RC-04 → item scores normally · live wager voided, stated"}, "RC-08": {"name": "Wager card", "flow": "JA-C06 · Place a confidence wager H-07", "status": "new", "purpose": "Confidence tiers (Calm / Confident / Sure) with payout math per tier, decline path equal in dignity, stake summary pre-commit.", "adapt": "centered wager card max 560px; tiers 3-up row desktop / stack mobile; stake math per tier; decline text-link equal dignity.", "states": ["offered", "tier picked", "declined (no framing)", "resolved win", "resolved loss", "hint-voided"], "story": "“As an overconfident student, I want to put coins where my mouth is — and as a cautious one, I want skipping to be completely free.”", "why": "Wagers convert bravado into calibration data: the (confidence, correctness) pairs feed each student’s calibration radar — over 4 weeks the error trend must bend down.", "what": "Safety item shown → RC-08 wager card (😐 Calm / 😎 Confident / 🔥 Sure, payout math per tier) → stake locked pre-answer (coins only, never XP) → answer → payout resolves: win pays the tier’s posted return, loss sends the stake to the league pool → calibration pair logged.", "how": "Decline is always free and never framed as cowardice — skipping is a choice, not a confession. Offered at most once a floor, never nudged twice in a week. Hint pre-voids the wager (JA-C05). Coins-only stakes protect progression from gambling. Metric: calibration error trends down per student over 4 wks.", "kata": "Kata: smug on 🔥 Sure picks: “All in. I admire the confidence. The data will judge us both.” On loss: “Noted. Calibrated.”", "edge": "Edge cases: hint used → wager voided pre-answer, stake returned · connection dies after wager → resolved server-side, shown honestly on reconnect · chronic 100%-wrong pattern → wager frequency reduced quietly (protection, not punishment) · never nudged twice in a week, decline never punished.", "metric": "calibration error trends down per student over 4 wks.", "chain": "RC-02 intro discloses the wager floor → floor starts · safety item shown → RC-08 offered · tiers + payout math → locks 😎 Confident · 10⬡ → answers the floor → pass: +25⬡ paid to wallet → calibration pair logged"}, "RC-10": {"name": "Feedback wrong + retry", "flow": "JA-C07 · Wrong answer → feedback → retry all", "status": "built", "purpose": "Verdict + correct answer + one-breath why + named trap + inbox notice (pays double ⬡ on clear, D-21) + free retry primary. Kind copy throughout; combo reset framed as stake, never shame.", "adapt": "as RC-09 layout; correct-answer block + named-trap row + variant strip; free retry primary pinned bottom.", "states": ["wrong (trap named)", "retry available", "retry correct (no XP, files as “recovered”)", "final wrong (files as “open”, +⬡ on clear)", "explanation missing → guidebook fallback"], "story": "“As a student who just missed one, I want the trap named in five seconds and one free shot back — not a red screen of shame.”", "why": "Wrong answers are the product’s coaching moments. The combo reset is shown as a stake lost, never a punishment; the retry is free, so recovering is always cheaper than quitting.", "what": "Combo zeroes (stake shown, not scolded) → wrong state: correct answer + one-breath why + named trap, kind copy → one free retry → the question files into the mistakes section either way (D-21): retry-correct marks it “recovered” (no XP, honest), final-wrong marks it “open” — both redo-able in RD-01 with the student’s own wrong answer preserved beside the correct one, paying double coins on clear.", "how": "The trap gets a name because students remember labels, not paragraphs. Retry honesty: the retry fixes the moment, the section keeps the lesson (D-21). No explanation on file → guidebook fallback (RC-03) + auto content flag (R3-05). Metric: feedback→retry uptake ≥40%.", "kata": "Kata: disappointed but constructive: “Wrong. It happens to the diligent. Read the trap — I named it for you. Now take the free shot.”", "edge": "Edge cases: retry correct → question still files, marked “recovered”, no XP (D-21) · retry wrong → files as “open” with both attempts tagged · section shows the student’s own wrong answer beside the correct one for analysis · explanation missing → guidebook fallback (RC-03) + auto content flag (R3-05) · offline → verdict and filing queue locally, sync on reconnect (submit loss = 0).", "metric": "feedback→retry uptake ≥40%.", "chain": "taps Submit on Q4 (“align-items: middle”) → RC-10 verdict: wrong — combo ×4 resets (stake shown), trap named → taps “Retry once — free” → RC-04 same item re-presented → retry correct → files to RD-01 as “recovered”, no XP (D-21)"}, "RC-11": {"name": "Floor summary pass", "flow": "JA-C08 · Complete floor → the payout (S-10) all", "status": "built", "purpose
